<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>/*__TITLE__*/</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/*__FONTS_IMPORT__*/

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #FBF8EF; }
.view { display: none; }
.view.active { display: block; }
img[alt="SAAIS"] { cursor: pointer; }

/*__SCOPED_CSS__*/

/* --- prototype chrome (not part of the original mockup) --- */
#proto-bar {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 6px;
  background: #1D2F0A;
  border: 1px solid #2F4A12;
  border-radius: 999px;
  padding: 6px 8px 6px 14px;
  box-shadow: 0 8px 24px rgba(15,20,5,0.35);
  font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
}
#proto-bar .proto-label {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(246,242,228,0.55);
  font-weight: 600;
  margin-right: 4px;
}
#proto-bar button {
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  border-radius: 999px;
  padding: 7px 12px;
  border: 1px solid transparent;
  background: transparent;
  color: rgba(246,242,228,0.75);
}
#proto-bar button:hover { color: #FBF8EF; background: rgba(246,242,228,0.08); }
#proto-bar button.active { background: #E0A82E; color: #3A2A05; }
#proto-bar button#proto-map { background: rgba(224,168,46,0.16); color: #F7E9C4; }
#proto-bar button#proto-map:hover { background: rgba(224,168,46,0.28); }
#proto-bar .proto-sep { width: 1px; height: 20px; background: rgba(246,242,228,0.16); margin: 0 2px; }

#proto-sitemap {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: rgba(22,32,12,0.55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
}
#proto-sitemap.open { display: flex; }
#proto-sitemap .sm-panel {
  background: #FBF8EF;
  border-radius: 10px;
  max-width: 880px;
  width: 100%;
  max-height: 84vh;
  overflow-y: auto;
  padding: 28px 30px 32px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.35);
}
#proto-sitemap .sm-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
#proto-sitemap .sm-title {
  font-family: 'Syne', 'Segoe UI', system-ui, sans-serif;
  font-weight: 700;
  font-size: 20px;
  color: #16200C;
}
#proto-sitemap .sm-close {
  cursor: pointer;
  border: 1px solid #E1DBC6;
  background: #fff;
  border-radius: 6px;
  padding: 6px 12px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: #16200C;
}
.sm-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 22px; }
.sm-group-title {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #8C8A76;
  margin-bottom: 8px;
}
.sm-item {
  display: block;
  width: 100%;
  text-align: left;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 500;
  color: #2F4A12;
  background: transparent;
  border: none;
  border-radius: 4px;
  padding: 6px 8px;
  cursor: pointer;
}
.sm-item:hover { background: #EFEADB; color: #B0761A; }
.sm-group { margin-bottom: 4px; }

/* --- interactive layer (buttons, dropdowns, modals, toasts) --- */
[data-select] { position: relative; }
[data-select] .sel-label { cursor: pointer; user-select: none; }
[data-select] .sel-menu {
  position: absolute; left: 0; right: 0; top: calc(100% + 5px); z-index: 400;
  background: #FFFFFF; border: 1px solid #E1DBC6; border-radius: 6px;
  box-shadow: 0 10px 26px rgba(22,32,12,0.16); padding: 4px; display: none;
  max-height: 260px; overflow-y: auto;
  font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
}
[data-select].open .sel-menu { display: block; }
[data-select] .sel-opt {
  padding: 7px 10px; border-radius: 4px; font-size: 13.5px; color: #16200C; cursor: pointer;
}
[data-select] .sel-opt:hover { background: #EFEADB; }
[data-select] .sel-opt.selected { color: #2F4A12; font-weight: 600; background: #F2EDDC; }
[data-checkbox] { cursor: pointer; }
[data-pill] { cursor: pointer; }
[contenteditable="true"] { cursor: text; outline: none; }
[contenteditable="true"].placeholder { color: #8C8A76; }

.proto-toast-wrap {
  position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 10600;
  display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none;
}
.proto-toast {
  background: #1D2F0A; color: #F6F2E4; border: 1px solid #2F4A12; border-radius: 6px;
  padding: 10px 18px; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  font-size: 13px; font-weight: 500; box-shadow: 0 10px 26px rgba(15,26,6,0.3);
  opacity: 0; transform: translateY(6px); transition: opacity .18s ease, transform .18s ease;
  max-width: 420px; text-align: center;
}
.proto-toast.show { opacity: 1; transform: translateY(0); }

.proto-modal-overlay {
  position: fixed; inset: 0; background: rgba(15,26,6,0.55); z-index: 10300;
  display: none; align-items: center; justify-content: center; padding: 40px;
  font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
}
.proto-modal-overlay.open { display: flex; }
.proto-modal {
  width: 560px; max-width: 100%; max-height: 86vh; overflow-y: auto;
  background: #FFFFFF; border-radius: 10px; box-shadow: 0 30px 80px rgba(15,26,6,0.4);
}
</style>
</head>
<body>

<!--__SECTIONS__-->

<div id="proto-toast-wrap"></div>
<div id="proto-modal-overlay" class="proto-modal-overlay"><div class="proto-modal" id="proto-modal-body"></div></div>

<div id="proto-bar">
  <span class="proto-label">Demo as</span>
  <button type="button" data-role="student">Student</button>
  <button type="button" data-role="adviser">Adviser</button>
  <button type="button" data-role="admin">Admin</button>
  <span class="proto-sep"></span>
  <button type="button" id="proto-home">Home</button>
  <button type="button" id="proto-map">Sitemap</button>
</div>

<div id="proto-sitemap">
  <div class="sm-panel">
    <div class="sm-head">
      <div class="sm-title">Jump to any screen</div>
      <button type="button" class="sm-close">Close</button>
    </div>
    <div class="sm-grid">
      <!--__SITEMAP__-->
    </div>
  </div>
</div>

<script>
(function () {
  // Route slug -> the split file that owns it. Unlike the single-file
  // prototype, navigating to a route outside this file does a real
  // page load; navigating within this file's own routes just changes
  // the hash, same as before.
  var ROUTE_FILE = /*__ROUTE_FILE_JSON__*/;
  var DEFAULT_ROUTE = /*__DEFAULT_ROUTE_JSON__*/;
  var routeSet = {};
  Object.keys(ROUTE_FILE).forEach(function (r) { routeSet[r] = true; });

  var CURRENT_FILE = location.pathname.split('/').pop() || 'index.html';

  var GLOBAL_ACTIONS = {
    'Sign in': 'login',
    'Sign out': 'login',
    'Request a walkthrough': 'login',
    'Read the API contract': 'docs',
    'Student portal': 'student/dashboard',
    'Adviser portal': 'adviser/dashboard',
    'Admin portal': 'admin/dashboard',
    'Curriculum checklist': 'student/checklist',
    'Grades & GWA': 'student/grades',
    'Enrollment history': 'student/history',
    'My profile': 'student/profile',
    'Advisees': 'adviser/advisees',
    'Record attempt': 'adviser/enrollment/new',
    'Add note': 'adviser/advisees/notes',
    'Reassignment': 'adviser/reassignment',
    'Accounts': 'admin/accounts',
    'Programs': 'admin/programs',
    'Curricula': 'admin/curricula',
    'Course catalog': 'admin/courses',
    'Terms & offerings': 'admin/course-offerings',
    'Audit log': 'admin/audit-log'
  };

  var PORTAL_DASHBOARD = { student: 'student/dashboard', adviser: 'adviser/dashboard', admin: 'admin/dashboard' };

  var VIEW_ACTIONS = {
    '': { 'Sign in': 'login', 'Request a walkthrough': 'login', 'Read the API contract': 'docs' },
    'login': { 'Sign in': 'ROLE_DEFAULT', 'Continue with Google': 'ROLE_DEFAULT' },
    'adviser/advisees/detail': { 'Checklist': 'adviser/advisees/checklist', 'Notes': 'adviser/advisees/notes' },
    'adviser/advisees/checklist': { 'Overview': 'adviser/advisees/detail', 'Notes': 'adviser/advisees/notes' },
    'adviser/advisees/notes': { 'Overview': 'adviser/advisees/detail', 'Checklist': 'adviser/advisees/checklist' },
    'adviser/enrollment/new': { 'Cancel': 'adviser/advisees/detail', 'Continue with override': 'adviser/advisees/detail' }
  };

  var ROW_TARGETS = {
    'adviser/advisees': 'adviser/advisees/detail'
  };

  var currentSlug = '';
  var currentRole = 'student';

  function idFor(slug) { return 'view-' + (slug === '' ? 'home' : slug.replace(/\//g, '-')); }

  function portalOf(slug) {
    if (slug.indexOf('student/') === 0) return 'student';
    if (slug.indexOf('adviser/') === 0) return 'adviser';
    if (slug.indexOf('admin/') === 0) return 'admin';
    return null;
  }

  function go(slug) {
    if (!routeSet.hasOwnProperty(slug)) slug = DEFAULT_ROUTE;
    var file = ROUTE_FILE[slug];
    if (file === CURRENT_FILE) {
      location.hash = '#/' + slug;
    } else {
      location.href = file + '#/' + slug;
    }
  }

  function render() {
    var rawHash = location.hash.replace(/^#\/?/, '');
    // No hash at all (e.g. this file opened directly) means "show this
    // file's own default view", not the global '' route -- '' is itself a
    // valid route (the landing page) owned by index.html, so it can't be
    // used as the sentinel for "no hash was given".
    var slug = rawHash === '' ? DEFAULT_ROUTE : decodeURIComponent(rawHash);
    if (!routeSet.hasOwnProperty(slug)) slug = DEFAULT_ROUTE;

    var file = ROUTE_FILE[slug];
    if (file !== CURRENT_FILE) {
      location.replace(file + '#/' + slug);
      return;
    }

    currentSlug = slug;
    var portal = portalOf(slug);
    if (portal) currentRole = portal;

    document.querySelectorAll('.view.active').forEach(function (el) { el.classList.remove('active'); el.hidden = true; });
    var target = document.getElementById(idFor(slug));
    if (target) { target.hidden = false; target.classList.add('active'); }
    window.scrollTo(0, 0);

    document.querySelectorAll('#proto-bar [data-role]').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-role') === currentRole);
    });

    applyAdviseeContext();
  }

  function resolve(text, isNavi) {
    var viewMap = VIEW_ACTIONS[currentSlug];
    if (viewMap && viewMap.hasOwnProperty(text)) return viewMap[text];
    if (text === 'Dashboard') {
      var portal = portalOf(currentSlug) || currentRole;
      return PORTAL_DASHBOARD[portal] || '';
    }
    if (GLOBAL_ACTIONS.hasOwnProperty(text)) return GLOBAL_ACTIONS[text];
    return null;
  }

  // ------------------------------------------------------------------
  // Interactive layer: toasts, dropdowns, checkboxes, pills and modals.
  // This turns the previously inert form controls into a working (if
  // shallow) simulation — nothing here is persisted past a page reload.
  // ------------------------------------------------------------------

  function showToast(msg) {
    var wrap = document.getElementById('proto-toast-wrap');
    if (!wrap) return;
    var t = document.createElement('div');
    t.className = 'proto-toast';
    t.textContent = msg;
    wrap.appendChild(t);
    requestAnimationFrame(function () { t.classList.add('show'); });
    setTimeout(function () {
      t.classList.remove('show');
      setTimeout(function () { t.remove(); }, 220);
    }, 2600);
  }

  function openModal(html) {
    var overlay = document.getElementById('proto-modal-overlay');
    var body = document.getElementById('proto-modal-body');
    if (!overlay || !body) return;
    body.innerHTML = html;
    overlay.classList.add('open');
  }
  function closeModal() {
    var overlay = document.getElementById('proto-modal-overlay');
    if (overlay) overlay.classList.remove('open');
  }

  function closeAllSelects(except) {
    document.querySelectorAll('[data-select].open').forEach(function (s) {
      if (s !== except) s.classList.remove('open');
    });
  }

  function toggleSelect(sel) {
    var wasOpen = sel.classList.contains('open');
    closeAllSelects(null);
    if (!wasOpen) sel.classList.add('open');
  }

  function pickOption(opt) {
    var sel = opt.closest('[data-select]');
    if (!sel) return;
    var label = sel.querySelector('.sel-label span');
    if (label) label.textContent = opt.textContent;
    sel.setAttribute('data-value', opt.getAttribute('data-value') || opt.textContent);
    sel.querySelectorAll('.sel-opt').forEach(function (o) { o.classList.remove('selected'); });
    opt.classList.add('selected');
    sel.classList.remove('open');
    sel.dispatchEvent(new CustomEvent('select-change', { bubbles: true }));
  }

  var CHECK_SVG = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="#FBF8EF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M4 12.5l5 5L20 6.5"/></svg>';

  function toggleCheckbox(box) {
    var on = box.getAttribute('data-checked') === '1';
    on = !on;
    box.setAttribute('data-checked', on ? '1' : '0');
    box.style.background = on ? '#2F4A12' : '#FFFFFF';
    box.innerHTML = on ? CHECK_SVG : '';
    box.dispatchEvent(new CustomEvent('checkbox-change', { bubbles: true, detail: { checked: on } }));
  }

  function selectPill(pill) {
    var group = pill.parentElement;
    if (!group) return;
    group.querySelectorAll('[data-pill]').forEach(function (p) {
      var active = p === pill;
      p.style.background = active ? '#FFFFFF' : 'transparent';
      p.style.borderColor = active ? '#E1DBC6' : 'transparent';
      p.style.color = active ? '#16200C' : '#6E6C58';
      p.style.fontWeight = active ? '600' : '450';
    });
    pill.dispatchEvent(new CustomEvent('pill-change', { bubbles: true }));
  }

  function filterRowsByText(input) {
    var sel = input.getAttribute('data-live-search');
    var table = sel ? document.querySelector('.view.active ' + sel) : input.closest('section').querySelector('table');
    if (!table) return;
    var q = input.value.trim().toLowerCase();
    table.querySelectorAll('tbody tr').forEach(function (tr) {
      var text = (tr.textContent || '').toLowerCase();
      tr.style.display = (!q || text.indexOf(q) !== -1) ? '' : 'none';
    });
  }

  function placeholderFocus(el) {
    if (el.classList.contains('placeholder')) {
      el.textContent = '';
      el.classList.remove('placeholder');
      el.style.color = '#16200C';
    }
  }
  function placeholderBlur(el) {
    var ph = el.getAttribute('data-placeholder');
    if (ph && !el.textContent.trim()) {
      el.textContent = ph;
      el.classList.add('placeholder');
      el.style.color = '#8C8A76';
    }
  }

  function fmtNow() {
    var d = new Date();
    var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    var hh = d.getHours(), mm = d.getMinutes();
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ', ' +
      (hh < 10 ? '0' + hh : hh) + ':' + (mm < 10 ? '0' + mm : mm);
  }

  function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ---- dynamic advisee context: clicking a row on the Advisees list
  // populates the detail/checklist/notes header with that student's data,
  // instead of always showing the one hard-coded demo record. ----

  var STANDING_STYLE = {
    'good standing': { bg: '#E7F0E2', fg: '#2C6430' },
    'watchlist': { bg: '#FBF0D6', fg: '#8A6206' },
    'delinquent': { bg: '#FAE7E1', fg: '#9E2E1C' }
  };
  var CURRICULUM_BY_YEAR = { '1st': '2025–2026', '2nd': '2024–2025', '3rd': '2023–2024', '4th': '2022–2023' };

  function initialsOf(name) {
    var parts = name.split(',');
    var surname = (parts[0] || '').trim();
    var given = ((parts[1] || '').trim().split(' ')[0] || '');
    return ((given[0] || '') + (surname[0] || '')).toUpperCase();
  }
  function emailOf(name) {
    var parts = name.split(',');
    var surname = (parts[0] || '').trim().toLowerCase().replace(/[^a-z]/g, '');
    var given = ((parts[1] || '').trim().split(' ')[0] || '').toLowerCase().replace(/[^a-z]/g, '');
    return given + '.' + surname + '@[university].edu.ph';
  }

  var ADVISEE_CONTEXT = null;

  function selectAdviseeFromRow(row) {
    var cells = row.querySelectorAll(':scope > td');
    if (cells.length < 7) return;
    var flex = cells[0].querySelector('div');
    var infoDiv = flex && flex.children[1];
    var nameDiv = infoDiv && infoDiv.children[0];
    var idDiv = infoDiv && infoDiv.children[1];
    var name = nameDiv ? nameDiv.textContent.trim() : '';
    if (!name) return;
    var studentId = idDiv ? idDiv.textContent.trim() : '';
    var program = cells[1].textContent.trim();
    var year = cells[2].textContent.trim();
    var gwa = cells[3].textContent.trim();
    var units = cells[4].textContent.trim();
    var standing = cells[5].textContent.trim();
    var inc = cells[6].textContent.trim();
    if (inc === '—' || inc === '') inc = '0';
    var assignedSince = cells[7] ? cells[7].textContent.trim() : '';
    ADVISEE_CONTEXT = {
      name: name, studentId: studentId, program: program, year: year,
      gwa: gwa, units: units, standing: standing, inc: parseInt(inc, 10) || 0,
      initials: initialsOf(name), email: emailOf(name),
      curriculum: CURRICULUM_BY_YEAR[year] || '2023–2024',
      assignedSince: assignedSince
    };
  }

  // ---- per-student content generation (courses, timeline, notes, checklist) ----
  // The flagship demo record (Bautista) keeps its hand-authored static content;
  // everyone else gets a plausible, data-driven version built from their row.

  var DEFAULT_STUDENT_NAME = 'Bautista, Maria Isabel L.';

  var COURSE_BANK = {
    '1st': [
      { code: 'CS 111', title: 'Introduction to Computing' },
      { code: 'CS 110', title: 'Discrete Computing Structures' },
      { code: 'MATH 21', title: 'Calculus I', units: '5.0' },
      { code: 'GE 1', title: 'Understanding the Self' },
      { code: 'PE 1', title: 'Foundations of Movement', units: '2.0' }
    ],
    '2nd': [
      { code: 'CS 121', title: 'Data Structures' },
      { code: 'CS 122', title: 'Object-Oriented Programming' },
      { code: 'MATH 22', title: 'Calculus II', units: '5.0' },
      { code: 'GE 7', title: 'Ethics' },
      { code: 'PE 3', title: 'Team Sports', units: '2.0' }
    ],
    '3rd': [
      { code: 'CS 132', title: 'Design and Analysis of Algorithms' },
      { code: 'CS 133', title: 'Computer Organization' },
      { code: 'CS 134', title: 'Information Management' },
      { code: 'STAT 101', title: 'Statistics' },
      { code: 'GE ELEC 1', title: 'General Education Elective 1' }
    ],
    '4th': [
      { code: 'CS 191', title: 'Software Engineering' },
      { code: 'CS 198', title: 'Undergraduate Thesis 1' },
      { code: 'CS 141', title: 'Computer Networks' },
      { code: 'MAJ ELEC 1', title: 'Major Elective 1' },
      { code: 'MAJ ELEC 2', title: 'Major Elective 2' }
    ]
  };

  var STATUS_STYLE = {
    'Enrolled': { bg: '#E4EDF4', fg: '#2A4C6B' },
    'INC': { bg: '#FBF0D6', fg: '#8A6206' },
    'Failed': { bg: '#FAE7E1', fg: '#9E2E1C' },
    'In progress': { bg: '#E4EDF4', fg: '#2A4C6B' },
    'Not taken': { bg: '#ECE8DA', fg: '#5C5A4C' }
  };

  function courseSlug(code) { return code.replace(/\s+/g, ''); }

  function buildCourses(c) {
    var bank = COURSE_BANK[c.year] || COURSE_BANK['2nd'];
    var courses = bank.map(function (b, i) {
      var course = { code: b.code, title: b.title, units: b.units || '3.0', status: 'Enrolled', section: courseSlug(b.code) + '-' + String.fromCharCode(65 + i) };
      if (c.program.indexOf('Info. Technology') !== -1 && i === 0) { course.code = 'IT 101'; course.title = 'Introduction to Information Technology'; course.section = 'IT101-A'; }
      return course;
    });
    if (c.standing === 'Delinquent') {
      courses[0].status = 'Failed';
    } else if (c.standing === 'Watchlist' && c.inc > 0) {
      for (var i = 0; i < Math.min(c.inc, 2); i++) courses[i].status = 'INC';
    }
    return courses;
  }

  function renderCourseRow(course) {
    var st = STATUS_STYLE[course.status];
    return (
      '<tr class="row">' +
      '<td style="text-align: left; padding: 11px 14px; font-size: 13.5px; border-bottom: 1px solid #EFEADB; vertical-align: middle"><span class="mono" style="font-size: 13px; font-weight: 500">' + esc(course.code) + '</span></td>' +
      '<td style="text-align: left; padding: 11px 14px; font-size: 13.5px; border-bottom: 1px solid #EFEADB; vertical-align: middle">' + esc(course.title) + '</td>' +
      '<td style="text-align: left; padding: 11px 14px; font-size: 13.5px; border-bottom: 1px solid #EFEADB; vertical-align: middle">' + esc(course.units) + '</td>' +
      '<td style="text-align: left; padding: 11px 14px; font-size: 13.5px; border-bottom: 1px solid #EFEADB; vertical-align: middle">' + esc(course.section) + '</td>' +
      '<td style="text-align: left; padding: 11px 14px; font-size: 13.5px; border-bottom: 1px solid #EFEADB; vertical-align: middle"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 8px; border-radius: 3px; background: ' + st.bg + '; color: ' + st.fg + '; font-size: 12px; font-weight: 600; letter-spacing: 0.01em; white-space: nowrap"><span style="width: 6px; height: 6px; border-radius: 50%; background: ' + st.fg + '; flex-shrink: 0"></span>' + esc(course.status) + '</span></td>' +

  function buildTimeline(c, courses) {
    var entries = [{ date: c.assignedSince || '—', dot: '#2F4A12', title: 'Adviser assignment', desc: 'Assigned to Prof. Ramon Reyes' }];
    if (c.standing === 'Delinquent') {
      entries.push({ date: '02 Sep 2026', dot: '#9E2E1C', title: 'Delinquency flag', desc: 'Delinquency threshold reached — requires a documented plan' });
    } else if (c.standing === 'Watchlist' && c.inc > 0) {
      var incCourse = courses.filter(function (co) { return co.status === 'INC'; })[0];
      entries.push({ date: '02 Sep 2026', dot: '#8A6206', title: 'INC recorded', desc: 'INC in ' + esc(incCourse ? incCourse.code : 'a current course') + ' — compliance deadline pending' });
    } else {
      entries.push({ date: '02 Sep 2026', dot: '#B0761A', title: 'No exceptions on file', desc: 'No mappings, equivalencies or overrides recorded for this student yet.' });
    }
    return entries;
  }

  function renderTimeline(entries) {

        '<div><div style="font-size: 13.5px; font-weight: 600">' + esc(e.title) + '</div><div style="font-size: 12.5px; color: #6E6C58; margin-top: 3px; line-height: 1.5">' + esc(e.desc) + '</div></div>' +
        '</div>'

  var SLOT_POOL = [
    { slot: 'GE ELEC 2', req: 'Open elective slot', generic: true },
    { slot: 'CS 132', req: 'Design and Analysis of Algorithms', generic: false },
    { slot: 'CS 133', req: 'Computer Organization', generic: false },
    { slot: 'CS 134', req: 'Information Management', generic: false },
    { slot: 'GE 6', req: 'Art Appreciation', generic: false },
    { slot: 'MAJ ELEC 1', req: 'Major elective slot', generic: true }
  ];

  function buildOpenSlots(c, courses) {
    var courseCodes = courses.map(function (co) { return co.code; });
    return SLOT_POOL.map(function (s) {
      var inProgress = courseCodes.indexOf(s.slot) !== -1;
      var status = 'Not taken';
      var action = s.generic ? 'Map a course' : 'Record attempt';
      if (inProgress) { status = 'In progress'; action = null; }
      else if (s.slot === 'GE 6' && c.standing === 'Delinquent') { status = 'Failed'; action = 'Record retake'; }
      return { slot: s.slot, req: s.req, status: status, action: action };
    });

  // Snapshot of each container's pristine (hand-authored) markup, taken the
  // first time it's touched, so switching back to the default student
  // restores the original content instead of leaving another student's
  // generated content behind.
  var ORIGINAL_CACHE = {};
  function cacheAndGet(view, selector, key) {
    var el = view.querySelector(selector);
    if (!el) return null;
    var cacheKey = view.getAttribute('data-route') + ':' + key;
    if (!(cacheKey in ORIGINAL_CACHE)) ORIGINAL_CACHE[cacheKey] = el.innerHTML;
    return { el: el, cacheKey: cacheKey };
  }
  function setContent(info, isDefault, html) {
    if (!info) return;
    info.el.innerHTML = isDefault ? ORIGINAL_CACHE[info.cacheKey] : html;
  }

  function applyPerStudentContent(c) {
    var view = document.querySelector('.view.active');
    if (!view) return;
    var route = view.getAttribute('data-route');
    var isDefault = c.name === DEFAULT_STUDENT_NAME;
    var courses = isDefault ? null : buildCourses(c);

    setContent(cacheAndGet(view, '[data-adv-courses]', 'courses'), isDefault, courses && courses.map(renderCourseRow).join(''));
    setContent(cacheAndGet(view, '[data-adv-timeline]', 'timeline'), isDefault, courses && renderTimeline(buildTimeline(c, courses)));

    var notesInfo = cacheAndGet(view, '[data-notes-list]', 'notes');
    setContent(notesInfo, isDefault, courses && (route === 'adviser/advisees/notes' ? renderAdvisingNoteFull(c) : renderStaffNotesCompact(c)));

    var notesCountInfo = cacheAndGet(view, '[data-adv-notes-count]', 'notes-count');
    if (notesCountInfo) notesCountInfo.el.textContent = isDefault ? ORIGINAL_CACHE[notesCountInfo.cacheKey] : '1 entry · append-only';

    var slots = isDefault ? null : buildOpenSlots(c, courses);
    setContent(cacheAndGet(view, '[data-adv-openslots]', 'openslots'), isDefault, slots && slots.map(renderOpenSlotRow).join(''));

    var slotsCountInfo = cacheAndGet(view, '[data-adv-openslots-count]', 'openslots-count');
    if (slotsCountInfo) {
      if (isDefault) { slotsCountInfo.el.textContent = ORIGINAL_CACHE[slotsCountInfo.cacheKey]; }
      else {
        var openCount = slots.filter(function (s) { return s.status === 'Not taken' || s.status === 'Failed'; }).length;
        slotsCountInfo.el.textContent = openCount + ' open slot' + (openCount === 1 ? '' : 's');
      }
    }

    setContent(cacheAndGet(view, '[data-exceptions-table]', 'exceptions'), isDefault,
      '<div style="padding: 16px 14px; font-size: 13px; color: #8C8A76">No exceptions on file for this student.</div>');

    var exceptionsCountInfo = cacheAndGet(view, '[data-adv-exceptions-count]', 'exceptions-count');
    if (exceptionsCountInfo) exceptionsCountInfo.el.textContent = isDefault ? ORIGINAL_CACHE[exceptionsCountInfo.cacheKey] : '0 exceptions on file';
  }

  function applyAdviseeContext() {
    if (!ADVISEE_CONTEXT) return;
    var view = document.querySelector('.view.active');
    if (!view) return;
    var c = ADVISEE_CONTEXT;

    var avatar = view.querySelector('[data-adv-avatar]');
    if (avatar) avatar.textContent = c.initials;

    var nameEl = view.querySelector('[data-adv-name]');
    if (nameEl) nameEl.textContent = c.name;

    var bc = view.querySelector('[data-adv-breadcrumb]');

    var standing = view.querySelector('[data-adv-standing]');
    if (standing) {
      var st = STANDING_STYLE[c.standing.toLowerCase()] || STANDING_STYLE['good standing'];
      standing.style.background = st.bg;
      standing.style.color = st.fg;
      standing.innerHTML = '<span style="width:6px;height:6px;border-radius:50%;background:' + st.fg + ';flex-shrink:0"></span>' + esc(c.standing);
    }

    var meta = view.querySelector('[data-adv-meta]');
    if (meta) {
      meta.innerHTML =
        '<span class="mono">' + esc(c.studentId) + '</span>' +
        '<span>' + esc(c.program) + '</span>' +
        '<span>Curriculum ' + esc(c.curriculum) + '</span>' +
        '<span>' + esc(c.year) + ' year</span>' +
        '<span>' + esc(c.email) + '</span>';
    }

    var gwaEl = view.querySelector('[data-adv-gwa]'); if (gwaEl) gwaEl.textContent = c.gwa;
    var unitsEl = view.querySelector('[data-adv-units]'); if (unitsEl) unitsEl.textContent = c.units;
    var incEl = view.querySelector('[data-adv-inc]'); if (incEl) incEl.textContent = c.inc;

    view.querySelectorAll('[data-open-modal="add-note"]').forEach(function (b) {
      b.setAttribute('data-student', c.name);
    });

    applyPerStudentContent(c);
  }

  function handleAction(action, el) {
    switch (action) {
      case 'export-roster':
        showToast('Roster exported — 48 rows (mock action, no file in this prototype).');
        break;
      case 'paginate':
        showToast('This prototype only ships one page of sample rows.');
        break;
      case 'toggle-more-filters':
        showToast('Additional filters aren’t wired up in this prototype.');
        break;
      case 'print-checklists':
        showToast('Preparing checklist PDFs… (not available in this prototype)');
        break;
      case 'not-in-prototype':
        showToast((el.textContent || 'This view').trim() + ' isn’t included in this prototype.');
        break;
      case 'scroll-to-mapping-form': {
        var panel = document.querySelector('.view.active [data-mapping-form]');
        if (panel) {
          panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
          panel.style.transition = 'box-shadow .25s ease';
          panel.style.boxShadow = '0 0 0 3px rgba(224,168,46,0.55)';
          setTimeout(function () { panel.style.boxShadow = 'none'; }, 1200);
        }
        break;
      }
      case 'scroll-to-note-form': {
        var np = document.querySelector('.view.active [data-note-form]');
        if (np) {

          np.style.transition = 'box-shadow .25s ease';
          np.style.boxShadow = '0 0 0 3px rgba(224,168,46,0.55)';

        break;
      }
      case 'cancel-mapping': {
        var form = el.closest('[data-mapping-form]');
        if (form) {
          form.querySelectorAll('[contenteditable]').forEach(function (f) { placeholderBlur(f); f.classList.contains('placeholder'); placeholderFocus(f); placeholderBlur(f); });
        }
        showToast('Mapping form cleared.');
        break;
      }
      case 'record-mapping': {
        var mform = el.closest('[data-mapping-form]');
        var table = document.querySelector('.view.active [data-exceptions-table]');
        if (mform && table) {
          if (table.children.length === 1 && !table.children[0].hasAttribute('data-exception-card')) table.innerHTML = '';
          var dest = selectValue(mform, 'dest') || 'GE ELEC 2';
          var src = selectValue(mform, 'source') || 'PSYCH 10 General Psychology';
          table.insertAdjacentHTML('afterbegin', buildExceptionCard('Elective mapping', src, dest.split(' —')[0], fmtNow().split(',')[0], 'R. Reyes'));
        }
        showToast('Mapping recorded and written to the audit log.');
        break;
      }
      case 'scroll-to-equivalency-form': {
        var epanel = document.querySelector('.view.active [data-equivalency-form]');
        if (epanel) {
          epanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
          epanel.style.transition = 'box-shadow .25s ease';
          epanel.style.boxShadow = '0 0 0 3px rgba(224,168,46,0.55)';
          setTimeout(function () { epanel.style.boxShadow = 'none'; }, 1200);
        }
        break;
      }
      case 'cancel-equivalency': {
        var eform = el.closest('[data-equivalency-form]');
        if (eform) {
          eform.querySelectorAll('[contenteditable]').forEach(function (f) { placeholderBlur(f); f.classList.contains('placeholder'); placeholderFocus(f); placeholderBlur(f); });
        }
        showToast('Equivalency decision form cleared.');
        break;
      }
      case 'record-equivalency': {
        var eqform = el.closest('[data-equivalency-form]');
        var etable = document.querySelector('.view.active [data-exceptions-table]');
        if (eqform && etable) {
          if (etable.children.length === 1 && !etable.children[0].hasAttribute('data-exception-card')) etable.innerHTML = '';
          var edecision = selectValue(eqform, 'decision-type') || 'Transfer equivalency';
          var edest = selectValue(eqform, 'edest') || 'MATH 30 — Year 2 · 2nd Sem (3.0 units)';
          var esrc = selectValue(eqform, 'esource') || 'MATH 31 Discrete Structures · 3.0 · passed 2.50';
          etable.insertAdjacentHTML('afterbegin', buildExceptionCard(edecision, esrc, edest.split(' —')[0], fmtNow().split(',')[0], 'R. Reyes'));
        }
        showToast('Equivalency decision recorded and written to the audit log.');
        break;
      }
      case 'run-simulation':
        showToast('Simulation complete — carried/lost units above reflect the target curriculum.');
        break;
      case 'save-note': {
        var page = document.querySelector('.view.active [data-note-form]');
        var list = document.querySelector('.view.active [data-notes-list]');
        if (page && list) {
          var type = selectValue(page, 'type') || 'Advising note (student-level)';
          var scope = selectValue(page, 'scope') || 'Whole student record';
          var text = fieldValue(page, 'note');
          if (!text) { showToast('Write a note before saving.'); break; }
          var badge = /remark/i.test(type) ? { bg: '#FBF0D6', fg: '#B0761A', label: 'Attempt remark' } : { bg: '#F2EDDC', fg: '#2F4A12', label: 'Advising note' };
          var entry = document.createElement('div');
          entry.setAttribute('data-entry-type', /remark/i.test(type) ? 'remark' : 'note');
          entry.setAttribute('data-entry-author', 'me');
          entry.style.cssText = 'display:flex;gap:14px;padding:18px 20px;border-bottom:1px solid #EFEADB';
          entry.innerHTML =
            '<div style="width:34px;height:34px;border-radius:50%;background:#F2EDDC;color:#2F4A12;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;letter-spacing:0.02em">RR</div>' +
            '<div style="flex-grow:1">' +
              '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
                '<span style="font-size:13.5px;font-weight:600">Prof. Ramon Reyes</span>' +
                '<span style="display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 8px;border-radius:3px;background:' + badge.bg + ';color:' + badge.fg + ';font-size:12px;font-weight:600;letter-spacing:0.01em;white-space:nowrap">' + badge.label + '</span>' +
                '<span style="font-size:12px;color:#8C8A76">' + fmtNow() + '</span>' +
              '</div>' +
              '<p style="font-size:13.5px;color:#6E6C58;line-height:1.62;margin-top:8px">' + esc(text) + '</p>' +
              '<div style="font-size:12px;color:#8C8A76;margin-top:8px">Scope: ' + esc(scope) + '</div>' +
            '</div>';
          list.insertBefore(entry, list.firstChild);
          page.querySelectorAll('[contenteditable]').forEach(function (f) { f.textContent = f.getAttribute('data-placeholder'); f.classList.add('placeholder'); f.style.color = '#8C8A76'; });
          showToast('Note saved to the record.');
        }
        break;
      }
      case 'save-draft':
        showToast('Draft saved. It will not appear elsewhere in this prototype.');
        break;
      case 'submit-attempt': {
        var overlay = document.querySelector('.view.active [data-prereq-modal]');
        if (overlay) { overlay.style.display = 'flex'; }
        break;
      }
      case 'close-prereq-modal': {
        var ov = document.querySelector('.view.active [data-prereq-modal]');
        if (ov) ov.style.display = 'none';
        break;
      }
      case 'continue-override': {
        var ov2 = document.querySelector('.view.active [data-prereq-modal]');
        if (ov2) ov2.style.display = 'none';
        showToast('Attempt recorded with a prerequisite override.');
        break;
      }
      case 'save-note-modal': {
        var modal = document.getElementById('proto-modal-body');
        var text2 = fieldValue(modal, 'note');
        if (!text2) { showToast('Write a note before saving.'); break; }
        var listEl = document.querySelector('.view.active [data-notes-list]');
        if (listEl) {
          var type2 = selectValue(modal, 'type') || 'Advising note (student-level)';
          var badge2 = /remark/i.test(type2) ? { bg: '#FBF0D6', fg: '#B0761A', label: 'Attempt remark' } : { bg: '#F2EDDC', fg: '#2F4A12', label: 'Advising note' };
          var e2 = document.createElement('div');
          e2.style.cssText = 'padding:12px 0;border-top:1px solid #EFEADB';
          e2.innerHTML =
            '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:#8C8A76"><span>R. Reyes</span><span>' + fmtNow() + '</span></div>' +
            '<p style="font-size:13px;color:#6E6C58;margin-top:5px;line-height:1.55">' + esc(text2) + '</p>';
          listEl.insertBefore(e2, listEl.firstChild);
        }
        closeModal();
        showToast('Note saved to the record.');
        break;
      }
      case 'save-remark-modal': {
        closeModal();
        showToast('Remark saved and written to the audit log.');
        break;
      }
      case 'execute-reassignment': {
        var badgeEl = document.querySelector('.view.active [data-reassign-count]');
        var n = badgeEl ? (parseInt(badgeEl.textContent, 10) || 0) : 0;
        if (n === 0) { showToast('Select at least one advisee to transfer.'); break; }
        var incomingSel = document.querySelector('.view.active [data-select][data-name="incoming-adviser"]');
        var toName = incomingSel ? incomingSel.getAttribute('data-value') : 'Prof. Lourdes Mendez';
        pendingReassign = { count: n, from: 'Prof. Ramon Reyes', to: toName };
        openModal(buildReassignConfirmModal(n, pendingReassign.from, toName));
        break;
      }
      case 'confirm-reassignment': {
        closeModal();
        var msg = 'Reassignment executed and written to the audit log.';
        if (pendingReassign) {
          msg = pendingReassign.count + ' advisee' + (pendingReassign.count === 1 ? '' : 's') + ' transferred to ' + pendingReassign.to + '.';
        }
        pendingReassign = null;
        showToast(msg);
        go('adviser/advisees');
        break;
      }
      default:
        break;
    }
  }

  document.addEventListener('click', function (e) {
    if (e.target.closest('#proto-sitemap')) return;

    var closeTrig = e.target.closest('[data-close-modal]');
    if (closeTrig || e.target.id === 'proto-modal-overlay') { closeModal(); return; }

    var openTrig = e.target.closest('[data-open-modal]');
    if (openTrig) {
      var kind = openTrig.getAttribute('data-open-modal');
      if (kind === 'add-note') openModal(buildAddNoteModal(openTrig.getAttribute('data-student')));
      else if (kind === 'remark') openModal(buildRemarkModal(openTrig.getAttribute('data-code'), openTrig.getAttribute('data-course')));
      closeAllSelects(null);
      return;
    }

    var actionTrig = e.target.closest('[data-action]');
    if (actionTrig) { handleAction(actionTrig.getAttribute('data-action'), actionTrig); return; }

    var cbTrig = e.target.closest('[data-checkbox]');
    if (cbTrig) { toggleCheckbox(cbTrig); return; }

    var pillTrig = e.target.closest('[data-pill]');
    if (pillTrig) { selectPill(pillTrig); return; }

    var optTrig = e.target.closest('.sel-opt');
    if (optTrig) { pickOption(optTrig); return; }

    var selLabel = e.target.closest('[data-select] .sel-label');
    if (selLabel) { toggleSelect(selLabel.closest('[data-select]')); return; }

    if (!e.target.closest('[data-select]')) closeAllSelects(null);

    var gotoTrig = e.target.closest('[data-goto]');
    if (gotoTrig) { go(gotoTrig.getAttribute('data-goto')); return; }

    var logo = e.target.closest('img[alt="SAAIS"]');
    if (logo) {
      var portal = portalOf(currentSlug);
      go(portal ? PORTAL_DASHBOARD[portal] : '');
      return;
    }

    if (ROW_TARGETS.hasOwnProperty(currentSlug)) {
      var row = e.target.closest('tr.row');
      if (row) {
        if (currentSlug === 'adviser/advisees') selectAdviseeFromRow(row);
        go(ROW_TARGETS[currentSlug]);
        return;
      }
    }

    var node = e.target;
    var hops = 0;
    while (node && node.nodeType === 1 && hops < 6) {
      var text = (node.textContent || '').replace(/\s+/g, ' ').trim();
      if (text) {
        if (NOT_IN_PROTOTYPE.hasOwnProperty(text) && node.classList && (node.classList.contains('navi') || node.parentElement && node.parentElement.style && node.parentElement.style.display === 'flex')) {
          // fallthrough — let resolve() try first; only toast if unresolved
        }
        var dest = resolve(text, node.classList && node.classList.contains('navi'));
        if (dest === 'ROLE_DEFAULT') { go(PORTAL_DASHBOARD[currentRole]); return; }
        if (dest) { go(dest); return; }
        if (NOT_IN_PROTOTYPE.hasOwnProperty(text)) { showToast(text + ' isn’t included in this prototype.'); return; }
      }
      node = node.parentElement;
      hops++;
    }
  });

  document.addEventListener('input', function (e) {
    var inp = e.target.closest('[data-live-search]');
    if (inp) filterRowsByText(inp);
  });

  document.addEventListener('focus', function (e) {
    if (e.target.matches && e.target.matches('[contenteditable="true"]')) placeholderFocus(e.target);
  }, true);
  document.addEventListener('blur', function (e) {
    if (e.target.matches && e.target.matches('[contenteditable="true"]')) placeholderBlur(e.target);
  }, true);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeModal(); closeAllSelects(null); }
  });

  document.addEventListener('checkbox-change', function (e) {
    if (!e.target.matches('[data-checkbox="reassign-row"]')) return;
    var view = e.target.closest('.view');
    if (!view) return;
    var n = view.querySelectorAll('[data-checkbox="reassign-row"][data-checked="1"]').length;
    var badge = view.querySelector('[data-reassign-count]');
    if (badge) badge.textContent = n + ' advisee' + (n === 1 ? '' : 's') + ' selected';
  });

  document.addEventListener('select-change', function (e) {
    var sel = e.target;
    if (!sel.matches || !sel.matches('[data-select][data-name="incoming-adviser"]')) return;
    var opt = sel.querySelector('.sel-opt.selected');
    if (!opt) return;
    var name = sel.getAttribute('data-value');
    var initials = opt.getAttribute('data-initials') || '';
    var count = opt.getAttribute('data-count') || '';
    var avatar = sel.querySelector('[data-adviser-avatar]');
    if (avatar) avatar.textContent = initials;
    var nameEl = sel.querySelector('[data-adviser-name]');
    if (nameEl) nameEl.textContent = name;
    var countEl = sel.querySelector('[data-adviser-count]');
    if (countEl) countEl.textContent = count + ' active advisees';
    var view = sel.closest('.view');
    var contDesc = view && view.querySelector('[data-continuity-incoming-desc]');
    if (contDesc) contDesc.textContent = name + ' holds an active adviser role.';
  });

  document.addEventListener('pill-change', function (e) {
    var pill = e.target;
    var kind = pill.getAttribute('data-pill');
    if (!kind) return;
    var view = pill.closest('.view');
    var table = view && view.querySelector('[data-filter-table]');
    if (!table) return;
    table.querySelectorAll('tbody tr').forEach(function (tr) {
      var standing = (tr.getAttribute('data-standing') || '').toLowerCase();
      var incCount = parseInt(tr.getAttribute('data-inc') || '0', 10);
      var show = true;
      if (kind === 'delinquent') show = standing === 'delinquent';
      else if (kind === 'open-inc') show = incCount > 0;
      else if (kind === 'historical') show = false;
      tr.style.display = show ? '' : 'none';
    });
    if (kind === 'historical') showToast('Historical advisees are read-only and not included in this prototype’s sample data.');
  });

  document.addEventListener('checkbox-change', function (e) {
    if (!e.target.matches('[data-checkbox="notes-filter"]')) return;
    var view = e.target.closest('.view');
    var list = view && view.querySelector('[data-notes-list]');
    if (!list) return;
    var state = {};
    view.querySelectorAll('[data-checkbox="notes-filter"]').forEach(function (cb) {
      state[cb.getAttribute('data-filter-key')] = cb.getAttribute('data-checked') === '1';
    });
    list.querySelectorAll(':scope > div').forEach(function (entry) {
      var kind = entry.getAttribute('data-entry-type');
      var mine = entry.getAttribute('data-entry-author') === 'me';
      var visible = true;
      if (kind === 'note' && state['advising-notes'] === false) visible = false;
      if (kind === 'remark' && state['attempt-remarks'] === false) visible = false;
      if (state['written-by-me']) visible = visible && mine;
      if (state['previous-advisers'] === false && !mine) visible = false;
      entry.style.display = visible ? '' : 'none';
    });
  });

  document.querySelectorAll('#proto-bar [data-role]').forEach(function (b) {
    b.addEventListener('click', function () {
      currentRole = b.getAttribute('data-role');
      go(PORTAL_DASHBOARD[currentRole]);
    });
  });
  document.getElementById('proto-home').addEventListener('click', function () { go(''); });

  var sitemap = document.getElementById('proto-sitemap');
  document.getElementById('proto-map').addEventListener('click', function () { sitemap.classList.add('open'); });
  sitemap.addEventListener('click', function (e) {
    if (e.target === sitemap || e.target.classList.contains('sm-close')) { sitemap.classList.remove('open'); return; }
    var goto = e.target.closest('[data-goto]');
    if (goto) { sitemap.classList.remove('open'); go(goto.getAttribute('data-goto')); }
  });

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
