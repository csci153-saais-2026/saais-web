<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SAAIS — clickable prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/*__FONTS_IMPORT__*/

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #FBF8EF; }
.view { display: none; }
.view.active { display: block; }
img[alt="SAAIS"] { cursor: pointer; }

/*__SCOPED_CSS__*/

/* --- prototype chrome (not part of the original mockup) --- */
#proto-bar {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 6px;
  background: #1D2F0A;
  border: 1px solid #2F4A12;
  border-radius: 999px;
  padding: 6px 8px 6px 14px;
  box-shadow: 0 8px 24px rgba(15,20,5,0.35);
  font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
}
#proto-bar .proto-label {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(246,242,228,0.55);
  font-weight: 600;
  margin-right: 4px;
}
#proto-bar button {
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  border-radius: 999px;
  padding: 7px 12px;
  border: 1px solid transparent;
  background: transparent;
  color: rgba(246,242,228,0.75);
}
#proto-bar button:hover { color: #FBF8EF; background: rgba(246,242,228,0.08); }
#proto-bar button.active { background: #E0A82E; color: #3A2A05; }
#proto-bar button#proto-map { background: rgba(224,168,46,0.16); color: #F7E9C4; }
#proto-bar button#proto-map:hover { background: rgba(224,168,46,0.28); }
#proto-bar .proto-sep { width: 1px; height: 20px; background: rgba(246,242,228,0.16); margin: 0 2px; }

#proto-sitemap {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: rgba(22,32,12,0.55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
}
#proto-sitemap.open { display: flex; }
#proto-sitemap .sm-panel {
  background: #FBF8EF;
  border-radius: 10px;
  max-width: 880px;
  width: 100%;
  max-height: 84vh;
  overflow-y: auto;
  padding: 28px 30px 32px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.35);
}
#proto-sitemap .sm-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
#proto-sitemap .sm-title {
  font-family: 'Syne', 'Segoe UI', system-ui, sans-serif;
  font-weight: 700;
  font-size: 20px;
  color: #16200C;
}
#proto-sitemap .sm-close {
  cursor: pointer;
  border: 1px solid #E1DBC6;
  background: #fff;
  border-radius: 6px;
  padding: 6px 12px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  color: #16200C;
}
.sm-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 22px; }
.sm-group-title {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #8C8A76;
  margin-bottom: 8px;
}
.sm-item {
  display: block;
  width: 100%;
  text-align: left;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 500;
  color: #2F4A12;
  background: transparent;
  border: none;
  border-radius: 4px;
  padding: 6px 8px;
  cursor: pointer;
}
.sm-item:hover { background: #EFEADB; color: #B0761A; }
.sm-group { margin-bottom: 4px; }

#student-message-modal {
  position: fixed;
  inset: 0;
  z-index: 10001;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(22,32,12,0.55);
  font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
}
#student-message-modal.open { display: flex; }
#student-message-modal .message-panel {
  width: min(560px, 100%);
  background: #FBF8EF;
  border: 1px solid #E1DBC6;
  border-radius: 8px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.3);
  padding: 24px;
}
#student-message-modal .message-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}
#student-message-modal .message-title {
  color: #16200C;
  font-family: 'Syne', 'Segoe UI', system-ui, sans-serif;
  font-size: 20px;
  font-weight: 700;
}
#student-message-modal .message-subtitle {
  color: #6E6C58;
  font-size: 13px;
  margin-top: 4px;
}
#student-message-modal .message-close {
  border: 1px solid #E1DBC6;
  border-radius: 5px;
  background: #FFFFFF;
  color: #16200C;
  cursor: pointer;
  font: inherit;
  font-size: 18px;
  line-height: 1;
  padding: 5px 9px;
}
#student-message-modal label {
  display: block;
  color: #6E6C58;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
}
#student-message-modal input,
#student-message-modal textarea {
  width: 100%;
  border: 1px solid #E1DBC6;
  border-radius: 5px;
  background: #FFFFFF;
  color: #16200C;
  font: inherit;
  font-size: 14px;
  padding: 10px 11px;
}
#student-message-modal textarea { min-height: 150px; resize: vertical; }
#student-message-modal .message-field { margin-bottom: 14px; }
#student-message-modal .message-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 20px;
}
#student-message-modal .message-actions button {
  border-radius: 4px;
  cursor: pointer;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 14px;
}
#student-message-modal .message-cancel { background: #FFFFFF; border: 1px solid #E1DBC6; color: #16200C; }
#student-message-modal .message-send { background: #2F4A12; border: 1px solid #2F4A12; color: #FBF8EF; }
</style>
</head>
<body>

<!--__SECTIONS__-->

<div id="proto-bar">
  <span class="proto-label">Demo as</span>
  <button type="button" data-role="student">Student</button>
  <button type="button" data-role="adviser">Adviser</button>
  <button type="button" data-role="admin">Admin</button>
  <span class="proto-sep"></span>
  <button type="button" id="proto-home">Home</button>
  <button type="button" id="proto-map">Sitemap</button>
</div>

<div id="proto-sitemap">
  <div class="sm-panel">
    <div class="sm-head">
      <div class="sm-title">Jump to any screen</div>
      <button type="button" class="sm-close">Close</button>
    </div>
    <div class="sm-grid">
      <!--__SITEMAP__-->
    </div>
  </div>
</div>

<div id="student-message-modal" aria-hidden="true">
  <form class="message-panel" data-student-message-form>
    <div class="message-head">
      <div>
        <div class="message-title">Message adviser</div>
        <div class="message-subtitle">To Prof. Ramon Reyes · r.reyes@university.edu.ph</div>
      </div>
      <button type="button" class="message-close" data-student-message-close aria-label="Close">&times;</button>
    </div>
    <div class="message-field">
      <label for="student-message-subject">Subject</label>
      <input id="student-message-subject" name="subject" value="Checklist question" required>
    </div>
    <div class="message-field">
      <label for="student-message-body">Message</label>
      <textarea id="student-message-body" name="body" placeholder="Write your message to Prof. Reyes..." required></textarea>
    </div>
    <div class="message-actions">
      <button type="button" class="message-cancel" data-student-message-close>Cancel</button>
      <button type="submit" class="message-send">Open email</button>
    </div>
  </form>
</div>

<script>
(function () {
  var ROUTES = /*__ROUTES_JSON__*/;
  var routeSet = {};
  ROUTES.forEach(function (r) { routeSet[r] = true; });

  var GLOBAL_ACTIONS = {
    'Sign in': 'login',
    'Sign out': 'login',
    'Request a walkthrough': 'login',
    'Read the API contract': 'docs',
    'Student portal': 'student/dashboard',
    'Adviser portal': 'adviser/dashboard',
    'Admin portal': 'admin/dashboard',
    'Curriculum checklist': 'student/checklist',
    'Grades & GWA': 'student/grades',
    'Enrollment history': 'student/history',
    'My profile': 'student/profile',
    'Advisees': 'adviser/advisees',
    'Record attempt': 'adviser/enrollment/new',
    'Add note': 'adviser/advisees/notes',
    'Reassignment': 'adviser/reassignment',
    'Accounts': 'admin/accounts',
    'Programs': 'admin/programs',
    'Curricula': 'admin/curricula',
    'Course catalog': 'admin/courses',
    'Terms & offerings': 'admin/course-offerings',
    'Audit log': 'admin/audit-log',
    'Open checklist': 'student/checklist',
    'Download checklist PDF': 'ACTION_PRINT_CHECKLIST',
    'Message adviser': 'ACTION_MESSAGE_ADVISER',
    'Print': 'ACTION_PRINT_CHECKLIST',
    'Export PDF': 'ACTION_PRINT_CHECKLIST'
  };

  var PORTAL_DASHBOARD = { student: 'student/dashboard', adviser: 'adviser/dashboard', admin: 'admin/dashboard' };

  var VIEW_ACTIONS = {
    '': { 'Sign in': 'login', 'Request a walkthrough': 'login', 'Read the API contract': 'docs' },
    'student/checklist': { 'Export PDF': 'ACTION_DOWNLOAD_PDF' },
    'student/grades': { 'Official grade summary': 'ACTION_DOWNLOAD_PDF' },
    'student/history': { 'Export CSV': 'ACTION_DOWNLOAD_CSV' },
    'login': { 'Sign in': 'ROLE_DEFAULT', 'Continue with Google': 'ROLE_DEFAULT' },
    'adviser/advisees/detail': { 'Checklist': 'adviser/advisees/checklist', 'Notes': 'adviser/advisees/notes' },
    'adviser/advisees/checklist': { 'Overview': 'adviser/advisees/detail', 'Notes': 'adviser/advisees/notes' },
    'adviser/advisees/notes': { 'Overview': 'adviser/advisees/detail', 'Checklist': 'adviser/advisees/checklist' },
    'adviser/enrollment/new': { 'Cancel': 'adviser/advisees/detail', 'Continue with override': 'adviser/advisees/detail' }
  };

  var ROW_TARGETS = {
    'adviser/advisees': 'adviser/advisees/detail'
  };

  var currentSlug = '';
  var currentRole = 'student';

  function idFor(slug) { return 'view-' + (slug === '' ? 'home' : slug.replace(/\//g, '-')); }

  function portalOf(slug) {
    if (slug.indexOf('student/') === 0) return 'student';
    if (slug.indexOf('adviser/') === 0) return 'adviser';
    if (slug.indexOf('admin/') === 0) return 'admin';
    return null;
  }

  function go(slug) {
    if (!routeSet.hasOwnProperty(slug)) slug = '';
    location.hash = '#/' + slug;
  }

  function downloadFile(filename, content, type) {
    var blob = new Blob([content], { type: type });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(link.href);
  }

  function downloadPdf(filename) {
    var objects = [
      '1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n',
      '2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n',
      '3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] '
        + '/Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>\nendobj\n',
      '4 0 obj\n<< /Length 76 >>\nstream\nBT /F1 18 Tf 72 720 Td '
        + '(SAAIS Student Portal) Tj /F1 12 Tf 0 -28 Td (Official student record) Tj ET\nendstream\nendobj\n',
      '5 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj\n'
    ];
    var pdf = '%PDF-1.4\n';
    var offsets = [0];
    objects.forEach(function (object) {
      offsets.push(pdf.length);
      pdf += object;
    });
    var xref = pdf.length;
    pdf += 'xref\n0 6\n0000000000 65535 f \n';
    offsets.slice(1).forEach(function (offset) {
      pdf += String(offset).padStart(10, '0') + ' 00000 n \n';
    });
    pdf += 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';
    downloadFile(filename, pdf, 'application/pdf');
  }

  function downloadCsv(filename) {
    var table = document.querySelector('#view-student-history table');
    if (!table) return;
    var rows = Array.prototype.map.call(table.querySelectorAll('tr'), function (row) {
      return Array.prototype.map.call(row.children, function (cell) {
        return '"' + (cell.textContent || '').replace(/"/g, '""').replace(/\s+/g, ' ').trim() + '"';
      }).join(',');
    });
    downloadFile(filename, rows.join('\r\n'), 'text/csv;charset=utf-8');
  }

  function setStudentMessageModal(open) {
    var modal = document.getElementById('student-message-modal');
    if (!modal) return;
    modal.classList.toggle('open', open);
    modal.setAttribute('aria-hidden', open ? 'false' : 'true');
    if (open) {
      var body = document.getElementById('student-message-body');
      if (body) body.focus();
    }
  }

  function render() {
    var slug = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    if (!routeSet.hasOwnProperty(slug)) slug = '';
    currentSlug = slug;
    var portal = portalOf(slug);
    if (portal) currentRole = portal;

    document.querySelectorAll('.view.active').forEach(function (el) { el.classList.remove('active'); el.hidden = true; });
    var target = document.getElementById(idFor(slug));
    if (target) { target.hidden = false; target.classList.add('active'); }
    window.scrollTo(0, 0);

    document.querySelectorAll('#proto-bar [data-role]').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-role') === currentRole);
    });
  }

  function resolve(text, isNavi) {
    var viewMap = VIEW_ACTIONS[currentSlug];
    if (viewMap && viewMap.hasOwnProperty(text)) return viewMap[text];
    if (text === 'Dashboard') {
      var portal = portalOf(currentSlug) || currentRole;
      return PORTAL_DASHBOARD[portal] || '';
    }
    if (GLOBAL_ACTIONS.hasOwnProperty(text)) return GLOBAL_ACTIONS[text];
    return null;
  }

  document.addEventListener('click', function (e) {
    if (e.target.id === 'student-message-modal' || e.target.closest('[data-student-message-close]')) {
      setStudentMessageModal(false);
      return;
    }

    var logo = e.target.closest('img[alt="SAAIS"]');
    if (logo) {
      var portal = portalOf(currentSlug);
      go(portal ? PORTAL_DASHBOARD[portal] : '');
      return;
    }

    if (ROW_TARGETS.hasOwnProperty(currentSlug)) {
      var row = e.target.closest('tr.row');
      if (row) { go(ROW_TARGETS[currentSlug]); return; }
    }

    var node = e.target;
    var hops = 0;
    while (node && node.nodeType === 1 && hops < 6) {
      var text = (node.textContent || '').replace(/\s+/g, ' ').trim();
      if (text) {
        var dest = resolve(text, node.classList && node.classList.contains('navi'));
        if (dest === 'ROLE_DEFAULT') { go(PORTAL_DASHBOARD[currentRole]); return; }
        if (dest === 'ACTION_PRINT_CHECKLIST') { window.print(); return; }
        if (dest === 'ACTION_DOWNLOAD_PDF') {
          downloadPdf(currentSlug === 'student/grades' ? 'saais-official-grade-summary.pdf' : 'saais-curriculum-checklist.pdf');
          return;
        }
        if (dest === 'ACTION_DOWNLOAD_CSV') { downloadCsv('saais-enrollment-history.csv'); return; }
        if (dest === 'ACTION_MESSAGE_ADVISER') {
          if (currentSlug === 'student/dashboard') setStudentMessageModal(true);
          return;
        }
        if (dest) { go(dest); return; }
      }
      node = node.parentElement;
      hops++;
    }
  });

  document.addEventListener('submit', function (e) {
    var form = e.target.closest('[data-student-message-form]');
    if (!form) return;
    e.preventDefault();
    var subject = form.elements.subject.value.trim();
    var body = form.elements.body.value.trim();
    if (!subject || !body) return;
    window.location.href = 'mailto:r.reyes@university.edu.ph?subject='
      + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    setStudentMessageModal(false);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setStudentMessageModal(false);
  });

  document.addEventListener('change', function (e) {
    var selector = e.target.closest('[data-student-enrollment-switch]');
    if (!selector || !document.getElementById('view-student-dashboard')) return;
  });

  document.querySelectorAll('#proto-bar [data-role]').forEach(function (b) {
    b.addEventListener('click', function () {
      currentRole = b.getAttribute('data-role');
      go(PORTAL_DASHBOARD[currentRole]);
    });
  });
  document.getElementById('proto-home').addEventListener('click', function () { go(''); });

  var sitemap = document.getElementById('proto-sitemap');
  document.getElementById('proto-map').addEventListener('click', function () { sitemap.classList.add('open'); });
  sitemap.addEventListener('click', function (e) {
    if (e.target === sitemap || e.target.classList.contains('sm-close')) { sitemap.classList.remove('open'); return; }
    var goto = e.target.closest('[data-goto]');
    if (goto) { sitemap.classList.remove('open'); go(goto.getAttribute('data-goto')); }
  });

  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
