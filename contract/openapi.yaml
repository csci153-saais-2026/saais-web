components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Supabase Auth user session access JWT in Authorization: Bearer <access_token>, obtained and
        refreshed by @supabase/supabase-js. Not the publishable/anon project key, refresh token,
        Google provider token or invitation token. Server verifies the JWT using the configured
        project issuer/signing keys and checks active profile/role/assignment; a valid JWT alone
        does not grant application access. Implementations must follow JWT best current practices
        (RFC8725): verify the signature with an explicit algorithm allowlist, and validate the
        issuer, audience and expiry claims.
    supabaseProjectKey:
      type: apiKey
      in: header
      name: apikey
      description: >-
        Supabase project publishable key (or legacy anon key where supported), identifying the
        public application. This is not a user identity or permission grant. Never send a
        secret/service-role key from the SPA. Protected operations ALSO require the user session JWT
        in Authorization; both schemes belong to the same security requirement (AND).
  parameters:
    limitQueryParam:
      name: limit
      in: query
      description: >-
        Bounded page size; gateway/PostgREST max-rows must enforce this cap even when clients omit
        or bypass contract validation.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 20
        example: 20
    offsetQueryParam:
      name: offset
      in: query
      description: Number of rows to skip for DoS pagination mitigation
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0
        maximum: 100000
    idQueryParam:
      name: id
      in: query
      description: >-
        Allowlisted PostgREST UUID filter: eq.UUID, neq.UUID or in.(UUID,...), at most 50 IDs.
        URL-encode the complete value; format:uuid would be wrong for the operator-prefixed string.
      required: false
      schema:
        type: string
        maxLength: 1900
        pattern: >-
          ^(?:(?:eq|neq)\.[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|in\.\([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:,[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}){0,49}\))$
    emailQueryParam:
      name: email
      in: query
      description: Filter by email equality (e.g. `eq.student@university.edu.ph`)
      required: false
      schema:
        type: string
        maxLength: 257
        pattern: ^eq\.[^\s@]+@[^\s@]+\.[^\s@]+$
    roleQueryParam:
      name: role
      in: query
      description: Filter by role (e.g. `eq.student`)
      required: false
