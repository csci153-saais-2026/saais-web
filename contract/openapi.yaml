      tags:
        - Faculty & Department
      summary: Query academic departments
      operationId: listDepartments
      description: >-
        Retrieve academic departments linked to faculties, including safe display metadata for
        letterhead rendering and PDF signatory blocks (department_head_name, dean_name). Flat
        columns are allowlisted per x-projection-fields; role metadata documents checks, not
        automatic runtime authorization. Inaccessible/missing collection rows return 200 [], while
        invalid role/column requests may return 403.
      x-required-roles:
        - student
        - adviser
        - department_head
        - department_staff
        - dean
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParam"
        - $ref: "#/components/parameters/facultyIdQueryParam"
        - $ref: "#/components/parameters/nameQueryParam"
        - name: select
          in: query
          required: false
          description: >-
            Only these flat safe columns. On private-column tables the client must explicitly send
            this projection; PostgREST does not apply OpenAPI defaults.
          schema:
            type: string
            maxLength: 2000
            pattern: ^(?:id|faculty_id|name|code|letterhead_prefix|letterhead_name|department_head_name|dean_name)(?:,(?:id|faculty_id|name|code|letterhead_prefix|letterhead_name|department_head_name|dean_name))*$
            default: id,faculty_id,name,code,letterhead_prefix,letterhead_name,department_head_name,dean_name
        - name: order
          in: query
          required: false
          description: Stable ordering on published columns only; whitelist and enforce at runtime.
          schema:
            type: string
            maxLength: 1000
            pattern: >-
              ^(?:id|faculty_id|name|code|letterhead_prefix|letterhead_name|department_head_name|dean_name)\.(?:asc|desc)(?:\.nulls(?:first|last))?(?:,(?:id|faculty_id|name|code|letterhead_prefix|letterhead_name|department_head_name|dean_name)\.(?:asc|desc)(?:\.nulls(?:first|last))?)*$
            default: id.asc
        - $ref: "#/components/parameters/limitQueryParam"
        - $ref: "#/components/parameters/offsetQueryParam"
      responses:
        "200":
          description: Array of academic departments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
                maxItems: 1000
          headers:
            Content-Range:
              description: PostgREST visible item range; total may be * when exact counts are not requested.
              schema:
                type: string
                maxLength: 100
        "206":
          description: Partial visible collection if the gateway reports a partial range.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
                maxItems: 1000
          headers:
            Content-Range:
              description: PostgREST visible item range; total may be * when exact counts are not requested.
              schema:
                type: string
                maxLength: 100
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500InternalError"
      x-access-scope:
        student: own-records
        adviser: current-or-historic-assigned-students-read-only
        department_head: institution-reference-read-only
        department_staff: institution-reference-read-only
        dean: institution-reference-read-only
        admin: institution-wide
      x-projection-fields:
        - id
        - faculty_id
        - name
        - code
        - letterhead_prefix
        - letterhead_name
        - department_head_name
        - dean_name
  /rest/v1/program:
    get:
