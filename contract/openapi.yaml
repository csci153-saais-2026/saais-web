        type: string
        maxLength: 1900
        pattern: >-
          ^(?:(?:eq|neq)\.[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|in\.\([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:,[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}){0,49}\))$
    courseOfferingIdQueryParam:
      name: course_offering_id
      in: query
      description: >-
        Allowlisted PostgREST UUID filter: eq.UUID, neq.UUID or in.(UUID,...), at most 50 IDs.
        URL-encode the complete value; format:uuid would be wrong for the operator-prefixed string.
      required: false
      schema:
        type: string
        maxLength: 1900
        pattern: >-
          ^(?:(?:eq|neq)\.[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|in\.\([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:,[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}){0,49}\))$
    studentNumberQueryParam:
      name: student_number
      in: query
      description: Filter by student number (e.g. `eq.2023-04412`)
      required: false
      schema:
        type: string
        maxLength: 70
        pattern: ^eq\.[^\x00-\x1f]{1,64}$
    nameQueryParam:
      name: name
      in: query
      description: Filter by name equality or pattern matching
      required: false
      schema:
        type: string
        maxLength: 156
        pattern: ^(?:eq|ilike|like)\.[^\x00-\x1f]{1,150}$
    codeQueryParam:
      name: code
      in: query
      description: Filter by code equality or pattern matching (e.g. `eq.BSCS`, `ilike.*CS*`)
      required: false
      schema:
        type: string
        maxLength: 106
        pattern: ^(?:eq|ilike|like)\.[^\x00-\x1f]{1,100}$
    versionLabelQueryParam:
      name: version_label
      in: query
      description: Filter by version label (e.g. `eq.2023-2024`)
      required: false
      schema:
        type: string
        maxLength: 106
        pattern: ^eq\.[^\x00-\x1f]{1,100}$
    schoolYearQueryParam:
      name: school_year
      in: query
      description: Filter by school year (e.g. `eq.2025 - 2026`)
      required: false
      schema:
        type: string
        maxLength: 16
        pattern: ^eq\.[0-9]{4} - [0-9]{4}$
    isLockedQueryParam:
      name: is_locked
      in: query
      description: Filter by lock state (e.g. `eq.true`)
      required: false
      schema:
        type: string
        pattern: ^eq\.(true|false)$
        maxLength: 250
    isByRequestQueryParam:
      name: is_by_request
      in: query
      description: Filter by by_request flag (e.g. `eq.true`)
      required: false
      schema:
        type: string
        pattern: ^eq\.(true|false)$
        maxLength: 250
    schoolTermQuery:
      name: school_term_id
      in: query
      required: true
      description: Actual school-term UUID, not a curriculum position or term-type label.
      schema:
        type: string
        format: uuid
    searchQuery:
      name: search
      in: query
      required: false
      description: Search text. Server uses parameterized queries; no client-defined query language.
      schema:
        type: string
        maxLength: 150
    advisingPlanIdQueryParam:
      name: advising_plan_id
      in: query
      description: >-
        Allowlisted PostgREST UUID filter: eq.UUID, neq.UUID or in.(UUID,...), at most 50 IDs.
        URL-encode the complete value; format:uuid would be wrong for the operator-prefixed string.
      required: false
      schema:
        type: string
        maxLength: 1900
        pattern: >-
          ^(?:(?:eq|neq)\.[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|in\.\([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:,[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}){0,49}\))$
    recordedStatusQueryParam:
      name: recorded_status
      in: query
      required: false
      description: Filter original recorded attempt status; completed INC effective result is separate.
      schema:
        type: string
        maxLength: 32
        pattern: ^eq\.(passed|failed|currently_enrolled|inc|dr|na)$
    profileIdQueryParam:
      name: profile_id
      in: query
      description: >-
        Allowlisted PostgREST UUID filter: eq.UUID, neq.UUID or in.(UUID,...), at most 50 IDs.
        URL-encode the complete value; format:uuid would be wrong for the operator-prefixed string.
      required: false
      schema:
        type: string
        maxLength: 1900
        pattern: >-
          ^(?:(?:eq|neq)\.[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|in\.\([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:,[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}){0,49}\))$
    isArchivedQueryParam:
      name: is_archived
      in: query
      description: Filter by archive state (e.g. `eq.false`)
      required: false
      schema:
        type: string
        pattern: ^eq\.(true|false)$
        maxLength: 250
  responses:
    400BadRequest:
      description: Invalid request parameters or payload violates integrity constraints.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "23514"
            message: "check constraint violation: units must be positive quarter steps"
            details: Failing row contains (units=-3).
            hint: Ensure credit units are positive quarter steps (e.g. 1.00, 3.00).
    401Unauthorized:
      description: >-
        Missing/invalid project apikey or missing, invalid or expired user session JWT on protected
        operations. Invitation redemption does not require a user JWT. Gateway rejections may have a
        different error shape than application/PostgREST responses.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/SupabaseGatewayAuthError"
          example:
            code: PGRST301
            message: JWT expired or signature verification failed
            details: null
            hint: "Refresh session token and pass Authorization: Bearer <token>"
    403Forbidden:
      description: Access forbidden by Row Level Security (RLS) policies or insufficient role privilege.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "42501"
            message: insufficient_privilege
            details: Operation not permitted under active role permissions.
            hint: Check role privileges or assigned student relationships.
    404NotFound:
      description: >-
        Edge Function resource is absent or outside the caller’s permitted scope. Collection
        PostgREST GET instead returns 200 with an empty array.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: Resource not found.
            details: null
            hint: null
    409Conflict:
      description: Conflict with existing unique constraint, natural key, or immutable state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "23505"
            message: duplicate key value violates unique constraint
            details: Key (code)=(BSCS) already exists.
            hint: Provide unique identifier.
    500InternalError:
      description: Internal PostgreSQL or Edge Function execution error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: XX000
            message: Internal server error
            details: Unexpected exception occurred during processing.
            hint: null
    429TooManyRequests:
      description: Server/gateway request budget exceeded. Retry according to Retry-After; no partial writes.
      headers:
        Retry-After:
          description: Delay in seconds before retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: PostgREST or Edge Function error code
          example: "23505"
          maxLength: 100
        message:
          type: string
          description: Human-readable error message
          example: duplicate key value violates unique constraint
          maxLength: 1000
        details:
          type:
            - string
            - "null"
          description: Detailed explanation of the error
          example: Key (code)=(BSCS) already exists.
          maxLength: 2000
        hint:
          type:
            - string
            - "null"
          description: Guidance on how to resolve the error
          example: null
          maxLength: 1000
      description: >-
        Sanitized public error. Do not return SQL row dumps, internal notes, tokens, credentials or
        other students’ records. Record-grades codes include ALREADY_ENROLLED,
        GRADE_ALREADY_RECORDED and ENROLLMENT_CONFIRMATION_REQUIRED; stale revisions, locked terms
        and unmet strict prerequisites are conflicts.
    RoleType:
      type: string
      enum:
        - student
        - adviser
        - department_head
        - department_staff
        - dean
        - admin
      description: User role within SAAIS
    ProfileStatus:
      type: string
      enum:
        - invited
        - active
        - disabled
      description: Account status
    InvitationStatus:
      type: string
      enum:
        - pending
        - accepted
        - expired
        - declined
        - revoked
      description: Lifecycle status of an account invitation without exposing raw invitation tokens
    CourseCategory:
      type: string
      enum:
        - major
        - ge
        - elective
        - pe
        - nstp
        - foundation
        - service
      description: Course catalog category filter/badge (Major, GE, Elective, PE, NSTP, Foundation, Service)
    AuditActionCategory:
      type: string
      enum:
        - view
        - change
        - sign_in
        - record_view
        - grade_update
        - plan_save
        - note_change
        - override
        - export
        - auth_account
        - catalog_term
      description: High-level (`view`, `change`, `sign_in`) and granular audit action filter category for Audit Log views
    ProgramStatus:
      type: string
      enum:
        - active
        - inactive
        - archived
      description: Program status
    CurriculumVersionStatus:
      type: string
      enum:
        - draft
        - active
        - retired
        - teach_out
        - closed
      description: Curriculum version lifecycle status
    CurriculumSlotType:
      type: string
      enum:
        - required
        - elective
        - ge
        - pe
        - nstp
      description: Curriculum slot classification (required/major course, departmental/technical elective, GE, PE, or NSTP)
    CourseStatus:
      type: string
      enum:
        - active
        - inactive
        - discontinued
      description: Course catalog offering status
    RepeatableType:
      type: string
      enum:
        - none
        - grade_replacement
        - grade_averaging
        - additional_credit
      description: Course retake credit rule
    MidtermStatus:
      type: string
      enum:
        - graded
        - dr
      description: Midterm outcome status (graded numeric midterm vs VSU DR midterm drop)
    PrerequisiteType:
      type: string
      enum:
        - strict
        - co_requisite
        - recommended
      description: Prerequisite linkage enforcement type
    AttemptStatus:
      type: string
      enum:
        - passed
        - failed
        - currently_enrolled
        - inc
        - dr
        - na
      description: Student enrollment attempt outcome
    DecisionType:
      type: string
      enum:
        - transfer_equivalency
        - discontinued_course_equivalency
      description: Course equivalency substitution category
    SchoolTermType:
      type: string
      enum:
        - 1st Semester
        - 2nd Semester
        - Summer
      description: Semester or summer academic session
    InviteRequest:
      oneOf:
        - $ref: "#/components/schemas/StudentInviteRequest"
        - $ref: "#/components/schemas/AdviserInviteRequest"
        - $ref: "#/components/schemas/AdminInviteRequest"
        - $ref: "#/components/schemas/StaffRoleInviteRequest"
      description: >-
        Admin or Department Staff/Head provisions identity and role-specific academic assignments
        atomically before invitation completion. Students require matching program/curriculum and an
        optional active adviser (or unassigned pending assignment); advisers and staff roles require
        organizational scope. Department Head and Department Staff may provision Students, Advisers,
        Department Staff, and Department Heads within their own department (`admin` and `dean`
        grants remain Admin-only). Unified provisioning creates the pre-registered `Profile`
        (`status: invited`) and `RoleAssignment` rows (allowing immediate Google OAuth sign-in on
        that `@vsu.edu.ph` email) and dispatches an expiring password-setup invitation link.
    InviteResponse:
      type: object
      required:
        - success
        - message
        - profile_id
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Invitation email dispatched successfully.
        profile_id:
          type: string
          format: uuid
        invitation_status:
          $ref: "#/components/schemas/InvitationStatus"
        invitation_sent_at:
          type: string
          format: date-time
        invitation_expires_at:
          type: string
          format: date-time
    VerifyInviteRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 2048
          writeOnly: true
          pattern: \S
          description: >-
            Opaque application invitation token, not a user JWT, OAuth authorization code, refresh
            token or Supabase token_hash. Validate expiry and single-use redemption server-side;
            never log the token or password.
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: >-
            Initial account password: 12 to 128 characters, requiring at least one uppercase letter,
            one lowercase letter, and one digit. Validated server-side before activating the account.
      required:
        - token
        - password
    VerifyInviteResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Account successfully activated.
      description: >-
        Application activation acknowledgement only. Does not create a browser Supabase session or
        contain Auth access/refresh tokens.
    PreviewInviteRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 2048
          writeOnly: true
          pattern: \S
          description: >-
            Opaque application invitation token passed in the JSON request body (never in query
            strings) to preview invitation details without consuming the token.
    PreviewInviteResponse:
      type: object
      additionalProperties: false
      required:
        - valid
        - status
        - email
        - full_name
        - role
        - roles
        - expires_at
      properties:
        valid:
          type: boolean
          description: True when the invitation is still pending and unredeemed/unexpired.
        status:
          $ref: "#/components/schemas/InvitationStatus"
        email:
          type: string
          format: email
          description: Invited institutional email address (`@vsu.edu.ph`).
        full_name:
          type: string
          maxLength: 150
        role:
          $ref: "#/components/schemas/RoleType"
        roles:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RoleType"
        faculty_name:
          type:
            - string
            - "null"
          maxLength: 250
          description: Display name of the invited account's assigned or derived College/Faculty.
        department_name:
          type:
            - string
            - "null"
          maxLength: 250
          description: Display name of the invited account's assigned or derived Department.
        program_code:
          type:
            - string
            - "null"
          maxLength: 100
          description: Student degree program code when the invitation is for a student.
        expires_at:
          type: string
          format: date-time
          description: Timestamp when the invitation link expires.
    DeclineInviteRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 2048
          writeOnly: true
          pattern: \S
          description: >-
            Opaque application invitation token passed in the JSON request body to decline a pending
            invitation without creating a session.
        reason:
          type:
            - string
            - "null"
          maxLength: 500
    DeclineInviteResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - invitation_status
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Invitation declined.
        invitation_status:
          $ref: "#/components/schemas/InvitationStatus"
    ResendInviteResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - profile_id
        - invitation_status
        - invitation_sent_at
        - invitation_expires_at
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Invitation regenerated and dispatched.
        profile_id:
          type: string
          format: uuid
        invitation_status:
          $ref: "#/components/schemas/InvitationStatus"
        invitation_sent_at:
          type: string
          format: date-time
        invitation_expires_at:
          type: string
          format: date-time
    RevokeInviteRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type:
            - string
            - "null"
          maxLength: 500
    RoleAssignment:
      type: object
      additionalProperties: false
      required:
        - id
        - profile_id
        - role
        - created_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        profile_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/RoleType"
        faculty_id:
          type:
            - string
            - "null"
          format: uuid
        department_id:
          type:
            - string
            - "null"
          format: uuid
        created_at:
          type: string
          format: date-time
          readOnly: true
    RoleAssignmentInput:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/RoleType"
        faculty_id:
          type:
            - string
            - "null"
          format: uuid
        department_id:
          type:
            - string
            - "null"
          format: uuid
    Profile:
      type: object
      required:
        - id
        - role
        - email
        - full_name
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role:
          $ref: "#/components/schemas/RoleType"
        roles:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RoleType"
        email:
          type: string
          format: email
        full_name:
          type: string
        student_number:
          type:
            - string
            - "null"
          maxLength: 64
        status:
          $ref: "#/components/schemas/ProfileStatus"
        invitation_status:
          anyOf:
            - $ref: "#/components/schemas/InvitationStatus"
            - type: "null"
          readOnly: true
          description: Token-free invitation lifecycle state for account directory views.
        invitation_sent_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        invitation_expires_at:
          type:
            - string
            - "null"
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        faculty_id:
          type:
            - string
            - "null"
          format: uuid
        department_id:
          type:
            - string
            - "null"
          format: uuid
        avatar_url:
          type:
            - string
            - "null"
          maxLength: 2048
        consultation_hours:
          type:
            - string
            - "null"
          maxLength: 250
          description: Adviser or faculty consultation schedule displayed on Student Dashboard / Mobile Student Home.
    AdminProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
          pattern: \S
        role:
          $ref: "#/components/schemas/RoleType"
        role_assignments:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/RoleAssignmentInput"
        status:
          $ref: "#/components/schemas/ProfileStatus"
        faculty_id:
          type:
            - string
            - "null"
          format: uuid
        department_id:
          type:
            - string
            - "null"
          format: uuid
        avatar_url:
          type:
            - string
            - "null"
          maxLength: 2048
        consultation_hours:
          type:
            - string
            - "null"
          maxLength: 250
        student_number:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 64
      minProperties: 1
      description: >-
        Admin-only account fields; role-specific organization and retained-history checks apply
        server-side. Student program changes use the curriculum-assignment transaction. Auth
        identity and profile must remain consistent. Students have no profile mutation operation.
    Faculty:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type:
            - string
            - "null"
          maxLength: 50
          example: FECS
        name:
          type: string
          example: Faculty of Engineering & Computer Studies
        letterhead_prefix:
          type:
            - string
            - "null"
          maxLength: 150
          example: Office of the Dean
        letterhead_name:
          type:
            - string
            - "null"
          maxLength: 250
          example: Faculty of Engineering and Computer Studies
        dean_name:
          type:
            - string
            - "null"
          maxLength: 150
          readOnly: true
          description: Derived active Dean display name for organization management tables.
    FacultyInsert:
      type: object
      required:
        - name
      properties:
        code:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 50
          pattern: \S
        name:
          type: string
          minLength: 2
          maxLength: 250
          pattern: \S
        letterhead_prefix:
          type:
            - string
            - "null"
          maxLength: 150
        letterhead_name:
          type:
            - string
            - "null"
          maxLength: 250
      additionalProperties: false
    FacultyUpdate:
      type: object
      properties:
        code:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 50
          pattern: \S
        name:
          type: string
          minLength: 2
          maxLength: 250
          pattern: \S
        letterhead_prefix:
          type:
            - string
            - "null"
          maxLength: 150
        letterhead_name:
          type:
            - string
            - "null"
          maxLength: 250
      additionalProperties: false
      minProperties: 1
    Department:
      type: object
      required:
        - id
        - faculty_id
        - name
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        faculty_id:
          type: string
          format: uuid
        code:
          type:
            - string
            - "null"
          maxLength: 50
          example: DCS
        name:
          type: string
          example: Department of Computer Science
        letterhead_prefix:
          type:
            - string
            - "null"
          maxLength: 150
          example: Department of Computer Science
        letterhead_name:
          type:
