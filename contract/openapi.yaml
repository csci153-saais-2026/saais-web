openapi: 3.1.0
info:
  title: Student Academic Advising Information System (SAAIS) API
  version: 0.2.0
  description: >-
    Target SAAIS API contract: read-only PostgREST projections and authenticated transactional Edge
    Function writes. The confirmed SRS governs business rules. This specification and its
    x-required-roles metadata do not implement authorization, pagination, rate limiting or database
    guards: those must be enforced by the gateway, RLS and verified server operations before
    deployment. Supabase Auth handles hosted sessions and password/Google flows; this contract
    describes application provisioning and academic operations. Scheduled INC cache maintenance is
    service-only internal database work, not a SPA operation.
  license:
    name: Proprietary
    url: https://github.com/csci153-saais-2026/saais-web/blob/main/LICENSE.md
servers:
  - url: https://{project_ref}.supabase.co
    description: >-
      Hosted Supabase HTTPS gateway; configure the real project reference. Production requests
      require HTTPS; no specific TLS version is assumed.
    variables:
      project_ref:
        default: your-project-ref
        description: Deployment Supabase project reference.
  - url: http://127.0.0.1:54321
    description: Loopback-only local Supabase sandbox. HTTP is permitted only for local development.
security:
  - bearerAuth: []
tags:
  - name: System
    description: System health and diagnostic endpoints
  - name: Auth
    description: User authentication, invitation provisioning, and password setup
  - name: Profile
    description: User profiles and institutional role accounts
  - name: Faculty & Department
    description: Academic divisions (Faculties/Colleges) and subordinate academic departments
  - name: Program & Curriculum
    description: Degree programs, versioned curricula, positional terms, and checklist slots
  - name: Course Catalog
    description: Master course catalog and prerequisite linkages
  - name: Terms & Offerings
    description: Calendar school terms, term locks, and course offerings
  - name: Advising & Exceptions
    description: >-
      Student-scoped academic reads and transactional adviser operations. Prerequisite clearance
      corrects the original prerequisite grade; no approval queue, enrollment bypass or global code
      equivalence.
paths:
  /functions/v1/auth/invite:
    post:
      tags:
        - Auth
      summary: Send account invitation
      operationId: inviteUser
      description: >-
        Admin operation to provision a pre-registered profile and send an email invitation token for
        password creation. Required role: admin.
      x-required-roles:
        - admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "200":
          description: Invitation email dispatched successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "409":
          $ref: "#/components/responses/409Conflict"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500InternalError"
      x-access-scope: admin-only
  /functions/v1/auth/verify-invite:
    post:
      tags:
        - Auth
      summary: Verify invitation token and set initial password
      operationId: verifyInviteToken
      description: >-
        Redeems an invitation token provided via email link to set the user's initial password and
        activate the user profile. Publicly callable with valid token.
      x-required-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyInviteRequest"
      responses:
        "200":
          description: Password set and profile activated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyInviteResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500InternalError"
      x-access-scope: single-use-expiring-invitation-token
  /rest/v1/profile:
    get:
      tags:
        - Profile
      summary: Query user profiles
      operationId: listProfiles
      description: >-
        List or filter user profiles via PostgREST query parameters. Students can only select their
        own profile via RLS. Advisers can select assigned advisees. Admins have system-wide
        visibility.
         Flat columns are allowlisted per x-projection-fields; role metadata documents checks, not automatic runtime authorization. Inaccessible/missing collection rows return 200 [], while invalid role/column requests may return 403.
      x-required-roles:
        - student
        - adviser
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParam"
        - $ref: "#/components/parameters/emailQueryParam"
        - $ref: "#/components/parameters/roleQueryParam"
        - name: status
          in: query
          required: false
          description: Filter this entity’s valid status.
          schema:
            type: string
            maxLength: 40
            pattern: ^eq\.(invited|active|disabled)$
        - $ref: "#/components/parameters/studentNumberQueryParam"
        - name: select
          in: query
          required: false
          description: >-
            Only these flat safe columns. On private-column tables the client must explicitly send
            this projection; PostgREST does not apply OpenAPI defaults.
          schema:
            type: string
            maxLength: 2000
            pattern: >-
              ^(?:id|role|email|full_name|student_number|status|created_at|updated_at|faculty_id)(?:,(?:id|role|email|full_name|student_number|status|created_at|updated_at|faculty_id))*$
            default: id,role,email,full_name,student_number,status,created_at,updated_at,faculty_id
        - name: order
          in: query
          required: false
          description: Stable ordering on published columns only; whitelist and enforce at runtime.
          schema:
            type: string
            maxLength: 1000
            pattern: >-
              ^(?:id|role|email|full_name|student_number|status|created_at|updated_at|faculty_id)\.(?:asc|desc)(?:\.nulls(?:first|last))?(?:,(?:id|role|email|full_name|student_number|status|created_at|updated_at|faculty_id)\.(?:asc|desc)(?:\.nulls(?:first|last))?)*$
            default: id.asc
        - $ref: "#/components/parameters/limitQueryParam"
        - $ref: "#/components/parameters/offsetQueryParam"
        - $ref: "#/components/parameters/facultyIdQueryParam"
      responses:
        "200":
          description: Array of matching profile records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
                maxItems: 1000
          headers:
            Content-Range:
              description: PostgREST visible item range; total may be * when exact counts are not requested.
              schema:
                type: string
                maxLength: 100
        "206":
          description: Partial visible collection if the gateway reports a partial range.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
                maxItems: 1000
          headers:
            Content-Range:
              description: PostgREST visible item range; total may be * when exact counts are not requested.
              schema:
                type: string
                maxLength: 100
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500InternalError"
      x-access-scope:
        student: own-records
        adviser: current-or-historic-assigned-students-read-only
        admin: institution-wide
      x-projection-fields:
        - id
        - role
        - email
        - full_name
        - student_number
        - status
        - created_at
        - updated_at
        - faculty_id
