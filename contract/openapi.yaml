openapi: 3.1.0
info:
  title: Student Academic Advising Information System (SAAIS) API
  version: 0.3.0
  description: >-
    Target SAAIS API contract: read-only PostgREST projections and authenticated transactional Edge
    Function writes. The confirmed SRS governs business rules across the six assignable roles
    (student, adviser, department_head, department_staff, dean, admin) and multi-role account
    assignments. This specification and its x-required-roles metadata do not implement
    authorization, pagination, rate limiting or database guards: those must be enforced by the
    gateway, RLS and verified server operations before deployment. Supabase Auth handles hosted
    sessions and password/Google flows; this contract describes application provisioning and
    academic operations. Daily scheduled alert and INC cache evaluation runs server-side via
    pg_cron, while POST /functions/v1/notifications/evaluate-alerts exposes idempotent on-demand
    alert evaluation for Department Heads, Admins, and deterministic mock testing. Email/password
    and Google OAuth, PKCE callbacks, session refresh and logout are Supabase-managed SDK flows,
    not custom application endpoints. See
    x-supabase-auth-integration and contract/SUPABASE-AUTH.md for the client/gateway integration
    contract.
  license:
    name: Proprietary
    url: https://github.com/csci153-saais-2026/saais-web/blob/main/LICENSE.md
servers:
  - url: https://{project_ref}.supabase.co
    x-internal: false
    description: >-
      Hosted Supabase HTTPS gateway; configure the real project reference. Production requests
      require HTTPS; no specific TLS version is assumed.
    variables:
      project_ref:
        default: your-project-ref
        description: Deployment Supabase project reference.
  - url: http://127.0.0.1:54321
    x-internal: true
    description: Loopback-only local Supabase sandbox. HTTP is permitted only for local development.
security:
  - supabaseProjectKey: []
    bearerAuth: []
tags:
  - name: System
    description: System health and diagnostic endpoints
  - name: Auth
    description: User authentication, invitation provisioning, and password setup
  - name: Profile
    description: User profiles, multi-role assignments, and institutional accounts
  - name: Faculty & Department
    description: Academic divisions (Faculties/Colleges) and subordinate academic departments
  - name: Program & Curriculum
    description: Degree programs, versioned curricula, positional terms, checklist slots, and curriculum-pair equivalences
  - name: Course Catalog
    description: Master course catalog and prerequisite linkages
  - name: Terms & Offerings
    description: Calendar school terms, term locks, encoding closure, and course offerings
  - name: Advising & Exceptions
    description: >-
      Student-scoped academic reads and transactional adviser/department operations including grade
      encoding, prerequisite overrides, grade flags, batch grade import, curriculum transfers,
      elective mappings, course equivalencies, and outside credits.
  - name: Reports & Analytics
    description: Cohort analytics, at-risk rosters, and department/faculty summary metrics
  - name: Notifications & Settings
    description: In-app notification center, configurable delinquency thresholds, and backup metadata
paths:
  /functions/v1/auth/invite:
    post:
      tags:
        - Auth
      summary: Send account invitation
      operationId: inviteUser
      description: >-
        Unified account provisioning and invitation flow: atomically creates a pre-registered
        Profile (status='invited'), multi-role RoleAssignment rows, and initial student curriculum /
        adviser assignments (when student is included), and dispatches a single-use expiring
        password-setup invitation email (/invite#token=...). The fragment is read by the page and
        sent only in the JSON body to an invitation function. Pre-registered accounts may also sign in
        immediately with Google OAuth on the exact provisioned @vsu.edu.ph email; the first verified
        Google sign-in activates the profile (status='active') and invalidates any unused password
        invite token. Admins may provision any role and grant multi-role assignments across the
        institution; no caller may assign roles to themselves. Department Heads and Department Staff may
        provision student, adviser, department_staff, and department_head accounts (including multi-role combinations restricted to those roles)
        strictly within their own department scope. Any attempt by Department Head or Department
        Staff to grant admin or dean roles, grant roles to themselves, or assign another department/faculty is
        explicitly rejected with 403 Forbidden. Enforces @vsu.edu.ph institutional email and rejects
        duplicate email or student_number with 409 Conflict. A Dean assignment must coexist with
        an Adviser and/or Department Head assignment; new accounts must include the accompanying
        assignment in the same request. Reject a Dean-only account with 400. Privileged server code provisions the
        Supabase Auth identity and application profile/assignments and writes an immutable audit log
        entry with server-derived actor and timestamp; the SPA never calls Auth admin APIs or
        receives server credentials. An application invitation does not constitute a signed-in
        session.
      x-required-roles:
        - department_head
        - department_staff
        - admin
      security:
        - supabaseProjectKey: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "200":
          description: Invitation email dispatched successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "409":
          $ref: "#/components/responses/409Conflict"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500InternalError"
      x-access-scope:
        department_head: department-scoped-student-adviser-staff-and-head-invites-only
        department_staff: department-scoped-student-adviser-staff-and-head-invites-only
        admin: institution-wide-all-roles
  /functions/v1/auth/verify-invite:
    post:
      tags:
        - Auth
      summary: Verify invitation token and set initial password
      operationId: verifyInviteToken
      description: >-
        Application invitation redemption: accepts the single-use expiring application token from
        the invitation email, enforces the SAAIS password policy (12–128 characters with at least
        one uppercase letter, one lowercase letter, and one digit), sets the initial password in
        Supabase Auth through privileged server code, marks the invitation accepted, and activates
        the provisioned profile. Requires the public project apikey but no Authorization/user
        session. This is not Supabase /auth/v1/verify, a Google callback or a login endpoint. The
        handler must validate the token before any privileged work and must be deployable without a
        gateway user-JWT requirement. Future gateway/handler configuration is required; this
        contract does not apply it. Success returns activation acknowledgement, not an
        access/refresh token; use the Supabase SDK to sign in afterward.
      x-required-roles: []
      security:
        - supabaseProjectKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyInviteRequest"
      responses:
        "200":
          description: Password set and profile activated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyInviteResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500InternalError"
      x-access-scope: single-use-expiring-invitation-token
  /functions/v1/auth/preview-invite:
    post:
      tags:
        - Auth
      summary: Preview invitation metadata without consuming token
      operationId: previewInviteToken
      description: >-
        Pre-session, non-consuming invitation preview for the Invite landing card (Invite.dc.html).
        Accepts the opaque invitation token in the POST body (avoiding token exposure in server URL
        access logs or Referer headers) and returns only the bounded invitation summary needed to
        render the card (provisioned email, full_name, role, roles, faculty_name, department_name,
        program_code, expires_at, and invitation_status). Requires the public project apikey without
        a user session JWT and is rate-limited by IP and token hash. Never consumes or extends the
        token and never returns internal profile IDs or tokens.
      x-required-roles: []
      security:
        - supabaseProjectKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewInviteRequest"
      responses:
        "200":
          description: Non-consuming invitation summary returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewInviteResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500InternalError"
      x-access-scope: single-use-expiring-invitation-token
  /functions/v1/auth/decline-invite:
    post:
      tags:
        - Auth
      summary: Decline an active account invitation token
      operationId: declineInviteToken
      description: >-
        Pre-session invitation decline action from the Invite landing card (Invite.dc.html). Accepts
        the single-use expiring invitation token in the POST body, atomically invalidates the token,
        transitions invitation_status to declined in a race-safe compare-and-set against concurrent
        redemption or revocation, and writes an audit log entry. Requires the public project apikey
        without a user session JWT. Returns 409 Conflict if the invitation was already accepted,
        revoked, expired, or declined.
      x-required-roles: []
      security:
        - supabaseProjectKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineInviteRequest"
      responses:
        "200":
          description: Invitation token declined and invalidated atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclineInviteResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500InternalError"
      x-access-scope: single-use-expiring-invitation-token
  /rest/v1/profile:
    get:
      tags:
        - Profile
      summary: Query user profiles
      operationId: listProfiles
      description: >-
        List or filter user profiles via PostgREST query parameters. Students can only select their
        own profile via RLS. Advisers can select assigned advisees. Department Heads and Department
        Staff can select department-scoped profiles. Deans can select faculty-scoped profiles.
        Admins have system-wide visibility. Flat columns are allowlisted per x-projection-fields;
        role metadata documents checks, not automatic runtime authorization. Inaccessible/missing
        collection rows return 200 [], while invalid role/column requests may return 403.
      x-required-roles:
        - student
        - adviser
        - department_head
        - department_staff
        - dean
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParam"
        - $ref: "#/components/parameters/emailQueryParam"
        - $ref: "#/components/parameters/roleQueryParam"
        - name: status
          in: query
          required: false
          description: Filter this entity’s valid status.
          schema:
            type: string
            maxLength: 40
            pattern: ^eq\.(invited|active|disabled)$
        - $ref: "#/components/parameters/studentNumberQueryParam"
        - name: select
          in: query
          required: false
          description: >-
            Only these flat safe columns. On private-column tables the client must explicitly send
            this projection; PostgREST does not apply OpenAPI defaults.
          schema:
            type: string
            maxLength: 2000
            pattern: >-
              ^(?:id|role|email|full_name|student_number|status|invitation_status|invitation_sent_at|invitation_expires_at|created_at|updated_at|faculty_id|department_id|avatar_url|consultation_hours)(?:,(?:id|role|email|full_name|student_number|status|invitation_status|invitation_sent_at|invitation_expires_at|created_at|updated_at|faculty_id|department_id|avatar_url|consultation_hours))*$
            default: id,role,email,full_name,student_number,status,invitation_status,invitation_sent_at,invitation_expires_at,created_at,updated_at,faculty_id,department_id,avatar_url,consultation_hours
        - name: order
          in: query
          required: false
          description: Stable ordering on published columns only; whitelist and enforce at runtime.
          schema:
            type: string
            maxLength: 1000
            pattern: >-
              ^(?:id|role|email|full_name|student_number|status|invitation_status|invitation_sent_at|invitation_expires_at|created_at|updated_at|faculty_id|department_id|avatar_url|consultation_hours)\.(?:asc|desc)(?:\.nulls(?:first|last))?(?:,(?:id|role|email|full_name|student_number|status|invitation_status|invitation_sent_at|invitation_expires_at|created_at|updated_at|faculty_id|department_id|avatar_url|consultation_hours)\.(?:asc|desc)(?:\.nulls(?:first|last))?)*$
            default: id.asc
        - $ref: "#/components/parameters/limitQueryParam"
        - $ref: "#/components/parameters/offsetQueryParam"
        - $ref: "#/components/parameters/facultyIdQueryParam"
        - $ref: "#/components/parameters/departmentIdQueryParam"
      responses:
        "200":
          description: Array of matching profile records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
                maxItems: 1000
          headers:
            Content-Range:
              description: PostgREST visible item range; total may be * when exact counts are not requested.
              schema:
                type: string
                maxLength: 100
        "206":
          description: Partial visible collection if the gateway reports a partial range.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
                maxItems: 1000
          headers:
            Content-Range:
              description: PostgREST visible item range; total may be * when exact counts are not requested.
              schema:
                type: string
                maxLength: 100
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500InternalError"
      x-access-scope:
        student: own-records
        adviser: current-or-historic-assigned-students-read-only
        department_head: department-scoped-read-only
        department_staff: department-scoped-read-only
        dean: faculty-scoped-read-only
        admin: institution-wide
      x-projection-fields:
        - id
        - role
        - email
        - full_name
        - student_number
        - status
        - invitation_status
        - invitation_sent_at
        - invitation_expires_at
        - created_at
        - updated_at
        - faculty_id
        - department_id
        - avatar_url
        - consultation_hours
  /rest/v1/role_assignment:
    get:
      tags:
        - Profile
      summary: Query multi-role assignments
      operationId: listRoleAssignments
      description: >-
        Retrieve institutional role assignments (including faculty/department scope) for user
        profiles. Enables multi-role authorization (e.g., Dean + Department Head, Adviser +
        Department Head) under a single login session.
      x-required-roles:
        - student
        - adviser
        - department_head
        - department_staff
        - dean
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParam"
        - $ref: "#/components/parameters/profileIdQueryParam"
        - $ref: "#/components/parameters/roleQueryParam"
        - $ref: "#/components/parameters/facultyIdQueryParam"
        - $ref: "#/components/parameters/departmentIdQueryParam"
        - name: select
          in: query
          required: false
          description: >-
            Only these flat safe columns.
          schema:
            type: string
            maxLength: 2000
            pattern: >-
              ^(?:id|profile_id|role|faculty_id|department_id|created_at)(?:,(?:id|profile_id|role|faculty_id|department_id|created_at))*$
            default: id,profile_id,role,faculty_id,department_id,created_at
        - name: order
          in: query
          required: false
          description: Stable ordering on published columns only; whitelist and enforce at runtime.
          schema:
            type: string
            maxLength: 1000
            pattern: >-
              ^(?:id|profile_id|role|faculty_id|department_id|created_at)\.(?:asc|desc)(?:\.nulls(?:first|last))?(?:,(?:id|profile_id|role|faculty_id|department_id|created_at)\.(?:asc|desc)(?:\.nulls(?:first|last))?)*$
            default: id.asc
        - $ref: "#/components/parameters/limitQueryParam"
        - $ref: "#/components/parameters/offsetQueryParam"
      responses:
        "200":
          description: Array of role assignments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleAssignment"
                maxItems: 1000
          headers:
            Content-Range:
              description: PostgREST visible item range; total may be * when exact counts are not requested.
              schema:
                type: string
                maxLength: 100
        "206":
          description: Partial visible collection if the gateway reports a partial range.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleAssignment"
                maxItems: 1000
          headers:
            Content-Range:
              description: PostgREST visible item range; total may be * when exact counts are not requested.
              schema:
                type: string
                maxLength: 100
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500InternalError"
      x-access-scope:
        student: own-records
        adviser: own-and-assigned-students-read-only
        department_head: department-scoped-read-only
        department_staff: department-scoped-read-only
        dean: faculty-scoped-read-only
        admin: institution-wide
      x-projection-fields:
        - id
        - profile_id
        - role
        - faculty_id
        - department_id
        - created_at
  /rest/v1/faculty:
    get:
      tags:
        - Faculty & Department
      summary: Query faculties / colleges
      operationId: listFaculties
      description: >-
        Retrieve list of university faculties (colleges/divisions), including safe display metadata
        for letterhead rendering and PDF signatory blocks (dean_name). Flat columns are allowlisted
        per x-projection-fields; role metadata documents checks, not automatic runtime
        authorization. Inaccessible/missing collection rows return 200 [], while invalid role/column
        requests may return 403.
      x-required-roles:
        - student
        - adviser
        - department_head
        - department_staff
        - dean
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParam"
        - $ref: "#/components/parameters/nameQueryParam"
        - name: select
          in: query
          required: false
          description: >-
            Only these flat safe columns. On private-column tables the client must explicitly send
            this projection; PostgREST does not apply OpenAPI defaults.
          schema:
            type: string
            maxLength: 2000
            pattern: ^(?:id|name|code|letterhead_prefix|letterhead_name|dean_name)(?:,(?:id|name|code|letterhead_prefix|letterhead_name|dean_name))*$
            default: id,name,code,letterhead_prefix,letterhead_name,dean_name
        - name: order
          in: query
          required: false
          description: Stable ordering on published columns only; whitelist and enforce at runtime.
          schema:
            type: string
            maxLength: 1000
            pattern: >-
              ^(?:id|name|code|letterhead_prefix|letterhead_name|dean_name)\.(?:asc|desc)(?:\.nulls(?:first|last))?(?:,(?:id|name|code|letterhead_prefix|letterhead_name|dean_name)\.(?:asc|desc)(?:\.nulls(?:first|last))?)*$
            default: id.asc
        - $ref: "#/components/parameters/limitQueryParam"
        - $ref: "#/components/parameters/offsetQueryParam"
      responses:
        "200":
          description: Array of faculty divisions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Faculty"
                maxItems: 1000
          headers:
            Content-Range:
              description: PostgREST visible item range; total may be * when exact counts are not requested.
              schema:
                type: string
                maxLength: 100
        "206":
          description: Partial visible collection if the gateway reports a partial range.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Faculty"
                maxItems: 1000
          headers:
            Content-Range:
              description: PostgREST visible item range; total may be * when exact counts are not requested.
              schema:
                type: string
                maxLength: 100
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "429":
          $ref: "#/components/responses/429TooManyRequests"
        "500":
          $ref: "#/components/responses/500InternalError"
      x-access-scope:
        student: own-records
        adviser: current-or-historic-assigned-students-read-only
        department_head: institution-reference-read-only
        department_staff: institution-reference-read-only
        dean: institution-reference-read-only
        admin: institution-wide
      x-projection-fields:
        - id
        - name
        - code
        - letterhead_prefix
        - letterhead_name
        - dean_name
  /rest/v1/department:
