openapi: 3.1.0
info:
  title: Student Academic Advising Information System (SAAIS) API
  version: 0.1.0
  description: >
    Official OpenAPI 3.1 contract and single source of truth for the SAAIS application.
    Covers PostgREST data endpoints and Supabase Edge Function operations for authentication,
    user profiles, organizational structures, academic catalog, advising assignments,
    enrollment attempts, prerequisite overrides, elective mappings, and equivalencies.
  license:
    name: Proprietary
    url: https://github.com/csci153-saais-2026/saais-web/blob/main/LICENSE.md
servers:
  - url: https://api.saais.internal
    description: Production Supabase Gateway (TLS 1.3 Strict Enforcement)
  - url: http://127.0.0.1:54321
    description: Local Supabase Development Sandbox (Development and Testing Only)

security:
  - bearerAuth: []

tags:
  - name: System
    description: System health and diagnostic endpoints
  - name: Auth
    description: User authentication, invitation provisioning, and password setup
  - name: Profile
    description: User profiles and institutional role accounts
  - name: Faculty & Department
    description: Academic divisions (Faculties/Colleges) and subordinate academic departments
  - name: Program & Curriculum
    description: Degree programs, versioned curricula, positional terms, and checklist slots
  - name: Course Catalog
    description: Master course catalog and prerequisite linkages
  - name: Terms & Offerings
    description: Calendar school terms, term locks, and course offerings
  - name: Advising & Exceptions
    description: >
      Longitudinal adviser assignments, curriculum assignments, student enrollment attempts,
      prerequisite overrides, elective slot mappings, and course equivalency decisions

paths:
  # ==========================================
  # SYSTEM ENDPOINTS
  # ==========================================
  /rest/v1/health:
    get:
      tags:
        - System
      summary: Health check probe
      operationId: getHealthStatus
      description: Returns health status of the PostgREST / Supabase layer.
      x-required-roles:
        - student
        - adviser
        - admin
      responses:
        "200":
          description: Service is healthy and responding.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "500":
          $ref: "#/components/responses/500InternalError"

  # ==========================================
  # AUTHENTICATION & ONBOARDING (EDGE FUNCTIONS)
  # ==========================================
  /functions/v1/auth/invite:
    post:
      tags:
        - Auth
      summary: Send account invitation
      operationId: inviteUser
      description: "Admin operation to provision a pre-registered profile and send an email invitation token for password creation. Required role: admin."
      x-required-roles:
        - admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "200":
          description: Invitation email dispatched successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"

  /functions/v1/auth/verify-invite:
    post:
      tags:
        - Auth
      summary: Verify invitation token and set initial password
      operationId: verifyInviteToken
      description: Redeems an invitation token provided via email link to set the user's initial password and activate the user profile. Publicly callable with valid token.
      x-required-roles: []
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyInviteRequest"
      responses:
        "200":
          description: Password set and profile activated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyInviteResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"

  # ==========================================
  # PROFILE ENDPOINTS (PostgREST)
  # ==========================================
  /rest/v1/profile:
    get:
      tags:
        - Profile
      summary: Query user profiles
      operationId: listProfiles
      description: >
        List or filter user profiles via PostgREST query parameters. Students can only select their own
        profile via RLS. Advisers can select assigned advisees. Admins have system-wide visibility.
      x-required-roles:
        - student
        - adviser
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParam"
        - $ref: "#/components/parameters/emailQueryParam"
        - $ref: "#/components/parameters/roleQueryParam"
        - $ref: "#/components/parameters/statusQueryParam"
        - $ref: "#/components/parameters/departmentIdQueryParam"
        - $ref: "#/components/parameters/studentNumberQueryParam"
        - $ref: "#/components/parameters/selectQueryParam"
        - $ref: "#/components/parameters/orderQueryParam"
        - $ref: "#/components/parameters/limitQueryParam"
        - $ref: "#/components/parameters/offsetQueryParam"
      responses:
        "200":
          description: Array of matching profile records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "500":
          $ref: "#/components/responses/500InternalError"
    post:
      tags:
        - Profile
      summary: Create user profile
      operationId: createProfile
      description: "Directly provision a new profile record. Used by admins for manual account setup and batch CSV imports. Required role: admin."
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/preferHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInsert"
      responses:
        "201":
          description: Profile successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"
    patch:
      tags:
        - Profile
      summary: Update user profile
      operationId: updateProfile
      description: "Update an existing profile record identified by query filter (e.g. `id=eq.{uuid}`). Students can update limited contact info; Admins can update roles, statuses, and department affiliations."
      x-required-roles:
        - student
        - adviser
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParamRequired"
        - $ref: "#/components/parameters/preferHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminProfileUpdate"
      responses:
        "200":
          description: Profile successfully updated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
        "204":
          description: Updated without returning representation.
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"

  # ==========================================
  # FACULTY & DEPARTMENT ENDPOINTS (PostgREST)
  # ==========================================
  /rest/v1/faculty:
    get:
      tags:
        - Faculty & Department
      summary: Query faculties / colleges
      operationId: listFaculties
      description: Retrieve list of university faculties (colleges/divisions).
      x-required-roles:
        - student
        - adviser
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParam"
        - $ref: "#/components/parameters/nameQueryParam"
        - $ref: "#/components/parameters/selectQueryParam"
        - $ref: "#/components/parameters/orderQueryParam"
        - $ref: "#/components/parameters/limitQueryParam"
        - $ref: "#/components/parameters/offsetQueryParam"
      responses:
        "200":
          description: Array of faculty divisions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Faculty"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "500":
          $ref: "#/components/responses/500InternalError"
    post:
      tags:
        - Faculty & Department
      summary: Create faculty
      operationId: createFaculty
      description: "Create a new faculty / college division. Required role: admin."
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/preferHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacultyInsert"
      responses:
        "201":
          description: Faculty successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Faculty"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"
    patch:
      tags:
        - Faculty & Department
      summary: Update faculty
      operationId: updateFaculty
      description: "Update an existing faculty / college. Required role: admin."
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParamRequired"
        - $ref: "#/components/parameters/preferHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacultyUpdate"
      responses:
        "200":
          description: Faculty successfully updated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Faculty"
        "204":
          description: Updated without returning representation.
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"

  /rest/v1/department:
    get:
      tags:
        - Faculty & Department
      summary: Query academic departments
      operationId: listDepartments
      description: Retrieve academic departments linked to faculties.
      x-required-roles:
        - student
        - adviser
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParam"
        - $ref: "#/components/parameters/facultyIdQueryParam"
        - $ref: "#/components/parameters/nameQueryParam"
        - $ref: "#/components/parameters/selectQueryParam"
        - $ref: "#/components/parameters/orderQueryParam"
        - $ref: "#/components/parameters/limitQueryParam"
        - $ref: "#/components/parameters/offsetQueryParam"
      responses:
        "200":
          description: Array of academic departments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "500":
          $ref: "#/components/responses/500InternalError"
    post:
      tags:
        - Faculty & Department
      summary: Create academic department
      operationId: createDepartment
      description: "Create a new academic department under a faculty. Required role: admin."
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/preferHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInsert"
      responses:
        "201":
          description: Department successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"
    patch:
      tags:
        - Faculty & Department
      summary: Update academic department
      operationId: updateDepartment
      description: "Update an academic department. Required role: admin."
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParamRequired"
        - $ref: "#/components/parameters/preferHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdate"
      responses:
        "200":
          description: Department successfully updated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
        "204":
          description: Updated without returning representation.
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"

  # ==========================================
  # PROGRAM & CURRICULUM ENDPOINTS (PostgREST)
  # ==========================================
  /rest/v1/program:
    get:
      tags:
        - Program & Curriculum
      summary: Query degree programs
      operationId: listPrograms
      description: Retrieve degree programs with nominal duration and lifecycle status.
      x-required-roles:
        - student
        - adviser
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParam"
        - $ref: "#/components/parameters/facultyIdQueryParam"
        - $ref: "#/components/parameters/codeQueryParam"
        - $ref: "#/components/parameters/statusQueryParam"
        - $ref: "#/components/parameters/selectQueryParam"
        - $ref: "#/components/parameters/orderQueryParam"
        - $ref: "#/components/parameters/limitQueryParam"
        - $ref: "#/components/parameters/offsetQueryParam"
      responses:
        "200":
          description: Array of degree programs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "500":
          $ref: "#/components/responses/500InternalError"
    post:
      tags:
        - Program & Curriculum
      summary: Create degree program
      operationId: createProgram
      description: "Create a new academic degree program. Required role: admin."
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/preferHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramInsert"
      responses:
        "201":
          description: Degree program successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"
    patch:
      tags:
        - Program & Curriculum
      summary: Update degree program
      operationId: updateProgram
      description: "Update degree program attributes or archive status. Required role: admin."
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParamRequired"
        - $ref: "#/components/parameters/preferHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: Degree program successfully updated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"
        "204":
          description: Updated without returning representation.
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"

  /rest/v1/curriculum_version:
    get:
      tags:
        - Program & Curriculum
      summary: Query curriculum versions
      operationId: listCurriculumVersions
      description: Retrieve versioned curriculum structures with total units and delinquency thresholds.
      x-required-roles:
        - student
        - adviser
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParam"
        - $ref: "#/components/parameters/programIdQueryParam"
        - $ref: "#/components/parameters/versionLabelQueryParam"
        - $ref: "#/components/parameters/statusQueryParam"
        - $ref: "#/components/parameters/selectQueryParam"
        - $ref: "#/components/parameters/orderQueryParam"
        - $ref: "#/components/parameters/limitQueryParam"
        - $ref: "#/components/parameters/offsetQueryParam"
      responses:
        "200":
          description: Array of curriculum versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CurriculumVersion"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "500":
          $ref: "#/components/responses/500InternalError"
    post:
      tags:
        - Program & Curriculum
      summary: Create curriculum version
      operationId: createCurriculumVersion
      description: "Create a new versioned curriculum for a degree program. Required role: admin."
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/preferHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumVersionInsert"
      responses:
        "201":
          description: Curriculum version successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculumVersion"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"
    patch:
      tags:
        - Program & Curriculum
      summary: Update curriculum version
      operationId: updateCurriculumVersion
      description: "Update curriculum version settings, dates, threshold, or lifecycle status. Required role: admin."
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParamRequired"
        - $ref: "#/components/parameters/preferHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumVersionUpdate"
      responses:
        "200":
          description: Curriculum version successfully updated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CurriculumVersion"
        "204":
          description: Updated without returning representation.
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"

  /rest/v1/curriculum_term:
    get:
      tags:
        - Program & Curriculum
      summary: Query curriculum terms
      operationId: listCurriculumTerms
      description: Retrieve curriculum positional terms (year level and term sequence).
      x-required-roles:
        - student
        - adviser
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParam"
        - $ref: "#/components/parameters/curriculumVersionIdQueryParam"
        - $ref: "#/components/parameters/selectQueryParam"
        - $ref: "#/components/parameters/orderQueryParam"
        - $ref: "#/components/parameters/limitQueryParam"
        - $ref: "#/components/parameters/offsetQueryParam"
      responses:
        "200":
          description: Array of curriculum positional terms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CurriculumTerm"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "500":
          $ref: "#/components/responses/500InternalError"
    post:
      tags:
        - Program & Curriculum
      summary: Create curriculum term
      operationId: createCurriculumTerm
      description: "Add a positional term (year level and term sequence) to a curriculum version. Required role: admin."
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/preferHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumTermInsert"
      responses:
        "201":
          description: Curriculum term successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculumTerm"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"

  /rest/v1/curriculum_term_course:
    get:
      tags:
        - Program & Curriculum
      summary: Query curriculum term course slots
      operationId: listCurriculumTermCourses
      description: Retrieve curriculum term slots, distinguishing required courses and named elective placeholders.
      x-required-roles:
        - student
        - adviser
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParam"
        - $ref: "#/components/parameters/curriculumTermIdQueryParam"
        - $ref: "#/components/parameters/courseIdQueryParam"
        - $ref: "#/components/parameters/selectQueryParam"
        - $ref: "#/components/parameters/orderQueryParam"
        - $ref: "#/components/parameters/limitQueryParam"
        - $ref: "#/components/parameters/offsetQueryParam"
      responses:
        "200":
          description: Array of curriculum checklist slots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CurriculumTermCourse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "500":
          $ref: "#/components/responses/500InternalError"
    post:
      tags:
        - Program & Curriculum
      summary: Add course or elective slot to curriculum term
      operationId: createCurriculumTermCourse
      description: "Add a required course or elective slot into a curriculum positional term. Required role: admin."
      x-required-roles:
        - admin
      parameters:
        - $ref: "#/components/parameters/preferHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurriculumTermCourseInsert"
      responses:
        "201":
          description: Curriculum course slot successfully added.
          content:
            application/json:
              schema:
