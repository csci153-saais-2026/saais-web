          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"

  /rest/v1/elective_mapping:
    get:
      tags:
        - Advising & Exceptions
      summary: Query elective checklist mappings
      operationId: listElectiveMappings
      description: "Retrieve mappings associating passed course attempts to open elective checklist slots. RLS-scoped: students view their own credited slots; advisers view assigned advisees; admins view all."
      x-required-roles:
        - student
        - adviser
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParam"
        - $ref: "#/components/parameters/attemptIdQueryParam"
        - $ref: "#/components/parameters/curriculumTermCourseIdQueryParam"
        - $ref: "#/components/parameters/selectQueryParam"
        - $ref: "#/components/parameters/orderQueryParam"
        - $ref: "#/components/parameters/limitQueryParam"
        - $ref: "#/components/parameters/offsetQueryParam"
      responses:
        "200":
          description: Array of elective mappings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ElectiveMapping"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "500":
          $ref: "#/components/responses/500InternalError"
    post:
      tags:
        - Advising & Exceptions
      summary: Map attempt to elective slot
      operationId: createElectiveMapping
      description: "Map an enrolled attempt to an elective checklist placeholder slot with justification. Required role: adviser or admin."
      x-required-roles:
        - adviser
        - admin
      parameters:
        - $ref: "#/components/parameters/preferHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElectiveMappingInsert"
      responses:
        "201":
          description: Elective mapping successfully established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectiveMapping"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"
    delete:
      tags:
        - Advising & Exceptions
      summary: Remove elective mapping
      operationId: deleteElectiveMapping
      description: "Remove an elective slot mapping. Required role: adviser or admin."
      x-required-roles:
        - adviser
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParamRequired"
      responses:
        "204":
          description: Elective mapping successfully deleted.
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"

  /rest/v1/equivalency_decision:
    get:
      tags:
        - Advising & Exceptions
      summary: Query course equivalency decisions
      operationId: listEquivalencyDecisions
      description: "Retrieve one-to-one transfer or discontinued course substitution decisions. RLS-scoped: students view their own approved substitutions; advisers view assigned advisees; admins view all."
      x-required-roles:
        - student
        - adviser
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParam"
        - $ref: "#/components/parameters/attemptIdQueryParam"
        - $ref: "#/components/parameters/destinationCurriculumTermCourseIdQueryParam"
        - $ref: "#/components/parameters/selectQueryParam"
        - $ref: "#/components/parameters/orderQueryParam"
        - $ref: "#/components/parameters/limitQueryParam"
        - $ref: "#/components/parameters/offsetQueryParam"
      responses:
        "200":
          description: Array of equivalency decisions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EquivalencyDecision"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "500":
          $ref: "#/components/responses/500InternalError"
    post:
      tags:
        - Advising & Exceptions
      summary: Record course equivalency decision
      operationId: createEquivalencyDecision
      description: "Record a formal equivalency decision mapping an attempt to a target checklist course. Required role: adviser or admin."
      x-required-roles:
        - adviser
        - admin
      parameters:
        - $ref: "#/components/parameters/preferHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquivalencyDecisionInsert"
      responses:
        "201":
          description: Equivalency decision recorded successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquivalencyDecision"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"
    patch:
      tags:
        - Advising & Exceptions
      summary: Update equivalency decision
      operationId: updateEquivalencyDecision
      description: "Update units credited or justification on an equivalency decision. Required role: adviser or admin."
      x-required-roles:
        - adviser
        - admin
      parameters:
        - $ref: "#/components/parameters/idQueryParamRequired"
        - $ref: "#/components/parameters/preferHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquivalencyDecisionUpdate"
      responses:
        "200":
          description: Equivalency decision successfully updated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EquivalencyDecision"
        "204":
          description: Updated without returning representation.
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"

# ==========================================
# COMPONENTS (SCHEMAS, RESPONSES, PARAMETERS)
# ==========================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth JWT Token

  parameters:
    preferHeader:
      name: Prefer
      in: header
      description: PostgREST preference header (e.g. `return=representation` or `return=minimal`)
      required: false
      schema:
        type: string
        example: "return=representation"

    selectQueryParam:
      name: select
      in: query
      description: PostgREST projection clause (restricted syntax to prevent excessive query nesting)
      required: false
      schema:
        type: string
        maxLength: 200
        pattern: '^[a-zA-Z0-9_\*,\.\(\):]+$'
        example: "id,full_name,department(id,name)"

    orderQueryParam:
      name: order
      in: query
      description: PostgREST ordering clause (e.g. `created_at.desc`)
      required: false
      schema:
        type: string

    limitQueryParam:
      name: limit
      in: query
      description: Number of rows to return for DoS pagination mitigation
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 20
        example: 20

    offsetQueryParam:
      name: offset
      in: query
      description: Number of rows to skip for DoS pagination mitigation
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0

    idQueryParam:
      name: id
      in: query
      description: Filter by UUID equality (e.g. `eq.3fa85f64-5717-4562-b3fc-2c963f66afa6`)
      required: false
      schema:
        type: string
        pattern: '^(eq|neq|in)\.([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
        example: "eq.3fa85f64-5717-4562-b3fc-2c963f66afa6"

    idQueryParamRequired:
      name: id
      in: query
      description: Filter targeting specific row by UUID equality (e.g. `eq.3fa85f64-5717-4562-b3fc-2c963f66afa6`)
      required: true
      schema:
        type: string
        pattern: '^eq\.([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
        example: "eq.3fa85f64-5717-4562-b3fc-2c963f66afa6"

    emailQueryParam:
      name: email
      in: query
      description: Filter by email equality (e.g. `eq.student@university.edu.ph`)
      required: false
      schema:
        type: string
        pattern: '^eq\.[^@]+@[^@]+\.[^@]+$'
        example: "eq.m.bautista@university.edu.ph"

    roleQueryParam:
      name: role
      in: query
      description: Filter by role (e.g. `eq.student`)
      required: false
      schema:
        type: string
        pattern: '^eq\.(student|adviser|admin)$'

    statusQueryParam:
      name: status
      in: query
      description: Filter by status equality (e.g. `eq.active`)
      required: false
      schema:
        type: string
        pattern: '^eq\.[a-z_]+$'

    departmentIdQueryParam:
      name: department_id
      in: query
      description: Filter by department UUID (e.g. `eq.3fa85f64-5717-4562-b3fc-2c963f66afa6`)
      required: false
      schema:
        type: string
        pattern: '^(eq|neq|in)\.([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'

    facultyIdQueryParam:
      name: faculty_id
      in: query
      description: Filter by faculty UUID (e.g. `eq.3fa85f64-5717-4562-b3fc-2c963f66afa6`)
      required: false
      schema:
        type: string
        pattern: '^(eq|neq|in)\.([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'

    programIdQueryParam:
      name: program_id
      in: query
      description: Filter by program UUID (e.g. `eq.3fa85f64-5717-4562-b3fc-2c963f66afa6`)
      required: false
      schema:
        type: string
        pattern: '^(eq|neq|in)\.([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'

    curriculumVersionIdQueryParam:
      name: curriculum_version_id
      in: query
      description: Filter by curriculum version UUID (e.g. `eq.3fa85f64-5717-4562-b3fc-2c963f66afa6`)
      required: false
      schema:
        type: string
        pattern: '^(eq|neq|in)\.([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'

    curriculumTermIdQueryParam:
      name: curriculum_term_id
      in: query
      description: Filter by curriculum term UUID (e.g. `eq.3fa85f64-5717-4562-b3fc-2c963f66afa6`)
      required: false
      schema:
        type: string
        pattern: '^(eq|neq|in)\.([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'

    curriculumTermCourseIdQueryParam:
      name: curriculum_term_course_id
      in: query
      description: Filter by curriculum checklist slot UUID (e.g. `eq.3fa85f64-5717-4562-b3fc-2c963f66afa6`)
      required: false
      schema:
        type: string
        pattern: '^(eq|neq|in)\.([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'

    courseIdQueryParam:
      name: course_id
      in: query
      description: Filter by course UUID (e.g. `eq.3fa85f64-5717-4562-b3fc-2c963f66afa6`)
      required: false
      schema:
        type: string
        pattern: '^(eq|neq|in)\.([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'

    prerequisiteCourseIdQueryParam:
      name: prerequisite_course_id
      in: query
      description: Filter by prerequisite course UUID (e.g. `eq.3fa85f64-5717-4562-b3fc-2c963f66afa6`)
      required: false
      schema:
        type: string
        pattern: '^(eq|neq|in)\.([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'

    schoolTermIdQueryParam:
      name: school_term_id
      in: query
      description: Filter by school term UUID (e.g. `eq.3fa85f64-5717-4562-b3fc-2c963f66afa6`)
      required: false
      schema:
        type: string
        pattern: '^(eq|neq|in)\.([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'

    adviserIdQueryParam:
      name: adviser_id
      in: query
      description: Filter by adviser UUID (e.g. `eq.3fa85f64-5717-4562-b3fc-2c963f66afa6`)
      required: false
      schema:
        type: string
        pattern: '^(eq|neq|in)\.([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'

    studentIdQueryParam:
      name: student_id
      in: query
      description: Filter by student UUID (e.g. `eq.3fa85f64-5717-4562-b3fc-2c963f66afa6`)
      required: false
      schema:
        type: string
        pattern: '^(eq|neq|in)\.([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'

    attemptIdQueryParam:
      name: attempt_id
      in: query
      description: Filter by attempt UUID (e.g. `eq.3fa85f64-5717-4562-b3fc-2c963f66afa6`)
      required: false
      schema:
        type: string
        pattern: '^(eq|neq|in)\.([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'

    destinationCurriculumTermCourseIdQueryParam:
      name: destination_curriculum_term_course_id
      in: query
      description: Filter by destination slot UUID (e.g. `eq.3fa85f64-5717-4562-b3fc-2c963f66afa6`)
      required: false
      schema:
        type: string
        pattern: '^(eq|neq|in)\.([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'

    courseOfferingIdQueryParam:
      name: course_offering_id
      in: query
      description: Filter by course offering UUID (e.g. `eq.3fa85f64-5717-4562-b3fc-2c963f66afa6`)
      required: false
      schema:
        type: string
        pattern: '^(eq|neq|in)\.([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'

    studentNumberQueryParam:
      name: student_number
      in: query
      description: Filter by student number (e.g. `eq.2023-04412`)
      required: false
      schema:
        type: string
        pattern: '^eq\.\d{4}-\d{5}$'
        example: "eq.2023-04412"

    nameQueryParam:
      name: name
      in: query
      description: Filter by name equality or pattern matching
      required: false
      schema:
        type: string
        maxLength: 100
        pattern: '^(eq|ilike|like)\.[a-zA-Z0-9 _%.-]+$'
        example: "ilike.%Computer Science%"

    codeQueryParam:
      name: code
      in: query
      description: Filter by code (e.g. `eq.BSCS` or `eq.CS101`)
      required: false
      schema:
        type: string
        pattern: '^eq\.[A-Za-z0-9 _-]+$'

    versionLabelQueryParam:
      name: version_label
      in: query
      description: Filter by version label (e.g. `eq.2023-2024`)
      required: false
      schema:
        type: string

    schoolYearQueryParam:
      name: school_year
      in: query
      description: Filter by school year (e.g. `eq.2025 - 2026`)
      required: false
      schema:
        type: string

    isLockedQueryParam:
      name: is_locked
      in: query
      description: Filter by lock state (e.g. `eq.true`)
      required: false
      schema:
        type: string
        pattern: '^eq\.(true|false)$'

    isByRequestQueryParam:
      name: is_by_request
      in: query
      description: Filter by by_request flag (e.g. `eq.true`)
      required: false
      schema:
        type: string
        pattern: '^eq\.(true|false)$'

  responses:
    400BadRequest:
      description: Invalid request parameters or payload violates integrity constraints.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "23514"
            message: "check constraint violation: units must be positive quarter steps"
            details: "Failing row contains (units=-3)."
            hint: "Ensure credit units are positive quarter steps (e.g. 1.00, 3.00)."

    401Unauthorized:
      description: Missing or invalid Supabase JWT Bearer authentication token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "PGRST301"
            message: "JWT expired or signature verification failed"
            details: null
            hint: "Refresh session token and pass Authorization: Bearer <token>"

    403Forbidden:
      description: Access forbidden by Row Level Security (RLS) policies or insufficient role privilege.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "42501"
            message: "insufficient_privilege"
            details: "Operation not permitted under active role permissions."
            hint: "Check role privileges or assigned student relationships."

    404NotFound:
      description: Target resource identified by query filter does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "PGRST116"
            message: "JSON object requested, multiple (or no) rows returned"
            details: "The result contains 0 rows"
            hint: "Verify UUID identifier."

    409Conflict:
      description: Conflict with existing unique constraint, natural key, or immutable state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "23505"
            message: "duplicate key value violates unique constraint"
            details: "Key (code)=(BSCS) already exists."
            hint: "Provide unique identifier."

    500InternalError:
      description: Internal PostgreSQL or Edge Function execution error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: "XX000"
            message: "Internal server error"
            details: "Unexpected exception occurred during processing."
            hint: null

  schemas:
    # ------------------------------------------
    # ERROR SCHEMA
    # ------------------------------------------
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: PostgREST or Edge Function error code
          example: "23505"
        message:
          type: string
          description: Human-readable error message
          example: "duplicate key value violates unique constraint"
        details:
          type:
            - string
            - "null"
          description: Detailed explanation of the error
          example: "Key (code)=(BSCS) already exists."
        hint:
          type:
            - string
            - "null"
          description: Guidance on how to resolve the error
          example: null

    # ------------------------------------------
    # ENUMS
    # ------------------------------------------
    RoleType:
      type: string
      enum:
        - student
        - adviser
        - admin
      description: User role within SAAIS

    ProfileStatus:
      type: string
      enum:
        - invited
        - active
        - disabled
      description: Account status

    ProgramStatus:
      type: string
      enum:
        - active
        - archived
      description: Program status

    CurriculumVersionStatus:
      type: string
      enum:
        - draft
        - active
        - teach_out
        - closed
      description: Curriculum version lifecycle status

    CourseStatus:
      type: string
      enum:
        - active
        - discontinued
      description: Course catalog offering status

    RepeatableType:
      type: string
      enum:
        - none
        - grade_replacement
        - additional_credit
      description: Course retake credit rule

    PrerequisiteType:
      type: string
      enum:
        - strict
        - co_requisite
        - recommended
      description: Prerequisite linkage enforcement type

    AttemptStatus:
      type: string
      enum:
        - passed
        - failed
        - currently_enrolled
        - inc
        - dr
        - na
      description: Student enrollment attempt outcome

    DecisionType:
      type: string
      enum:
        - transfer_equivalency
        - discontinued_course_equivalency
      description: Course equivalency substitution category

    SchoolTermType:
      type: string
      enum:
        - 1st Semester
        - 2nd Semester
        - Summer
      description: Semester or summer academic session

    # ------------------------------------------
    # AUTH & ONBOARDING SCHEMAS
    # ------------------------------------------
    InviteRequest:
      type: object
      required:
        - email
        - role
        - full_name
      properties:
        email:
          type: string
          format: email
          example: "m.bautista@university.edu.ph"
        role:
          $ref: "#/components/schemas/RoleType"
        full_name:
          type: string
          minLength: 2
          maxLength: 150
          example: "Maria Isabel Bautista"
        department_id:
          type:
            - string
            - "null"
          format: uuid
        student_number:
          type:
            - string
            - "null"
          pattern: '^\d{4}-\d{5}$'
          example: "2023-04412"

    InviteResponse:
      type: object
      required:
        - success
        - message
        - profile_id
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Invitation email dispatched successfully."
        profile_id:
          type: string
          format: uuid

    VerifyInviteRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: Unique invitation verification token received via email
        password:
          type: string
          format: password
          minLength: 8
          description: Initial account password

    VerifyInviteResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Account successfully activated."

    # ------------------------------------------
    # PROFILE SCHEMAS
    # ------------------------------------------
    Profile:
      type: object
      required:
        - id
        - role
        - email
        - full_name
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
