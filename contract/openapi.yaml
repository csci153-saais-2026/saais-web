x-saais-invariants:
  roles:
    - student
    - adviser
    - department_head
    - department_staff
    - dean
    - admin
  student_profile: read-only to the student; provisioned by Admin or authorized department Head/Staff
  dean_roles: >-
    An active Dean assignment must coexist with an Adviser and/or Department Head assignment.
    Enforce this on provisioning, role grant, revocation and account update in one transaction.
  prerequisite_override: >-
    current adviser replaces the original failed prerequisite final grade with a passing grade and
    reason; no approval queue or enrollment-only bypass
  equivalency: student-specific passed attempt to one destination; no global code-to-code equivalence
  inc: >-
    original INC remains stored; completion <=3 Passed, >3 Failed; first completion allowed in
    locked term until deadline; corrections obey lock
  midterm_dr_rule: >-
    under VSU grading policy, midterm_status=dr automatically forces attempt status=dr and
    final_grade=null
  record_grades: >-
    enroll or fill missing grades only; populated submitted grade rejects entire request even if
    identical
  history: past advisers read-only; server rechecks current assignment at commit
  credit_units: actual source attempt snapshot, never client supplied
  department_encoding_closure: >-
    A closed department and term blocks grade writes for affected students until reopened;
    the institution-wide lock and its Admin-only override remain independent.
  schema_boundary: Schema design is delivered separately; this contract does not deploy it.
x-saais-notification-triggers:
  delivery: >-
    Transactional Edge Functions insert Notification rows atomically with domain mutations and
    queue email delivery when applicable; scheduled/deadline rules are evaluated daily via pg_cron
    in production and on-demand via POST /functions/v1/notifications/evaluate-alerts (with
    deterministic dedupe_key idempotency and optional reference_date for MSW mock testing).
  event_driven:
    - event_type: advising_note_added
      kind: note
      source_operations: [addAdvisingNote]
      recipients: [student]
    - event_type: advising_plan_saved
      kind: note
      source_operations: [saveAdvisingPlan]
      recipients: [student]
    - event_type: midterm_grades_posted
      kind: grade
      source_operations: [recordGrades, encodeTermGrades, importGradesBatch]
      recipients: [student]
    - event_type: final_grades_posted
      kind: grade
      source_operations: [recordGrades, encodeTermGrades, importGradesBatch]
      recipients: [student]
    - event_type: grade_corrected
      kind: grade
      source_operations: [correctGrades]
      recipients: [student, department_head]
    - event_type: prerequisite_grade_corrected
      kind: grade
      source_operations: [correctPrerequisiteGrade]
      recipients: [student, department_head]
    - event_type: inc_completed
      kind: grade
      source_operations: [completeINC, correctINCCompletion]
      recipients: [student]
    - event_type: grade_flag_submitted
      kind: flag
      source_operations: [createGradeFlag]
      recipients: [adviser, department_head]
    - event_type: grade_flag_resolved
      kind: flag
      source_operations: [resolveGradeFlag]
      recipients: [student, adviser]
    - event_type: grade_import_committed
      kind: import
      source_operations: [importGradesBatch]
      recipients: [adviser, department_head, department_staff]
    - event_type: student_import_committed
      kind: import
      source_operations: [importStudentsBatch]
      recipients: [adviser, department_head, admin]
    - event_type: adviser_assigned
      kind: person
      source_operations: [inviteUser, reassignAdviser, bulkReassignAdvisers]
      recipients: [student, adviser]
    - event_type: adviser_reassigned_away
      kind: person
      source_operations: [reassignAdviser, bulkReassignAdvisers]
      recipients: [adviser]
    - event_type: curriculum_reassigned
      kind: transfer
      source_operations: [assignStudentCurriculum]
      recipients: [student, adviser]
    - event_type: curriculum_transfer_endorsed
      kind: transfer
      source_operations: [endorseCurriculumTransfer]
      recipients: [department_head, student]
    - event_type: curriculum_transfer_decided
      kind: transfer
      source_operations: [decideCurriculumTransfer]
      recipients: [adviser, student]
    - event_type: credit_decision_recorded
      kind: grade
      source_operations: [createElectiveMapping, createEquivalencyDecision, createOutsideCredit]
      recipients: [student]
    - event_type: credit_decision_revoked
      kind: alert
      source_operations: [revokeElectiveMapping, revokeEquivalencyDecision, revokeOutsideCredit]
      recipients: [student, adviser]
    - event_type: invitation_accepted
      kind: person
      source_operations: [verifyInviteToken]
      recipients: [admin, department_head, department_staff]
    - event_type: term_encoding_closed
      kind: alert
      source_operations: [closeSchoolTermEncoding]
      recipients: [adviser, department_staff, department_head, dean]
    - event_type: term_override_toggled
      kind: alert
      source_operations: [setSchoolTermOverride]
      recipients: [adviser, department_head, admin]
    - event_type: catalog_updated
      kind: report
      source_operations: [createCourse, updateCourse, createCurriculumVersion, updateCurriculumVersion]
      recipients: [department_head, dean]
  scheduled_and_threshold:
    - event_type: inc_deadline_approaching
      kind: alert
      windows_days: [30, 14, 7]
      recipients: [student, adviser]
    - event_type: inc_lapsed
      kind: alert
      recipients: [student, adviser, department_head]
    - event_type: standing_threshold_alert
      kind: alert
      recipients: [student, adviser, department_head, dean]
    - event_type: encoding_deadline_approaching
      kind: alert
      windows_days: [7, 3, 1]
      recipients: [adviser, department_staff, department_head]
    - event_type: unassigned_students_pending
      kind: alert
      recipients: [department_head, department_staff, admin]
    - event_type: invitation_expiring_soon
      kind: alert
      windows_days: [3, 1]
      recipients: [admin, department_head, department_staff]
    - event_type: backup_overdue_reminder
      kind: alert
      recipients: [department_head, admin]
x-resource-controls:
  required_at_runtime:
    - Server-enforced PostgREST max-rows cap matching the published limit maximum
    - Rate limits for verified identity and IP; auth token endpoints also limited by token/IP
    - Request-body and query size caps; bounded arrays and strings
    - Whitelisted flat projections and ordering; no arbitrary nested resource embeddings
    - Atomic, bounded writes with consistent lock order; no service-role key in SPA
  default_page_size: 20
  max_page_size: 1000
x-supabase-auth-integration:
  provider: Supabase Auth
  client_sdk: "@supabase/supabase-js"
  ownership: >-
    Supabase-managed /auth/v1/* endpoints are consumed through the SDK; not duplicated as
    application operations.
  email_password:
    sdk_method: auth.signInWithPassword
    signup_policy: Admin or authorized Department Staff/Head provisioned accounts only; no public self-registration.
    password_policy:
      min_length: 12
      max_length: 128
      require_uppercase: true
      require_lowercase: true
      require_number: true
      disallow_reuse_of_current_password: true
      description: >-
        All password setup (`POST /functions/v1/auth/verify-invite`), password recovery, and
        authenticated password changes (`supabase.auth.updateUser({ password })`) must enforce 12 to
        128 characters with at least one uppercase letter, one lowercase letter, and one digit, and
        must reject reusing the current password on change.
    change_password:
      verify_current_password_method: auth.updateUser.current_password
      update_password_method: auth.updateUser
      sign_out_other_devices_method: "auth.signOut({ scope: 'others' })"
      audit_event: password_changed
      description: >-
        Enable the Supabase Auth current-password requirement. Authenticated Change Password routes
        enforce the 12–128 character complexity and non-reuse policy and call `auth.updateUser`
        with both `current_password` and `password`, without replacing the current session. Revoke
        other sessions via `auth.signOut({ scope: 'others' })` and emit a server-side
        `password_changed` audit entry without recording password material. Revoked sessions' access
        JWTs may remain usable until expiry unless protected requests also check session validity.
  google_oauth:
    sdk_method: auth.signInWithOAuth
    provider: google
    flow_type: pkce
    callback_route: /auth/callback
    callback_handling: >-
      Configure flowType=pkce explicitly. Exchange the returned code using
      auth.exchangeCodeForSession (or configured SDK URL detection), exactly once; do not run both.
      No browser client secret. Provider and redirect allowlist setup is future work.
    provider_callback: >-
      https://<project-ref>.supabase.co/auth/v1/callback (registered with Google); distinct from the
      SPA redirect target.
    email_policy: >-
      Verified Google email must be an institutional `@vsu.edu.ph` address that exactly matches a
      pre-provisioned `Profile` row (`status: invited` or `active`); enforce eligibility/linking
      server-side, including already-existing identities.
  audit_events:
    sign_in_succeeded: >-
      Recorded server-side by the Supabase Auth post-authentication hook / session bootstrap
      whenever a user completes password or Google OAuth sign-in.
    login_rejected: >-
      Recorded server-side by the Supabase Auth `before-user-created` / sign-in rejection hook
      when an unprovisioned email, non-`@vsu.edu.ph` domain, or disabled account attempts sign-in.
    password_changed: >-
      Recorded server-side when an authenticated user updates their password via `auth.updateUser`
      or completes password recovery.
  sessions:
    owner: Supabase SDK
    refresh: >-
      Use the current refreshed user access token per application request; never cache one JWT
      forever.
    state: >-
      Use auth.onAuthStateChange for browser session updates; server independently
      authenticates/authorizes.
    logout: auth.signOut
    password_recovery: >-
      auth.resetPasswordForEmail and auth.updateUser after a valid recovery session; not custom
      application endpoints.
  headers:
    apikey: Public project publishable key (legacy anon key where supported).
    Authorization: Bearer <current Supabase user access_token> for protected application operations only.
  authorization:
    identity: >-
      Verified Supabase JWT subject maps to the provisioned profile ID; never trust client-supplied
      email/role or user-editable user_metadata.
    active_account: >-
      Require active provisioned profile on protected requests, including existing users after
      role/status changes.
    creation_hook: >-
      A before-user-created hook can restrict new identity creation; it does not govern subsequent
      logins or replace account-status/RLS checks.
    organization: >-
      Application role and current/historical assignment remain server-enforced separately from
      PostgreSQL authenticated role.
  deployment_boundary: >-
    Specification only: no Supabase project/provider/hook/grant/Edge Function configuration or
    implementation is changed.
