openapi: 3.1.0
info:
  title: Student Academic Advising Information System (SAAIS) API
  version: 0.1.0
  description: >
    Official OpenAPI 3.1 contract and single source of truth for the SAAIS application.
    Covers PostgREST data endpoints and Supabase Edge Function operations for authentication,
    user profiles, and the academic catalog.
  license:
    name: Proprietary
    url: https://github.com/csci153-saais-2026/saais-web/blob/main/LICENSE.md
servers:
  - url: http://127.0.0.1:54321
    description: Local Supabase Development

tags:
  - name: System
    description: System health and diagnostic endpoints
  - name: Auth
    description: User authentication, invitation provisioning, and password setup
  - name: Profile
    description: User profiles and institutional role accounts
  - name: Faculty & Department
    description: Academic divisions (Faculties/Colleges) and subordinate academic departments
  - name: Program & Curriculum
    description: Degree programs, versioned curricula, positional terms, and checklist slots
  - name: Course Catalog
    description: Master course catalog and prerequisite linkages
  - name: Terms & Offerings
    description: Calendar school terms, term locks, and course offerings

x-tagGroups:
  - name: General
    tags:
      - System
      - Auth
      - Profile
  - name: Academic Catalog
    tags:
      - Faculty & Department
      - Program & Curriculum
      - Course Catalog
      - Terms & Offerings

paths:
  /rest/v1/health:
    get:
      tags:
        - System
      summary: Health check probe
      operationId: getHealthStatus
      description: Returns health status of the PostgREST / Supabase layer.
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "500":
          $ref: "#/components/responses/500InternalError"

  /functions/v1/auth/invite:
    post:
      tags:
        - Auth
      summary: Send account invitation
      operationId: inviteUser
      description: >
        Admin operation to provision a pre-registered profile and send an email invitation token
        for password creation. Required role: admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "200":
          description: Invitation successfully sent and profile provisioned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"

  /functions/v1/auth/verify-invite:
    post:
      tags:
        - Auth
      summary: Verify invitation token and set initial password
      operationId: verifyInviteToken
      description: >
        Redeems an invitation token provided via email link to set the user's initial password and
        activate the user profile. Publicly callable with valid token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyInviteRequest"
      responses:
        "200":
          description: Token verified and account activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyInviteResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "404":
          $ref: "#/components/responses/404NotFound"
        "500":
          $ref: "#/components/responses/500InternalError"

  /rest/v1/profile:
    get:
      tags:
        - Profile
      summary: Query user profiles
      operationId: listProfiles
      description: >
        List or filter user profiles via PostgREST query parameters. Students can only select their own
        profile via RLS. Advisers can select assigned advisees. Admins have system-wide visibility.
      parameters:
        - $ref: "#/components/parameters/idQueryParam"
        - $ref: "#/components/parameters/emailQueryParam"
        - $ref: "#/components/parameters/roleQueryParam"
        - $ref: "#/components/parameters/statusQueryParam"
        - $ref: "#/components/parameters/departmentIdQueryParam"
        - $ref: "#/components/parameters/studentNumberQueryParam"
        - $ref: "#/components/parameters/selectQueryParam"
        - $ref: "#/components/parameters/orderQueryParam"
        - $ref: "#/components/parameters/limitQueryParam"
        - $ref: "#/components/parameters/offsetQueryParam"
      responses:
        "200":
          description: Array of matching profile records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "500":
          $ref: "#/components/responses/500InternalError"
    post:
      tags:
        - Profile
      summary: Create user profile
      operationId: createProfile
      description: >
        Directly provision a new profile record. Used by admins for manual account setup and batch CSV imports.
        Required role: admin.
      parameters:
        - $ref: "#/components/parameters/preferHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInsert"
      responses:
        "201":
          description: Profile successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "409":
          $ref: "#/components/responses/409Conflict"
        "500":
          $ref: "#/components/responses/500InternalError"
    patch:
      tags:
        - Profile
      summary: Update user profile
      operationId: updateProfile
      description: >
        Update an existing profile record identified by query filter (e.g. `id=eq.{uuid}`).
        Students can update limited contact info; Admins can update roles, statuses, and department affiliations.
      parameters:
        - $ref: "#/components/parameters/idQueryParamRequired"
        - $ref: "#/components/parameters/preferHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Profile successfully updated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
        "204":
          description: Profile successfully updated without returning representation.
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "500":
          $ref: "#/components/responses/500InternalError"

  /rest/v1/faculty:
    get:
      tags:
