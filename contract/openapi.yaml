        previous VSU program (Shiftee) toward an open curriculum slot (FR-CRD-01). In the same
        transaction, reject duplicate live credit for the same student, normalized origin and
        original course code (trimmed, whitespace-collapsed and case-folded), and reject a slot
        already satisfied by direct completion, an elective
        mapping, equivalency or other outside credit. Lock the affected student and decisions to
        prevent concurrent duplicates. Correct an existing credit through audited revocation and
        replacement; never count the same source or slot twice.
