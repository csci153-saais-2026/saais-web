x-saais-invariants:
  roles:
    - student
    - adviser
    - admin
  student_profile: read-only; admin-provisioned
  prerequisite_override: >-
    current adviser replaces the original failed prerequisite final grade with a passing grade and
    reason; no approval queue or enrollment-only bypass
  equivalency: student-specific passed attempt to one destination; no global code-to-code equivalence
  inc: >-
    original INC remains stored; completion <=3 Passed, >3 Failed; first completion allowed in
    locked term until deadline; corrections obey lock
  record_grades: >-
    enroll or fill missing grades only; populated submitted grade rejects entire request even if
    identical
  history: past advisers read-only; server rechecks current assignment at commit
  credit_units: actual source attempt snapshot, never client supplied
  schema_boundary: Schema design is delivered separately; this contract does not deploy it.
x-resource-controls:
  required_at_runtime:
    - Server-enforced PostgREST max-rows cap matching the published limit maximum
    - Rate limits for verified identity and IP; auth token endpoints also limited by token/IP
    - Request-body and query size caps; bounded arrays and strings
    - Whitelisted flat projections and ordering; no arbitrary nested resource embeddings
    - Atomic, bounded writes with consistent lock order; no service-role key in SPA
  default_page_size: 20
  max_page_size: 1000
