post:
  tags:
    - Program & Curriculum
  summary: Create or clone curriculum version
  operationId: createCurriculumVersion
  description: >-
    Department Head, Department Staff, or Admin validated transactional catalog operation.
    Supports creating a blank version or cloning terms and course slots from an existing
    version via clone_from_version_id. Only a Department Head acting within their department
    may clone an existing version; Department Staff and Admin may create a blank version but
    cannot clone without an independently assigned Department Head role. Protect referenced
    history and required last children; lock parents and commit audit with the mutation.
    Raw table writes are not exposed by the frontend contract.
  x-required-roles:
    - department_head
    - department_staff
    - admin
  x-access-scope:
    department_head: department-scoped
    department_staff: department-scoped
    admin: institution-wide
  x-atomic: true
  x-request-validation: >-
    Reject unknown fields; verify JWT and role/ownership at runtime; if clone_from_version_id
    is non-null, require a Department Head assignment covering the source and target department,
    including when the account also has Staff or Admin roles; derive audit actor/time server-side.
  responses:
    "201":
      description: Operation completed atomically.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/CurriculumVersion.yaml"
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "409":
      $ref: "../../components/responses/409Conflict.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/CurriculumVersionInsert.yaml"
