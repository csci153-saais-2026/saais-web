post:
  tags:
    - Advising & Exceptions
  summary: Correct failed prerequisite to passing
  operationId: correctPrerequisiteGrade
  description: >-
    Correct the original ordinary failed prerequisite attempt to a passing final grade with
    reason/revision, no admin approval. Obey the original term lock. Write
    prerequisite.grade_overridden audit atomically, update student-visible grade/GWA and
    downstream clearance. Never create pending approval or dependent-course grade.
  x-department-closure: >-
    A closed encoding state for the affected student’s current department and term blocks grade-changing writes, even if the course is offered by another department
    with 409 until reopened; the global lock and its override remain independently enforced.
  x-required-roles:
    - adviser
  x-access-scope: current-adviser-only
  x-atomic: true
  x-request-validation: >-
    Reject unknown fields; verify JWT and role/ownership at runtime; derive audit actor/time
    server-side.
  responses:
    "200":
      description: Operation completed atomically.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/AttemptResult.yaml"
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "404":
      $ref: "../../components/responses/404NotFound.yaml"
    "409":
      $ref: "../../components/responses/409Conflict.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  parameters:
    - name: student_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: attempt_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/PrerequisiteGradeCorrectionRequest.yaml"
