post:
  tags:
    - Advising & Exceptions
  summary: Submit a student grade flag
  operationId: createGradeFlag
  description: >-
    Student submits an open grade flag on one of their own recorded attempts (FR-FLG-01) with
    issue_type and details, notifying the assigned adviser and writing an audit log entry.
  x-required-roles:
    - student
  x-access-scope: own-records
  x-atomic: true
  x-request-validation: >-
    Reject unknown fields; verify JWT and student ownership at runtime; derive audit actor/time
    server-side.
  responses:
    "201":
      description: Operation completed atomically.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/GradeFlag.yaml"
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "404":
      $ref: "../../components/responses/404NotFound.yaml"
    "409":
      $ref: "../../components/responses/409Conflict.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  parameters:
    - name: student_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/GradeFlagCreateRequest.yaml"
