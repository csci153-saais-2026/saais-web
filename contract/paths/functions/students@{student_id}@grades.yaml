get:
  tags:
    - Advising & Exceptions
  summary: Read newest-first semester grades
  operationId: getTermGrades
  description: >-
    Return terms newest first by academic chronological key. Use effective INC completion
    results and final-only historical term GWA; data-entry time must not reorder academic history.
    Mark a failure superseded by a later graded retake as Repeated and exclude it from cumulative
    GWA while retaining the original grade and term history. Bound total attempt rows and term groups.
  x-required-roles:
    - student
    - adviser
    - department_head
    - department_staff
    - dean
    - admin
  x-access-scope:
    student: own-records
    adviser: current-or-historic-assigned-students-read-only
    department_head: department-scoped-read-only
    department_staff: department-scoped-read-only
    dean: faculty-scoped-read-only
    admin: institution-wide
  x-atomic: false
  x-request-validation: >-
    Reject unknown fields; verify JWT and role/ownership at runtime; derive audit actor/time
    server-side.
  responses:
    "200":
      description: Operation completed atomically.
      content:
        application/json:
          schema:
            type: array
            maxItems: 1000
            items:
              $ref: "../../components/schemas/TermGrades.yaml"
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "404":
      $ref: "../../components/responses/404NotFound.yaml"
    "409":
      $ref: "../../components/responses/409Conflict.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  parameters:
    - name: student_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: "../../components/parameters/limitQueryParam.yaml"
    - $ref: "../../components/parameters/offsetQueryParam.yaml"
