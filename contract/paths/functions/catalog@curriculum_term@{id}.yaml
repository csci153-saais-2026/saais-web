patch:
  tags:
    - Program & Curriculum
  summary: Update curriculum term
  operationId: updateCurriculumTerm
  description: >-
    Department Head, Department Staff, or Admin validated transactional catalog operation to
    update year_level or term_sequence on an unreferenced curriculum term.
  x-required-roles:
    - department_head
    - department_staff
    - admin
  x-access-scope:
    department_head: department-scoped
    department_staff: department-scoped
    admin: institution-wide
  x-atomic: true
  x-request-validation: >-
    Reject unknown fields; verify JWT and role/ownership at runtime; derive audit actor/time
    server-side.
  responses:
    "200":
      description: Operation completed atomically.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/CurriculumTerm.yaml"
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "404":
      $ref: "../../components/responses/404NotFound.yaml"
    "409":
      $ref: "../../components/responses/409Conflict.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/CurriculumTermUpdate.yaml"
delete:
  tags:
    - Program & Curriculum
  summary: Delete unreferenced curriculum term
  operationId: deleteCurriculumTerm
  description: >-
    Department Head, Department Staff, or Admin operation to remove an empty or unreferenced
    curriculum term while preserving at least one term on referenced curriculum versions.
  x-required-roles:
    - department_head
    - department_staff
    - admin
  x-access-scope:
    department_head: department-scoped
    department_staff: department-scoped
    admin: institution-wide
  x-atomic: true
  x-request-validation: >-
    Reject unknown fields; verify JWT and role/ownership at runtime; derive audit actor/time
    server-side.
  responses:
    "204":
      description: Removed unreferenced record. Referenced/history/last-child conflicts are rejected.
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "404":
      $ref: "../../components/responses/404NotFound.yaml"
    "409":
      $ref: "../../components/responses/409Conflict.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
