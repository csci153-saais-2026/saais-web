post:
  tags:
    - Profile
  summary: Preview or commit student directory spreadsheet import
  operationId: importStudentsBatch
  description: >-
    Department Head, Department Staff, or Admin previews or commits a batch of student
    accounts from CSV/TSV/spreadsheet rows (FR-ADM-14), validating student_number format
    YY-N-NNNNN, institutional email uniqueness, matching active curriculum version, and a
    required eligible active initial adviser for every row. Invalid rows are rejected; committing
    a valid row creates its student and initial assignments atomically.
  x-required-roles:
    - department_head
    - department_staff
    - admin
  x-access-scope:
    department_head: department-scoped
    department_staff: department-scoped
    admin: institution-wide
  x-atomic: true
  x-request-validation: >-
    Reject unknown fields; verify JWT and role/ownership at runtime; derive audit actor/time
    server-side.
  responses:
    "200":
      description: Operation completed atomically.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/StudentBatchImportResponse.yaml"
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "409":
      $ref: "../../components/responses/409Conflict.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/StudentBatchImportRequest.yaml"
