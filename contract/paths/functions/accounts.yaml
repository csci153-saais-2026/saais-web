get:
  tags:
    - Profile
  summary: List accounts with organization filters
  operationId: listAccounts
  description: >-
    Combine role, College and Department filters. Student organization derives from
    curriculum/program; staff accounts include multi-role assignments. Department Heads and
    Department Staff read department-scoped accounts; Deans read faculty-scoped accounts;
    Admins have institution-wide access.
  x-required-roles:
    - department_head
    - department_staff
    - dean
    - admin
  x-access-scope:
    department_head: department-scoped-read-only
    department_staff: department-scoped-read-only
    dean: faculty-scoped-read-only
    admin: institution-wide
  x-atomic: false
  x-request-validation: >-
    Reject unknown fields; verify JWT and role/ownership at runtime; derive audit actor/time
    server-side.
  responses:
    "200":
      description: Operation completed atomically.
      content:
        application/json:
          schema:
            type: array
            maxItems: 1000
            items:
              $ref: "../../components/schemas/AccountSummary.yaml"
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "409":
      $ref: "../../components/responses/409Conflict.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  parameters:
    - $ref: "../../components/parameters/limitQueryParam.yaml"
    - $ref: "../../components/parameters/offsetQueryParam.yaml"
    - $ref: "../../components/parameters/searchQuery.yaml"
    - name: role
      in: query
      required: false
      description: Filter account role.
      schema:
        $ref: "../../components/schemas/RoleType.yaml"
    - name: faculty_id
      in: query
      required: false
      description: Derived student College or assigned staff College.
      schema:
        type: string
        format: uuid
    - name: department_id
      in: query
      required: false
      description: Derived student Department or assigned staff Department.
      schema:
        type: string
        format: uuid
