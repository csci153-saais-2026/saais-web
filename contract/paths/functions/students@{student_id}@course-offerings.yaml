get:
  tags:
    - Advising & Exceptions
  summary: Search term offerings for record entry
  operationId: searchStudentCourseOfferings
  description: >-
    Search code/title across actual selected term offerings. Program/curriculum courses first,
    cross-program below; do not restrict to recommended-only courses. Include term/By request
    metadata and derived slot; locked terms remain visible but writes obey lock.
    Search/selection must not silently change grades.
  x-required-roles:
    - adviser
  x-access-scope: current-or-historic-assigned-students-read-only
  x-atomic: false
  x-request-validation: >-
    Reject unknown fields; verify JWT and role/ownership at runtime; derive audit actor/time
    server-side.
  responses:
    "200":
      description: Operation completed atomically.
      content:
        application/json:
          schema:
            type: array
            maxItems: 1000
            items:
              $ref: "../../components/schemas/CourseOfferingOption.yaml"
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "404":
      $ref: "../../components/responses/404NotFound.yaml"
    "409":
      $ref: "../../components/responses/409Conflict.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  parameters:
    - name: student_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: "../../components/parameters/schoolTermQuery.yaml"
    - $ref: "../../components/parameters/searchQuery.yaml"
    - $ref: "../../components/parameters/limitQueryParam.yaml"
    - $ref: "../../components/parameters/offsetQueryParam.yaml"
