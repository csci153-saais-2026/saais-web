delete:
  tags:
    - Advising & Exceptions
  summary: Reject deletion of saved course attempts
  operationId: deleteOpenTermAttempt
  deprecated: true
  description: >-
    Saved course attempts cannot be deleted (FR-ENR-06).
    A request for a saved attempt returns 409 Conflict.
    Unsaved rows are removed locally before submission;
    drops are recorded as DR under FR-GRD-03.
  x-department-closure: >-
    Saved attempts cannot be deleted regardless of department or term encoding state.
  x-required-roles:
    - adviser
  x-access-scope: current-adviser-only
  x-atomic: true
  x-request-validation: >-
    Verify JWT and current adviser assignment; reject deletion of every saved attempt.
  responses:
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "404":
      $ref: "../../components/responses/404NotFound.yaml"
    "409":
      $ref: "../../components/responses/409Conflict.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  parameters:
    - name: student_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: attempt_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
