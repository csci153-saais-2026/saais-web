put:
  tags:
    - Advising & Exceptions
  summary: Change curriculum assignment
  operationId: assignStudentCurriculum
  description: >-
    Department Head or Admin changes a student's curriculum assignment. Match program to
    curriculum; close old/open new on same date with reason and audit. Derived
    Department/College follow program; preserve earlier attempts, decisions and plans, and
    auto-apply matching CurriculumPairEquivalence rules where applicable. Changing a curriculum
    does not itself change the student's adviser assignment; any separate adviser reassignment
    follows the authorized department workflow and preserves zero-gap continuity.
  x-required-roles:
    - department_head
    - admin
  x-access-scope:
    department_head: department-scoped
    admin: institution-wide
  x-atomic: true
  x-request-validation: >-
    Reject unknown fields; verify JWT and role/ownership at runtime; derive audit actor/time
    server-side.
  responses:
    "200":
      description: Operation completed atomically.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/StudentOrganization.yaml"
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "404":
      $ref: "../../components/responses/404NotFound.yaml"
    "409":
      $ref: "../../components/responses/409Conflict.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  parameters:
    - name: student_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/CurriculumAssignmentRequest.yaml"
