patch:
  tags:
    - Profile
  summary: Manage an account
  operationId: updateProfile
  description: >-
    Admin-only update. Students/advisers cannot edit profiles. Validate target-role fields and
    protect historical roles/identity; synchronize any Auth-related changes through privileged
    server logic. A Dean assignment may exist alone or alongside other authorized roles.
  x-required-roles:
    - admin
  x-access-scope: admin-only
  x-atomic: true
  x-request-validation: >-
    Reject unknown fields; verify JWT and role/ownership at runtime; derive audit actor/time
    server-side.
  responses:
    "200":
      description: Operation completed atomically.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/Profile.yaml"
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "404":
      $ref: "../../components/responses/404NotFound.yaml"
    "409":
      $ref: "../../components/responses/409Conflict.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  parameters:
    - name: profile_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/AdminProfileUpdate.yaml"
