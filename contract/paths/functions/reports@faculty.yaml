get:
  tags:
    - Reports & Analytics
  summary: Read faculty-wide Dean analytics and cross-department comparison
  operationId: getFacultyReport
  description: >-
    Retrieve faculty-wide KPIs, cross-department comparison table, standing distribution, and
    faculty-wide at-risk student list for the Dean and Admin views (FR-RPT-01).
  x-required-roles:
    - dean
    - admin
  x-access-scope:
    dean: faculty-scoped-read-only
    admin: institution-wide
  x-atomic: false
  x-request-validation: >-
    Verify JWT and faculty scope at runtime.
  responses:
    "200":
      description: Faculty-wide Dean analytics report.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/FacultyReport.yaml"
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  parameters:
    - name: faculty_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - name: department_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    - name: school_term_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
