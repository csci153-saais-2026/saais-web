post:
  tags:
    - Advising & Exceptions
  summary: Append internal course or slot remark
  operationId: addAttemptRemark
  description: >-
    Validate exactly one owned attempt or current/relevant curriculum slot, including an empty
    slot. Staff only, append-only, current adviser or admin; student views exclude remarks.
    Collate by academic term then time.
  x-required-roles:
    - adviser
    - admin
  x-access-scope: current-adviser-or-admin
  x-atomic: true
  x-request-validation: >-
    Reject unknown fields; verify JWT and role/ownership at runtime; derive audit actor/time
    server-side.
  responses:
    "201":
      description: Operation completed atomically.
      content:
        application/json:
          schema:
            $ref: "../../components/schemas/AttemptRemark.yaml"
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "404":
      $ref: "../../components/responses/404NotFound.yaml"
    "409":
      $ref: "../../components/responses/409Conflict.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  parameters:
    - name: student_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../components/schemas/RemarkRequest.yaml"
