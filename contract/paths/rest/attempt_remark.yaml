get:
  tags:
    - Advising & Exceptions
  summary: Read internal attempt or slot remarks
  operationId: listAttemptRemarks
  description: >-
    Read-only, row-scoped PostgREST collection. Strictly staff-only: students never access
    attempt_remark.
  x-required-roles:
    - adviser
    - department_head
    - admin
  x-access-scope: authorized-staff-only
  parameters:
    - $ref: "../../components/parameters/idQueryParam.yaml"
    - $ref: "../../components/parameters/studentIdQueryParam.yaml"
    - $ref: "../../components/parameters/attemptIdQueryParam.yaml"
    - $ref: "../../components/parameters/curriculumTermCourseIdQueryParam.yaml"
    - name: select
      in: query
      required: false
      description: >-
        Only these flat safe columns. On private-column tables the client must explicitly send
        this projection; PostgREST does not apply OpenAPI defaults.
      schema:
        type: string
        maxLength: 2000
        pattern: >-
          ^(?:id|student_id|authored_by|body_text|created_at|attempt_id|curriculum_term_course_id)(?:,(?:id|student_id|authored_by|body_text|created_at|attempt_id|curriculum_term_course_id))*$
        default: id,student_id,authored_by,body_text,created_at,attempt_id,curriculum_term_course_id
    - name: order
      in: query
      required: false
      description: Stable ordering on published columns only; whitelist and enforce at runtime.
      schema:
        type: string
        maxLength: 1000
        pattern: >-
          ^(?:id|student_id|authored_by|body_text|created_at|attempt_id|curriculum_term_course_id)\.(?:asc|desc)(?:\.nulls(?:first|last))?(?:,(?:id|student_id|authored_by|body_text|created_at|attempt_id|curriculum_term_course_id)\.(?:asc|desc)(?:\.nulls(?:first|last))?)*$
        default: id.asc
    - $ref: "../../components/parameters/limitQueryParam.yaml"
    - $ref: "../../components/parameters/offsetQueryParam.yaml"
  responses:
    "200":
      description: Visible rows; empty array if no visible matches.
      content:
        application/json:
          schema:
            type: array
            maxItems: 1000
            items:
              $ref: "../../components/schemas/AttemptRemark.yaml"
      headers:
        Content-Range:
          description: PostgREST visible item range; total may be * when exact counts are not requested.
          schema:
            type: string
            maxLength: 100
    "206":
      description: Partial visible collection if the gateway reports a partial range.
      content:
        application/json:
          schema:
            type: array
            maxItems: 1000
            items:
              $ref: "../../components/schemas/AttemptRemark.yaml"
      headers:
        Content-Range:
          description: PostgREST visible item range; total may be * when exact counts are not requested.
          schema:
            type: string
            maxLength: 100
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  x-projection-fields:
    - id
    - student_id
    - authored_by
    - body_text
    - created_at
    - attempt_id
    - curriculum_term_course_id
