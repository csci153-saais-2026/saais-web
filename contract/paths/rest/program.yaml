get:
  tags:
    - Program & Curriculum
  summary: Query degree programs
  operationId: listPrograms
  description: >-
    Retrieve degree programs with nominal duration and lifecycle status. Flat columns are
    allowlisted per x-projection-fields; role metadata documents checks, not automatic runtime
    authorization. Inaccessible/missing collection rows return 200 [], while invalid role/column
    requests may return 403.
  x-required-roles:
    - student
    - adviser
    - department_head
    - department_staff
    - dean
    - admin
  parameters:
    - $ref: "../../components/parameters/idQueryParam.yaml"
    - $ref: "../../components/parameters/codeQueryParam.yaml"
    - $ref: "../../components/parameters/nameQueryParam.yaml"
    - name: or
      in: query
      required: false
      description: >-
        Bounded PostgREST free-text search across program code and name (e.g.
        `(code.ilike.%BSCS%,name.ilike.%Computer Science%)`).
      schema:
        type: string
        maxLength: 320
        pattern: ^\(code\.ilike\.%[^\x00-\x1f,()]{1,100}%,name\.ilike\.%[^\x00-\x1f,()]{1,150}%\)$
    - name: status
      in: query
      required: false
      description: Filter this entity’s valid status.
      schema:
        type: string
        maxLength: 40
        pattern: ^eq\.(active|inactive|archived)$
    - name: select
      in: query
      required: false
      description: >-
        Only these flat safe columns. On private-column tables the client must explicitly send
        this projection; PostgREST does not apply OpenAPI defaults.
      schema:
        type: string
        maxLength: 2000
        pattern: >-
          ^(?:id|code|name|nominal_duration|status|department_id)(?:,(?:id|code|name|nominal_duration|status|department_id))*$
        default: id,code,name,nominal_duration,status,department_id
    - name: order
      in: query
      required: false
      description: Stable ordering on published columns only; whitelist and enforce at runtime.
      schema:
        type: string
        maxLength: 1000
        pattern: >-
          ^(?:id|code|name|nominal_duration|status|department_id)\.(?:asc|desc)(?:\.nulls(?:first|last))?(?:,(?:id|code|name|nominal_duration|status|department_id)\.(?:asc|desc)(?:\.nulls(?:first|last))?)*$
        default: id.asc
    - $ref: "../../components/parameters/limitQueryParam.yaml"
    - $ref: "../../components/parameters/offsetQueryParam.yaml"
    - $ref: "../../components/parameters/departmentIdQueryParam.yaml"
  responses:
    "200":
      description: Array of degree programs.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/Program.yaml"
            maxItems: 1000
      headers:
        Content-Range:
          description: PostgREST visible item range; total may be * when exact counts are not requested.
          schema:
            type: string
            maxLength: 100
    "206":
      description: Partial visible collection if the gateway reports a partial range.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/Program.yaml"
            maxItems: 1000
      headers:
        Content-Range:
          description: PostgREST visible item range; total may be * when exact counts are not requested.
          schema:
            type: string
            maxLength: 100
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  x-access-scope:
    student: own-records
    adviser: current-or-historic-assigned-students-read-only
    department_head: department-and-reference-read-only
    department_staff: department-and-reference-read-only
    dean: faculty-and-reference-read-only
    admin: institution-wide
  x-projection-fields:
    - id
    - code
    - name
    - nominal_duration
    - status
    - department_id
