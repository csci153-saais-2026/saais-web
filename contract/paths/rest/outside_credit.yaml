get:
  tags:
    - Advising & Exceptions
  summary: Query outside credits (Transferee / Shiftee)
  operationId: listOutsideCredits
  description: >-
    Read-only PostgREST collection of approved outside/transfer credits (FR-CRD-01).
  x-required-roles:
    - student
    - adviser
    - department_head
    - department_staff
    - dean
    - admin
  x-access-scope:
    student: own-records
    adviser: current-or-historic-assigned-students-read-only
    department_head: department-scoped-read-only
    department_staff: department-scoped-read-only
    dean: faculty-scoped-read-only
    admin: institution-wide
  parameters:
    - $ref: "../../components/parameters/idQueryParam.yaml"
    - $ref: "../../components/parameters/studentIdQueryParam.yaml"
    - $ref: "../../components/parameters/destinationCurriculumTermCourseIdQueryParam.yaml"
    - name: select
      in: query
      required: false
      description: Only these flat safe columns.
      schema:
        type: string
        maxLength: 2000
        pattern: >-
          ^(?:id|student_id|entry_type|origin_school|original_course_code|original_course_title|units|grade|destination_curriculum_term_course_id|units_credited|decided_by|decided_at|revoked_at|updated_at)(?:,(?:id|student_id|entry_type|origin_school|original_course_code|original_course_title|units|grade|destination_curriculum_term_course_id|units_credited|decided_by|decided_at|revoked_at|updated_at))*$
        default: >-
          id,student_id,entry_type,origin_school,original_course_code,original_course_title,units,grade,destination_curriculum_term_course_id,units_credited,decided_by,decided_at,revoked_at,updated_at
    - name: order
      in: query
      required: false
      description: Stable ordering on published columns only.
      schema:
        type: string
        maxLength: 1000
        pattern: >-
          ^(?:id|student_id|entry_type|origin_school|original_course_code|original_course_title|units|grade|destination_curriculum_term_course_id|units_credited|decided_by|decided_at|revoked_at|updated_at)\.(?:asc|desc)(?:\.nulls(?:first|last))?(?:,(?:id|student_id|entry_type|origin_school|original_course_code|original_course_title|units|grade|destination_curriculum_term_course_id|units_credited|decided_by|decided_at|revoked_at|updated_at)\.(?:asc|desc)(?:\.nulls(?:first|last))?)*$
        default: decided_at.desc
    - $ref: "../../components/parameters/limitQueryParam.yaml"
    - $ref: "../../components/parameters/offsetQueryParam.yaml"
  responses:
    "200":
      description: Visible rows; empty array if no visible matches.
      content:
        application/json:
          schema:
            type: array
            maxItems: 1000
            items:
              $ref: "../../components/schemas/OutsideCredit.yaml"
      headers:
        Content-Range:
          description: PostgREST visible item range.
          schema:
            type: string
            maxLength: 100
    "206":
      description: Partial visible collection.
      content:
        application/json:
          schema:
            type: array
            maxItems: 1000
            items:
              $ref: "../../components/schemas/OutsideCredit.yaml"
      headers:
        Content-Range:
          description: PostgREST visible item range.
          schema:
            type: string
            maxLength: 100
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  x-projection-fields:
    - id
    - student_id
    - entry_type
    - origin_school
    - original_course_code
    - original_course_title
    - units
    - grade
    - destination_curriculum_term_course_id
    - units_credited
    - decided_by
    - decided_at
    - revoked_at
    - updated_at
