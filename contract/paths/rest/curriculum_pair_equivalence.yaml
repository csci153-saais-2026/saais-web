get:
  tags:
    - Program & Curriculum
  summary: Query curriculum-pair equivalence rules
  operationId: listCurriculumPairEquivalences
  description: >-
    Read-only PostgREST collection of reusable course equivalence mappings between a source
    CurriculumVersion and a target CurriculumVersion (FR-EQV-08).
  x-required-roles:
    - student
    - adviser
    - department_head
    - department_staff
    - dean
    - admin
  x-access-scope:
    student: own-records
    adviser: current-or-historic-assigned-students-read-only
    department_head: department-scoped-read-only
    department_staff: department-scoped-read-only
    dean: faculty-scoped-read-only
    admin: institution-wide
  parameters:
    - $ref: "../../components/parameters/idQueryParam.yaml"
    - name: from_curriculum_version_id
      in: query
      required: false
      description: Filter by source curriculum version UUID (`eq.UUID`).
      schema:
        type: string
        maxLength: 100
        pattern: ^eq\.[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    - name: to_curriculum_version_id
      in: query
      required: false
      description: Filter by target curriculum version UUID (`eq.UUID`).
      schema:
        type: string
        maxLength: 100
        pattern: ^eq\.[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
    - name: select
      in: query
      required: false
      description: Only these flat safe columns.
      schema:
        type: string
        maxLength: 2000
        pattern: >-
          ^(?:id|from_curriculum_version_id|to_curriculum_version_id|source_course_id|target_course_id|note|created_by|created_at)(?:,(?:id|from_curriculum_version_id|to_curriculum_version_id|source_course_id|target_course_id|note|created_by|created_at))*$
        default: >-
          id,from_curriculum_version_id,to_curriculum_version_id,source_course_id,target_course_id,note,created_by,created_at
    - name: order
      in: query
      required: false
      description: Stable ordering on published columns only.
      schema:
        type: string
        maxLength: 1000
        pattern: >-
          ^(?:id|from_curriculum_version_id|to_curriculum_version_id|source_course_id|target_course_id|note|created_by|created_at)\.(?:asc|desc)(?:\.nulls(?:first|last))?(?:,(?:id|from_curriculum_version_id|to_curriculum_version_id|source_course_id|target_course_id|note|created_by|created_at)\.(?:asc|desc)(?:\.nulls(?:first|last))?)*$
        default: id.asc
    - $ref: "../../components/parameters/limitQueryParam.yaml"
    - $ref: "../../components/parameters/offsetQueryParam.yaml"
  responses:
    "200":
      description: Visible rows; empty array if no visible matches.
      content:
        application/json:
          schema:
            type: array
            maxItems: 1000
            items:
              $ref: "../../components/schemas/CurriculumPairEquivalence.yaml"
      headers:
        Content-Range:
          description: PostgREST visible item range.
          schema:
            type: string
            maxLength: 100
    "206":
      description: Partial visible collection.
      content:
        application/json:
          schema:
            type: array
            maxItems: 1000
            items:
              $ref: "../../components/schemas/CurriculumPairEquivalence.yaml"
      headers:
        Content-Range:
          description: PostgREST visible item range.
          schema:
            type: string
            maxLength: 100
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  x-projection-fields:
    - id
    - from_curriculum_version_id
    - to_curriculum_version_id
    - source_course_id
    - target_course_id
    - note
    - created_by
    - created_at
