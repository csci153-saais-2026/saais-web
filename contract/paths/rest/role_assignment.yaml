get:
  tags:
    - Profile
  summary: Query multi-role assignments
  operationId: listRoleAssignments
  description: >-
    Retrieve institutional role assignments (including faculty/department scope) for user
    profiles. Enables multi-role authorization (e.g., Dean + Department Head, Adviser +
    Department Head) under a single login session.
  x-required-roles:
    - student
    - adviser
    - department_head
    - department_staff
    - dean
    - admin
  parameters:
    - $ref: "../../components/parameters/idQueryParam.yaml"
    - $ref: "../../components/parameters/profileIdQueryParam.yaml"
    - $ref: "../../components/parameters/roleQueryParam.yaml"
    - $ref: "../../components/parameters/facultyIdQueryParam.yaml"
    - $ref: "../../components/parameters/departmentIdQueryParam.yaml"
    - name: select
      in: query
      required: false
      description: >-
        Only these flat safe columns.
      schema:
        type: string
        maxLength: 2000
        pattern: >-
          ^(?:id|profile_id|role|faculty_id|department_id|created_at)(?:,(?:id|profile_id|role|faculty_id|department_id|created_at))*$
        default: id,profile_id,role,faculty_id,department_id,created_at
    - name: order
      in: query
      required: false
      description: Stable ordering on published columns only; whitelist and enforce at runtime.
      schema:
        type: string
        maxLength: 1000
        pattern: >-
          ^(?:id|profile_id|role|faculty_id|department_id|created_at)\.(?:asc|desc)(?:\.nulls(?:first|last))?(?:,(?:id|profile_id|role|faculty_id|department_id|created_at)\.(?:asc|desc)(?:\.nulls(?:first|last))?)*$
        default: id.asc
    - $ref: "../../components/parameters/limitQueryParam.yaml"
    - $ref: "../../components/parameters/offsetQueryParam.yaml"
  responses:
    "200":
      description: Array of role assignments.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/RoleAssignment.yaml"
            maxItems: 1000
      headers:
        Content-Range:
          description: PostgREST visible item range; total may be * when exact counts are not requested.
          schema:
            type: string
            maxLength: 100
    "206":
      description: Partial visible collection if the gateway reports a partial range.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/RoleAssignment.yaml"
            maxItems: 1000
      headers:
        Content-Range:
          description: PostgREST visible item range; total may be * when exact counts are not requested.
          schema:
            type: string
            maxLength: 100
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  x-access-scope:
    student: own-records
    adviser: own-and-assigned-students-read-only
    department_head: department-scoped-read-only
    department_staff: department-scoped-read-only
    dean: faculty-scoped-read-only
    admin: institution-wide
  x-projection-fields:
    - id
    - profile_id
    - role
    - faculty_id
    - department_id
    - created_at
