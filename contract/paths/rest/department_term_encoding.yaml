get:
  tags:
    - Terms & Offerings
  summary: Query department-scoped grade encoding closure state per school term
  operationId: listDepartmentTermEncodings
  description: >-
    Retrieve per-department grade-encoding closure records for calendar school terms. Allows
    Department Heads and Department Staff to close grade encoding for their own department
    without locking other departments, while global SchoolTerm.is_locked remains Admin-only.
  x-required-roles:
    - student
    - adviser
    - department_head
    - department_staff
    - dean
    - admin
  parameters:
    - $ref: "../../components/parameters/idQueryParam.yaml"
    - $ref: "../../components/parameters/schoolTermIdQueryParam.yaml"
    - $ref: "../../components/parameters/departmentIdQueryParam.yaml"
    - name: is_closed
      in: query
      required: false
      description: Filter by department closure state (`eq.true` or `eq.false`).
      schema:
        type: string
        maxLength: 20
        pattern: ^eq\.(true|false)$
    - name: select
      in: query
      required: false
      description: Only these flat safe columns.
      schema:
        type: string
        maxLength: 2000
        pattern: >-
          ^(?:id|school_term_id|department_id|is_closed|closed_by|closed_by_name|closed_at|closure_note|updated_at)(?:,(?:id|school_term_id|department_id|is_closed|closed_by|closed_by_name|closed_at|closure_note|updated_at))*$
        default: >-
          id,school_term_id,department_id,is_closed,closed_by,closed_by_name,closed_at,closure_note,updated_at
    - name: order
      in: query
      required: false
      description: Stable ordering on published columns only.
      schema:
        type: string
        maxLength: 1000
        pattern: >-
          ^(?:id|school_term_id|department_id|is_closed|closed_by|closed_by_name|closed_at|closure_note|updated_at)\.(?:asc|desc)(?:\.nulls(?:first|last))?(?:,(?:id|school_term_id|department_id|is_closed|closed_by|closed_by_name|closed_at|closure_note|updated_at)\.(?:asc|desc)(?:\.nulls(?:first|last))?)*$
        default: id.asc
    - $ref: "../../components/parameters/limitQueryParam.yaml"
    - $ref: "../../components/parameters/offsetQueryParam.yaml"
  responses:
    "200":
      description: Array of department term encoding closure states.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/DepartmentTermEncodingClosure.yaml"
            maxItems: 1000
      headers:
        Content-Range:
          description: PostgREST visible item range.
          schema:
            type: string
            maxLength: 100
    "206":
      description: Partial visible collection.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/DepartmentTermEncodingClosure.yaml"
            maxItems: 1000
      headers:
        Content-Range:
          description: PostgREST visible item range.
          schema:
            type: string
            maxLength: 100
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  x-access-scope:
    student: own-records
    adviser: current-or-historic-assigned-students-read-only
    department_head: department-and-reference-read-only
    department_staff: department-and-reference-read-only
    dean: faculty-and-reference-read-only
    admin: institution-wide
  x-projection-fields:
    - id
    - school_term_id
    - department_id
    - is_closed
    - closed_by
    - closed_by_name
    - closed_at
    - closure_note
    - updated_at
