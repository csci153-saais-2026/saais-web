get:
  tags:
    - Course Catalog
  summary: Query master course catalog
  operationId: listCourses
  description: >-
    Retrieve catalog courses with credit units, lecture/lab hours, elective eligibility,
    category classification. Flat columns are allowlisted per
    x-projection-fields; role metadata documents checks, not automatic runtime authorization.
    Inaccessible/missing collection rows return 200 [], while invalid role/column requests may
    return 403.
  x-required-roles:
    - student
    - adviser
    - department_head
    - department_staff
    - dean
    - admin
  parameters:
    - $ref: "../../components/parameters/idQueryParam.yaml"
    - $ref: "../../components/parameters/departmentIdQueryParam.yaml"
    - $ref: "../../components/parameters/codeQueryParam.yaml"
    - name: title
      in: query
      required: false
      description: Filter course title by equality or case-insensitive pattern (`eq.`, `ilike.`, `like.`).
      schema:
        type: string
        maxLength: 256
        pattern: ^(?:eq|ilike|like)\.[^\x00-\x1f]{1,250}$
    - name: category
      in: query
      required: false
      description: Filter course category (`eq.major`, `eq.ge`, `eq.elective`, `eq.pe`, `eq.nstp`, etc.).
      schema:
        type: string
        maxLength: 40
        pattern: ^eq\.(major|ge|elective|pe|nstp|foundation|service|Major|GE|Elective|NSTP|PE|Thesis|Internship|Other)$
    - name: or
      in: query
      required: false
      description: >-
        Bounded PostgREST free-text search across course code and title (e.g.
        `(code.ilike.%CS 101%,title.ilike.%Introduction%)`).
      schema:
        type: string
        maxLength: 420
        pattern: ^\(code\.ilike\.%[^\x00-\x1f,()]{1,100}%,title\.ilike\.%[^\x00-\x1f,()]{1,250}%\)$
    - name: status
      in: query
      required: false
      description: Filter this entity’s valid status.
      schema:
        type: string
        maxLength: 40
        pattern: ^eq\.(active|inactive|discontinued)$
    - name: select
      in: query
      required: false
      description: >-
        Only these flat safe columns. On private-column tables the client must explicitly send
        this projection; PostgREST does not apply OpenAPI defaults.
      schema:
        type: string
        maxLength: 2000
        pattern: >-
          ^(?:id|department_id|code|title|units|status|repeatable_type|is_elective|category)(?:,(?:id|department_id|code|title|units|status|repeatable_type|is_elective|category))*$
        default: id,department_id,code,title,units,status,repeatable_type,is_elective,category
    - name: order
      in: query
      required: false
      description: Stable ordering on published columns only; whitelist and enforce at runtime.
      schema:
        type: string
        maxLength: 1000
        pattern: >-
          ^(?:id|department_id|code|title|units|status|repeatable_type|is_elective|category)\.(?:asc|desc)(?:\.nulls(?:first|last))?(?:,(?:id|department_id|code|title|units|status|repeatable_type|is_elective|category)\.(?:asc|desc)(?:\.nulls(?:first|last))?)*$
        default: id.asc
    - $ref: "../../components/parameters/limitQueryParam.yaml"
    - $ref: "../../components/parameters/offsetQueryParam.yaml"
  responses:
    "200":
      description: Array of courses.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/Course.yaml"
            maxItems: 1000
      headers:
        Content-Range:
          description: PostgREST visible item range; total may be * when exact counts are not requested.
          schema:
            type: string
            maxLength: 100
    "206":
      description: Partial visible collection if the gateway reports a partial range.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/Course.yaml"
            maxItems: 1000
      headers:
        Content-Range:
          description: PostgREST visible item range; total may be * when exact counts are not requested.
          schema:
            type: string
            maxLength: 100
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  x-access-scope:
    student: own-records
    adviser: current-or-historic-assigned-students-read-only
    department_head: institution-reference-read-only
    department_staff: institution-reference-read-only
    dean: institution-reference-read-only
    admin: institution-wide
  x-projection-fields:
    - id
    - department_id
    - code
    - title
    - units
    - status
    - repeatable_type
    - is_elective
    - category
