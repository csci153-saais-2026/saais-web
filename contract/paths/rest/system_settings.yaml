get:
  tags:
    - Notifications & Settings
  summary: Read system academic standing thresholds and backup metadata
  operationId: getSystemSettings
  description: >-
    Read-only PostgREST projection of system/department academic standing delinquency
    thresholds (warning_pct, probation_pct, dismissal_pct), sender_email, and last_backup_at
    metadata (FR-SET-01).
  x-required-roles:
    - adviser
    - department_head
    - dean
    - admin
  x-access-scope:
    adviser: reference-read-only
    department_head: department-scoped-read-only
    dean: faculty-scoped-read-only
    admin: institution-wide
  parameters:
    - $ref: "../../components/parameters/idQueryParam.yaml"
    - $ref: "../../components/parameters/departmentIdQueryParam.yaml"
    - name: select
      in: query
      required: false
      description: Only these flat safe columns.
      schema:
        type: string
        maxLength: 2000
        pattern: >-
          ^(?:id|department_id|warning_pct|probation_pct|dismissal_pct|sender_email|last_backup_at|last_backup_by|last_backup_reference|last_backup_location|last_backup_scope|updated_at)(?:,(?:id|department_id|warning_pct|probation_pct|dismissal_pct|sender_email|last_backup_at|last_backup_by|last_backup_reference|last_backup_location|last_backup_scope|updated_at))*$
        default: >-
          id,department_id,warning_pct,probation_pct,dismissal_pct,sender_email,last_backup_at,last_backup_by,last_backup_reference,last_backup_location,last_backup_scope,updated_at
    - name: order
      in: query
      required: false
      description: Stable ordering on published columns only.
      schema:
        type: string
        maxLength: 1000
        pattern: >-
          ^(?:id|department_id|warning_pct|probation_pct|dismissal_pct|sender_email|last_backup_at|last_backup_by|last_backup_reference|last_backup_location|last_backup_scope|updated_at)\.(?:asc|desc)(?:\.nulls(?:first|last))?(?:,(?:id|department_id|warning_pct|probation_pct|dismissal_pct|sender_email|last_backup_at|last_backup_by|last_backup_reference|last_backup_location|last_backup_scope|updated_at)\.(?:asc|desc)(?:\.nulls(?:first|last))?)*$
        default: id.asc
    - $ref: "../../components/parameters/limitQueryParam.yaml"
    - $ref: "../../components/parameters/offsetQueryParam.yaml"
  responses:
    "200":
      description: Visible rows; empty array if no visible matches.
      content:
        application/json:
          schema:
            type: array
            maxItems: 1000
            items:
              $ref: "../../components/schemas/SystemSettings.yaml"
      headers:
        Content-Range:
          description: PostgREST visible item range.
          schema:
            type: string
            maxLength: 100
    "206":
      description: Partial visible collection.
      content:
        application/json:
          schema:
            type: array
            maxItems: 1000
            items:
              $ref: "../../components/schemas/SystemSettings.yaml"
      headers:
        Content-Range:
          description: PostgREST visible item range.
          schema:
            type: string
            maxLength: 100
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  x-projection-fields:
    - id
    - department_id
    - warning_pct
    - probation_pct
    - dismissal_pct
    - sender_email
    - last_backup_at
    - last_backup_by
    - last_backup_reference
    - last_backup_location
    - last_backup_scope
    - updated_at
