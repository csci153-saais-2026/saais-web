get:
  tags:
    - Advising & Exceptions
  summary: Read advising notes
  operationId: listAdvisingNotes
  description: >-
    Read-only, row-scoped PostgREST collection. Students read their own active and archived
    advising notes on their Notes tab, while advisers,
    Department Heads, and Admins view active and archived notes within their scope.
  x-required-roles:
    - student
    - adviser
    - department_head
    - admin
  x-access-scope:
    student: own-notes-including-archived-read-only
    adviser: current-or-historic-assigned-students-read-only
    department_head: department-scoped-read-only
    admin: institution-wide
  parameters:
    - $ref: "../../components/parameters/idQueryParam.yaml"
    - $ref: "../../components/parameters/studentIdQueryParam.yaml"
    - $ref: "../../components/parameters/isArchivedQueryParam.yaml"
    - name: select
      in: query
      required: false
      description: >-
        Only these flat safe columns. On private-column tables the client must explicitly send
        this projection; PostgREST does not apply OpenAPI defaults.
      schema:
        type: string
        maxLength: 2000
        pattern: >-
          ^(?:id|student_id|authored_by|author_name|author_role_label|body_text|is_archived|archived_at|archived_by|created_at)(?:,(?:id|student_id|authored_by|author_name|author_role_label|body_text|is_archived|archived_at|archived_by|created_at))*$
        default: id,student_id,authored_by,author_name,author_role_label,body_text,is_archived,archived_at,archived_by,created_at
    - name: order
      in: query
      required: false
      description: Stable ordering on published columns only; whitelist and enforce at runtime.
      schema:
        type: string
        maxLength: 1000
        pattern: >-
          ^(?:id|student_id|authored_by|author_name|author_role_label|body_text|is_archived|archived_at|archived_by|created_at)\.(?:asc|desc)(?:\.nulls(?:first|last))?(?:,(?:id|student_id|authored_by|author_name|author_role_label|body_text|is_archived|archived_at|archived_by|created_at)\.(?:asc|desc)(?:\.nulls(?:first|last))?)*$
        default: created_at.desc,id.desc
    - $ref: "../../components/parameters/limitQueryParam.yaml"
    - $ref: "../../components/parameters/offsetQueryParam.yaml"
  responses:
    "200":
      description: Visible rows; empty array if no visible matches.
      content:
        application/json:
          schema:
            type: array
            maxItems: 1000
            items:
              $ref: "../../components/schemas/AdvisingNote.yaml"
      headers:
        Content-Range:
          description: PostgREST visible item range; total may be * when exact counts are not requested.
          schema:
            type: string
            maxLength: 100
    "206":
      description: Partial visible collection if the gateway reports a partial range.
      content:
        application/json:
          schema:
            type: array
            maxItems: 1000
            items:
              $ref: "../../components/schemas/AdvisingNote.yaml"
      headers:
        Content-Range:
          description: PostgREST visible item range; total may be * when exact counts are not requested.
          schema:
            type: string
            maxLength: 100
    "400":
      $ref: "../../components/responses/400BadRequest.yaml"
    "401":
      $ref: "../../components/responses/401Unauthorized.yaml"
    "403":
      $ref: "../../components/responses/403Forbidden.yaml"
    "429":
      $ref: "../../components/responses/429TooManyRequests.yaml"
    "500":
      $ref: "../../components/responses/500InternalError.yaml"
  x-projection-fields:
    - id
    - student_id
    - authored_by
    - author_name
    - author_role_label
    - body_text
    - is_archived
    - archived_at
    - archived_by
    - created_at
