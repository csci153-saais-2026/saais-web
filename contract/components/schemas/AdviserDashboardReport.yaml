type: object
additionalProperties: false
properties:
  adviser_id:
    type: string
    format: uuid
  total_advisees:
    type: integer
    minimum: 0
  standing_counts:
    $ref: "./StandingCounts.yaml"
  open_grade_flags_count:
    type: integer
    minimum: 0
  pending_inc_count:
    type: integer
    minimum: 0
  expiring_inc_soon_count:
    type: integer
    minimum: 0
  lapsed_inc_count:
    type: integer
    minimum: 0
  mean_gwa:
    type:
      - number
      - "null"
    minimum: 1
    maximum: 5
  year_level_counts:
    type: array
    maxItems: 8
    items:
      type: object
      additionalProperties: false
      properties:
        year_level:
          type: integer
          minimum: 1
          maximum: 8
        student_count:
          type: integer
          minimum: 0
      required:
        - year_level
        - student_count
  grade_distribution:
    $ref: "./GradeDistributionBreakdown.yaml"
  batch_curriculum_gwa:
    type: array
    maxItems: 500
    items:
      $ref: "./BatchCurriculumGwaRow.yaml"
    description: >-
      Mean GWA and standing breakdown by advisee entry batch and curriculum version for the
      Adviser Reports view.
  advisees_with_deficiencies:
    type: array
    maxItems: 500
    items:
      $ref: "./DeficiencyStudentSummary.yaml"
  computed_at:
    type: string
    format: date-time
required:
  - adviser_id
  - total_advisees
  - standing_counts
  - open_grade_flags_count
  - pending_inc_count
  - computed_at
