type: object
additionalProperties: false
required:
  - success
  - message
  - profile_id
  - invitation_status
  - invitation_sent_at
  - invitation_expires_at
properties:
  success:
    type: boolean
    example: true
  message:
    type: string
    example: Invitation regenerated and dispatched.
  profile_id:
    type: string
    format: uuid
  invitation_status:
    $ref: "./InvitationStatus.yaml"
  invitation_sent_at:
    type: string
    format: date-time
  invitation_expires_at:
    type: string
    format: date-time
