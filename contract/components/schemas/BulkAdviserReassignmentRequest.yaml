type: object
additionalProperties: false
properties:
  student_ids:
    type: array
    minItems: 1
    maxItems: 500
    uniqueItems: true
    items:
      type: string
      format: uuid
  adviser_id:
    type: string
    format: uuid
  effective_since:
    type: string
    format: date
  reason:
    type: string
    minLength: 1
    maxLength: 2000
    pattern: \S
required:
  - student_ids
  - adviser_id
  - effective_since
  - reason
