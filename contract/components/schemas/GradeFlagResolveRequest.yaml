type: object
additionalProperties: false
properties:
  resolution_action:
    type: string
    enum:
      - correct
      - reject
  corrected_grade:
    anyOf:
      - type: number
        minimum: 1
        maximum: 3
        multipleOf: 0.25
      - type: number
        const: 5
      - type: "null"
  corrected_status:
    anyOf:
      - $ref: "./AttemptStatus.yaml"
      - type: "null"
  corrected_midterm_status:
    anyOf:
      - $ref: "./MidtermStatus.yaml"
      - type: "null"
  resolution_note:
    type: string
    minLength: 1
    maxLength: 2000
    pattern: \S
  expected_revision:
    type:
      - integer
      - "null"
    minimum: 0
required:
  - resolution_action
  - resolution_note
