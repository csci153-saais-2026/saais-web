type: object
additionalProperties: false
properties:
  resolution_action:
    type: string
    enum:
      - correct
      - reject
  corrected_grade:
    anyOf:
      - type: number
        minimum: 1
        maximum: 5
        multipleOf: 0.25
      - type: "null"
    description: >-
      The server uses the flag's stored reported_stage. Midterm corrections accept
      1.00 through 5.00 in quarter steps. Final corrections and flags with no stage
      accept 1.00 through 3.00 in quarter steps or 5.00.
  corrected_status:
    anyOf:
      - $ref: "./AttemptStatus.yaml"
      - type: "null"
  corrected_midterm_status:
    anyOf:
      - $ref: "./MidtermStatus.yaml"
      - type: "null"
  resolution_note:
    type: string
    minLength: 1
    maxLength: 2000
    pattern: \S
  expected_revision:
    type:
      - integer
      - "null"
    minimum: 0
required:
  - resolution_action
  - resolution_note
