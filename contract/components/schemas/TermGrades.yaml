type: object
additionalProperties: false
properties:
  school_term_id:
    type: string
    format: uuid
  school_year:
    type: string
    minLength: 1
    maxLength: 20
    pattern: \S
  term_type:
    $ref: "./SchoolTermType.yaml"
  chronological_key:
    type: integer
    readOnly: true
  gwa:
    type:
      - number
      - "null"
    minimum: 1
    maximum: 5
  attempts:
    type: array
    maxItems: 1000
    items:
      $ref: "./AttemptResult.yaml"
required:
  - school_term_id
  - school_year
  - term_type
  - chronological_key
  - gwa
  - attempts
