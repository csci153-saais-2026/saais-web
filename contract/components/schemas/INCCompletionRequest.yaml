type: object
additionalProperties: false
properties:
  completion_grade:
    anyOf:
      - type: number
        minimum: 1
        maximum: 3
        multipleOf: 0.25
      - type: number
        const: 5
  reason:
    type: string
    minLength: 1
    maxLength: 2000
    pattern: \S
required:
  - completion_grade
  - reason
