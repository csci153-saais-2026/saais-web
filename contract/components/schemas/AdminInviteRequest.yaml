type: object
additionalProperties: false
not:
  required: [role_assignments]
  properties:
    role_assignments:
      contains:
        required: [role]
        properties:
          role:
            const: student
properties:
  email:
    type: string
    format: email
    maxLength: 254
  full_name:
    type: string
    minLength: 1
    maxLength: 150
    pattern: \S
  role:
    type: string
    const: admin
  role_assignments:
    type: array
    minItems: 1
    maxItems: 6
    items:
      $ref: "./RoleAssignmentInput.yaml"
required:
  - email
  - full_name
  - role
