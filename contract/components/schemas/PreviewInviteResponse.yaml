type: object
additionalProperties: false
required:
  - valid
  - status
  - email
  - full_name
  - role
  - roles
  - expires_at
properties:
  valid:
    type: boolean
    description: True when the invitation is still pending and unredeemed/unexpired.
  status:
    $ref: "./InvitationStatus.yaml"
  email:
    type: string
    format: email
    description: Invited institutional email address (`@vsu.edu.ph`).
  full_name:
    type: string
    maxLength: 150
  role:
    $ref: "./RoleType.yaml"
  roles:
    type: array
    minItems: 1
    maxItems: 6
    uniqueItems: true
    items:
      $ref: "./RoleType.yaml"
  faculty_name:
    type:
      - string
      - "null"
    maxLength: 250
    description: Display name of the invited account's assigned or derived College/Faculty.
  department_name:
    type:
      - string
      - "null"
    maxLength: 250
    description: Display name of the invited account's assigned or derived Department.
  program_code:
    type:
      - string
      - "null"
    maxLength: 100
    description: Student degree program code when the invitation is for a student.
  expires_at:
    type: string
    format: date-time
    description: Timestamp when the invitation link expires.
