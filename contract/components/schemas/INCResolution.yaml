type: object
additionalProperties: false
properties:
  id:
    type: string
    format: uuid
    readOnly: true
  student_id:
    type: string
    format: uuid
  attempt_id:
    type: string
    format: uuid
  completion_grade:
    type: number
    minimum: 1
    maximum: 5
    multipleOf: 0.25
  resolved_by:
    type: string
    format: uuid
    readOnly: true
  resolved_at:
    type: string
    format: date-time
    readOnly: true
  updated_by:
    type: string
    format: uuid
    readOnly: true
  updated_at:
    type: string
    format: date-time
    readOnly: true
  effective_status:
    type: string
    enum:
      - passed
      - failed
required:
  - id
  - student_id
  - attempt_id
  - completion_grade
  - resolved_by
  - resolved_at
  - updated_by
  - updated_at
  - effective_status
