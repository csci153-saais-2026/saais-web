type: object
required:
  - curriculum_version_id
  - year_level
  - term_sequence
properties:
  curriculum_version_id:
    type: string
    format: uuid
  year_level:
    type: integer
    minimum: 1
    maximum: 8
  term_sequence:
    type: integer
    minimum: 1
    maximum: 3
  slots:
    type: array
    minItems: 0
    maxItems: 200
    default: []
    items:
      $ref: "./CurriculumSlotDefinition.yaml"
additionalProperties: false
