type: object
additionalProperties: false
properties:
  reference_date:
    type: string
    format: date
  dry_run:
    type: boolean
  evaluated_counts:
    type: object
    additionalProperties: false
    properties:
      inc_deadline_approaching:
        type: integer
        minimum: 0
      inc_lapsed:
        type: integer
        minimum: 0
      standing_threshold_alert:
        type: integer
        minimum: 0
      encoding_deadline_approaching:
        type: integer
        minimum: 0
      unassigned_students_pending:
        type: integer
        minimum: 0
      invitation_expiring_soon:
        type: integer
        minimum: 0
      backup_overdue_reminder:
        type: integer
        minimum: 0
      skipped_duplicates:
        type: integer
        minimum: 0
      total_created:
        type: integer
        minimum: 0
    required:
      - inc_deadline_approaching
      - inc_lapsed
      - standing_threshold_alert
      - encoding_deadline_approaching
      - unassigned_students_pending
      - invitation_expiring_soon
      - backup_overdue_reminder
      - skipped_duplicates
      - total_created
  created_notifications:
    type: array
    maxItems: 500
    items:
      $ref: "./Notification.yaml"
required:
  - reference_date
  - dry_run
  - evaluated_counts
  - created_notifications
