type: object
additionalProperties: false
properties:
  entry_type:
    type: string
    enum:
      - transferee
      - shiftee
  origin_school:
    type: string
    minLength: 1
    maxLength: 250
    pattern: \S
  original_course_code:
    type: string
    minLength: 1
    maxLength: 100
    pattern: \S
  original_course_title:
    type: string
    minLength: 1
    maxLength: 250
    pattern: \S
  units:
    type: number
    exclusiveMinimum: 0
    multipleOf: 0.25
  grade:
    type: string
    minLength: 4
    maxLength: 4
    pattern: '^(?:[12]\.\d{2}|3\.00)$'
    description: Passing grade on the institutional 1.00–3.00 scale, formatted to two decimals.
  destination_curriculum_term_course_id:
    type: string
    format: uuid
  reason:
    type: string
    minLength: 1
    maxLength: 2000
    pattern: \S
required:
  - entry_type
  - origin_school
  - original_course_code
  - original_course_title
  - units
  - grade
  - destination_curriculum_term_course_id
  - reason
