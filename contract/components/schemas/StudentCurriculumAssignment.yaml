type: object
required:
  - id
  - student_id
  - curriculum_version_id
  - start_date
properties:
  id:
    type: string
    format: uuid
    readOnly: true
  student_id:
    type: string
    format: uuid
  curriculum_version_id:
    type: string
    format: uuid
  start_date:
    type: string
    format: date
  end_date:
    type:
      - string
      - "null"
    format: date
  change_note:
    type:
      - string
      - "null"
    maxLength: 2000
  created_at:
    type: string
    format: date-time
    readOnly: true
