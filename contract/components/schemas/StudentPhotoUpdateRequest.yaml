type: object
additionalProperties: false
properties:
  storage_object_path:
    type:
      - string
      - "null"
    minLength: 1
    maxLength: 512
    pattern: \S
    description: >-
      Object key inside the private `student-photos` Supabase Storage bucket (e.g.
      `students/<student_id>/avatar.png`). The backend checks its bytes, decodes the image,
      and stores a protected validated copy before updating the profile photo URL.
  avatar_url:
    type: string
    minLength: 1
    maxLength: 2048
    pattern: \S
  mime_type:
    type: string
    enum:
      - image/jpeg
      - image/png
    description: Supported student profile photo MIME types (PNG or JPG only, matching the UI control).
  file_size_bytes:
    type: integer
    minimum: 1
    maximum: 5242880
    description: File size in bytes; maximum 5 MiB (`5,242,880` bytes).
required:
  - avatar_url
  - mime_type
  - file_size_bytes
