type: object
additionalProperties: false
properties:
  storage_object_path:
    type: string
    minLength: 1
    maxLength: 512
    pattern: \S
    description: >-
      Single-use staging key in the private `student-photos` bucket (e.g.
      `students/00000000-0000-4000-8000-000000000001/upload-00000000-0000-4000-8000-000000000002.png`).
      Use a fresh UUID for each upload and a .png, .jpg, or .jpeg extension that matches
      the MIME type. The backend validates the image and saves a separate protected copy.
  avatar_url:
    type: string
    minLength: 1
    maxLength: 2048
    pattern: \S
  mime_type:
    type: string
    enum:
      - image/jpeg
      - image/png
    description: Supported student profile photo MIME types (static PNG or JPEG).
  file_size_bytes:
    type: integer
    minimum: 1
    maximum: 5242880
    description: File size in bytes; maximum 5 MiB (`5,242,880` bytes).
required:
  - storage_object_path
  - avatar_url
  - mime_type
  - file_size_bytes
