type: object
required:
  - id
  - student_id
  - course_offering_id
  - curriculum_term_course_id
  - status
  - midterm_grade
  - final_grade
  - inc_deadline
  - units_attempted
  - created_by
  - updated_by
  - revision
  - created_at
  - updated_at
properties:
  id:
    type: string
    format: uuid
    readOnly: true
  student_id:
    type: string
    format: uuid
  course_offering_id:
    type: string
    format: uuid
  curriculum_term_course_id:
    type:
      - string
      - "null"
    format: uuid
  status:
    $ref: "./AttemptStatus.yaml"
  midterm_status:
    anyOf:
      - $ref: "./MidtermStatus.yaml"
      - type: "null"
  midterm_grade:
    type:
      - number
      - "null"
    minimum: 1
    maximum: 5
    multipleOf: 0.25
  final_grade:
    type:
      - number
      - "null"
    minimum: 1
    maximum: 5
    multipleOf: 0.25
  inc_deadline:
    type:
      - string
      - "null"
    format: date
  instructor:
    type:
      - string
      - "null"
    maxLength: 150
  prerequisite_override:
    type: boolean
  prerequisite_grade_override:
    type: boolean
  units_attempted:
    type: number
    minimum: 0
    multipleOf: 0.25
    readOnly: true
  created_by:
    type: string
    format: uuid
    readOnly: true
  updated_by:
    type: string
    format: uuid
    readOnly: true
  revision:
    type: integer
    minimum: 0
    readOnly: true
  created_at:
    type: string
    format: date-time
    readOnly: true
  updated_at:
    type: string
    format: date-time
    readOnly: true
