name: CI

on:
  push:
    branches:
      [main, staging, dev, feat/contract-mock, feat/backend, feat/frontend]
    paths-ignore:
      - "docs/**"
      - "mockup/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE.md"
  pull_request:
    branches:
      [main, staging, dev, feat/contract-mock, feat/backend, feat/frontend]
    paths-ignore:
      - "docs/**"
      - "mockup/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE.md"

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint API Contract (Redocly)
        run: npm run contract:lint

      - name: Verify Contract Security Boundaries
        run: npm run contract:security

      - name: Run OWASP API Security Audit (Spectral)
        run: npm run contract:spectral

      - name: Verify Contract Freshness
        run: npm run contract:check

      - name: Build Static Redoc Documentation
        run: |
          if ! npm run contract:docs; then
            echo "::error file=contract/openapi.yaml::Failed to generate static Redoc bundle from canonical contract/openapi.yaml via 'npm run contract:docs'."
            exit 1
          fi
          if [ ! -s docs/openapi/index.html ]; then
            echo "::error file=docs/openapi/index.html::Static Redoc bundle docs/openapi/index.html was not created or is empty."
            exit 1
          fi

      - name: Upload Static Redoc Bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-redoc-bundle
          path: docs/openapi/index.html
          if-no-files-found: error
          retention-days: 14

      - name: Verify documentation access boundary
        run: node --test scripts/docs-endpoint.test.js

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier Formatting for Changed Files
        run: npm run format:check

      - name: Build Production Bundle
        run: npm run build

      - name: Install Chromium for prototype browser tests
        run: npx playwright install --with-deps chromium

      - name: Run mockup prototype browser tests
        run: npm run test:prototype:e2e

      - name: Check production documentation assets
        run: node --test scripts/docs-build.test.js

      - name: Run Tests with Coverage
        run: npx vitest run --coverage --passWithNoTests

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
