name: CI

on:
  push:
    branches:
      [main, staging, dev, feat/contract-mock, feat/backend, feat/frontend]
    paths-ignore:
      - "docs/**"
      - "mockup/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE.md"
  pull_request:
    branches:
      [main, staging, dev, feat/contract-mock, feat/backend, feat/frontend]
    paths-ignore:
      - "docs/**"
      - "mockup/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE.md"

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint API Contract (Redocly)
        run: npm run contract:lint

      - name: Verify Contract Security Boundaries
        run: npm run contract:security

      - name: Run OWASP API Security Audit (Spectral)
        run: npm run contract:spectral

      - name: Verify Contract Freshness
        run: npm run contract:check

      - name: Build Static Redoc Documentation
        run: |
          if ! npm run contract:docs; then
            echo "::error file=contract/openapi.yaml::Failed to generate static Redoc bundle from canonical contract/openapi.yaml via 'npm run contract:docs'."
            exit 1
          fi
          if [ ! -s docs/openapi/index.html ]; then
            echo "::error file=docs/openapi/index.html::Static Redoc bundle docs/openapi/index.html was not created or is empty."
            exit 1
          fi

      - name: Upload Static Redoc Bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi-redoc-bundle
          path: docs/openapi/index.html
          if-no-files-found: error
          retention-days: 14

      - name: Verify documentation access boundary
        run: node --test scripts/docs-endpoint.test.js

      - name: Run Typecheck
        run: npm run typecheck

      - name: Check Edge Function types
        run: node node_modules/typescript/bin/tsc -p supabase/tsconfig.json

      - name: Run Edge Function HTTP and contract tests
        run: node --test supabase/tests/*.test.mjs

      - name: Run ESLint
        run: npm run lint

      - name: Test changed-file formatting selection
        run: node --test scripts/check-changed-format.test.js

      - name: Check Prettier Formatting for Changed Files
        run: npm run format:check

      - name: Build Production Bundle
        run: npm run build

      - name: Install Chromium for prototype browser tests
        run: npx playwright install --with-deps chromium

      - name: Run mockup prototype browser tests
        run: npm run test:prototype:e2e

      - name: Check production documentation assets
        run: node --test scripts/docs-build.test.js

      - name: Run Tests with Coverage
        run: npx vitest run --coverage --passWithNoTests

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  database:
    name: Supabase database tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.111.0
      - name: Start local Supabase Auth and Data API with synthetic seed
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor >/dev/null
      - name: Verify signed-in attempt-result projection through PostgREST
        run: node --test supabase/tools/test-attempt-result-gateway.mjs
      - name: Verify Auth signup hook and synthetic seed
        run: node --test supabase/tools/test-auth-and-seed.mjs
      - name: Reset local database without seed
        run: supabase db reset --local --no-seed
      - name: Run pgTAP
        run: node supabase/tools/test-pgtap.cjs
      - name: Run domain, application, and concurrency regression suites
        id: postgres-regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          export PG_BINARY_DIR="$(pg_config --bindir)"
          node supabase/tools/test-database.cjs
      - name: Print PostgreSQL regression diagnostics
        if: ${{ failure() && steps.postgres-regressions.outcome == 'failure' }}
        run: |
          log_dir=supabase/.temp
          log="$log_dir/jerome-pg.log"
          if [ -r "$log" ]; then
            cat "$log"
          else
            echo "::warning::Expected PostgreSQL log is missing or unreadable: $log"
            if [ -d "$log_dir" ]; then
              find "$log_dir" -maxdepth 3 -type f \( -iname '*postgres*.log' -o -iname '*pg*.log' \) \
                -print -exec tail -n 100 {} \;
              ls -ld "$log_dir" "$log_dir/jerome-pg" 2>/dev/null || true
            else
              echo "PostgreSQL temporary directory was not created."
            fi
            postgres_bin="$(pg_config --bindir 2>/dev/null)" &&
              "$postgres_bin/postgres" --version || true
            ss -ltn '( sport = :55432 )' || true
          fi
