name: CI

on:
  push:
    branches: [main, staging, dev]
    paths-ignore:
      - 'docs/**'
      - 'mockup/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE.md'
  pull_request:
    branches: [main, staging, dev]
    paths-ignore:
      - 'docs/**'
      - 'mockup/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE.md'

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint API Contract (Redocly)
        run: npm run contract:lint

      - name: Verify Contract Security Boundaries
        run: npm run contract:security

      - name: Run OWASP API Security Audit (Spectral)
        run: npm run contract:spectral

      - name: Verify Contract Freshness
        run: npm run contract:check

      - name: Build Static Redoc Documentation
        run: |
          if ! npm run contract:docs; then
            echo "::error file=contract/openapi.yaml::Failed to generate static Redoc bundle from canonical contract/openapi.yaml via 'npm run contract:docs'."
            exit 1
          fi
          if [ ! -s docs/openapi/index.html ]; then
            echo "::error file=docs/openapi/index.html::Static Redoc bundle docs/openapi/index.html was not created or is empty."
            exit 1
          fi

      - name: Upload Static Redoc Bundle
        uses: actions/upload-artifact@v4
        with:
          name: openapi-redoc-bundle
          path: docs/openapi/index.html
          if-no-files-found: error
          retention-days: 14

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

      - name: Run Tests with Coverage
        run: npx vitest run --coverage --passWithNoTests

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
