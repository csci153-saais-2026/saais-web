name: CI

on:
  push:
    branches: [main, staging, dev, feat/contract-mock, feat/backend]
    paths-ignore:
      - 'docs/**'
      - 'mockup/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE.md'
  pull_request:
    branches: [main, staging, dev, feat/contract-mock, feat/backend]
    paths-ignore:
      - 'docs/**'
      - 'mockup/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE.md'

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci --package-lock=true

      - name: Lint API Contract (Redocly)
        run: npm run contract:lint

      - name: Verify Contract Security Boundaries
        run: npm run contract:security

      - name: Verify Contract Freshness
        run: npm run contract:check

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

      - name: Run Tests with Coverage
        run: npx vitest run --coverage --passWithNoTests

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
