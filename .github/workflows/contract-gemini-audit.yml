name: Gemini OpenAPI Security & Contract Audit

on:
  pull_request:
    paths:
      - "contract/**"

permissions:
  pull-requests: write
  contents: read

jobs:
  gemini-contract-audit:
    name: Gemini Contract Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini OpenAPI Security Audit
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const path = 'contract/openapi.yaml';

            if (!fs.existsSync(path)) {
              console.log('No contract/openapi.yaml found.');
              return;
            }

            const contractContent = fs.readFileSync(path, 'utf8');

            const prompt = `
            You are a Senior Application Security & API Architect auditing an OpenAPI 3.1 contract for the Student Academic Advising Information System (SAAIS).

            Audit the following OpenAPI contract for:
            1. **OWASP API Security Top 10**: Check for missing security schemes (bearerAuth), missing error responses (400, 401, 403, 404, 500), unvalidated query/path parameters, and excessive data exposure.
            2. **Role-Based Authorization Clarity**: Ensure endpoints indicate which roles (student, adviser, admin) have access.
            3. **SAAIS Invariant Protections**: Verify operations handling sensitive transactions (adviser reassignment, prerequisite override, elective mapping, equivalency) have appropriate schemas and error shapes.

            Treat x-saais-invariants as the confirmed business rules, not gaps to replace with new workflows.
            In particular: students are read-only; prerequisite clearance corrects the original failed grade
            without an approval queue; equivalencies are student-specific, not global course mappings.
            Inspect the complete current contract before claiming endpoints, pagination or role metadata are absent.
            x-required-roles and validation bounds document requirements but do not prove runtime enforcement.
            Distinguish contract defects from implementation checks that cannot be verified from OpenAPI alone.
            For read-only PostgREST collections, hidden/missing rows may return 200 []; do not demand a 404 for them.

            Provide an actionable, structured markdown audit with:
            - 🛡️ **Security Summary (Score /100)**
            - ⚠️ **Potential Flaws / Missing Schemas**
            - 💡 **Concrete Fixes / Recommendations**

            OpenAPI Contract Content:
            \`\`\`yaml
            ${contractContent}
            \`\`\`
            `;

            try {
              let reviewText;
              for (let attempt = 0; attempt < 3; attempt++) {
                const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${process.env.GEMINI_API_KEY}`,
                {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  signal: AbortSignal.timeout(60000),
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                  })
                }
                );

                const result = await response.json();
                if (!response.ok || result.error) {
                  if ([429, 500, 502, 503, 504].includes(response.status) && attempt < 2) {
                    console.log(`Gemini temporarily unavailable (HTTP ${response.status}); retrying.`);
                    await new Promise(resolve => setTimeout(resolve, 2000 * (attempt + 1)));
                    continue;
                  }
                  throw new Error(`Gemini audit unavailable (HTTP ${response.status}); no security review was produced.`);
                }
                reviewText = result.candidates?.[0]?.content?.parts
                  ?.map(part => part.text || '').join('').trim();
                if (!reviewText) throw new Error('Gemini returned no review; audit is incomplete.');
                break;
              }

              const commentBody = `### 🤖 Gemini OpenAPI Security Audit\n\n${reviewText}\n\n*Audited automatically by Gemini in CI*`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            } catch (err) {
              console.error('Failed to run Gemini audit:', err);
              core.setFailed(err.message);
            }
