name: Gemini OpenAPI Security & Contract Audit

on:
  pull_request:
    paths:
      - "contract/**"

permissions:
  pull-requests: write
  contents: read

jobs:
  gemini-contract-audit:
    name: Gemini Contract Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini OpenAPI Security Audit
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const path = 'contract/openapi.yaml';

            if (!fs.existsSync(path)) {
              console.log('No contract/openapi.yaml found.');
              return;
            }

            const contractContent = fs.readFileSync(path, 'utf8');

            const prompt = `
            You are a Senior Application Security & API Architect auditing an OpenAPI 3.1 contract for the Student Academic Advising Information System (SAAIS).

            Audit the following OpenAPI contract for:
            1. **OWASP API Security Top 10**: Check for missing security schemes (bearerAuth), missing error responses (400, 401, 403, 404, 500), unvalidated query/path parameters, and excessive data exposure.
            2. **Role-Based Authorization Clarity**: Ensure endpoints indicate which roles (student, adviser, admin) have access.
            3. **SAAIS Invariant Protections**: Verify operations handling sensitive transactions (adviser reassignment, prerequisite override, elective mapping, equivalency) have appropriate schemas and error shapes.

            Provide an actionable, structured markdown audit with:
            - 🛡️ **Security Summary (Score /100)**
            - ⚠️ **Potential Flaws / Missing Schemas**
            - 💡 **Concrete Fixes / Recommendations**

            OpenAPI Contract Content:
            \`\`\`yaml
            ${contractContent}
            \`\`\`
            `;

            try {
              const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${process.env.GEMINI_API_KEY}`,
                {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                  })
                }
              );

              const result = await response.json();
              const reviewText = result.candidates?.[0]?.content?.parts?.[0]?.text || (result.error ? `Error: ${result.error.message}` : "Unable to generate review.");

              const commentBody = `### 🤖 Gemini OpenAPI Security Audit\n\n${reviewText}\n\n*Audited automatically by Gemini in CI*`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            } catch (err) {
              console.error('Failed to run Gemini audit:', err);
              core.setFailed(err.message);
            }
