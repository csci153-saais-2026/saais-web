name: Semgrep SAST Scan

on:
  push:
    branches:
      [
        main,
        staging,
        dev,
        feat/contract-mock,
        feat/backend,
        feat/frontend,
        feat/integration-deployment,
      ]
    paths-ignore:
      - "docs/**"
      - "mockup/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE.md"
  pull_request:
    branches:
      [
        main,
        staging,
        dev,
        feat/contract-mock,
        feat/backend,
        feat/frontend,
        feat/integration-deployment,
      ]
    paths-ignore:
      - "docs/**"
      - "mockup/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE.md"

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep Code Scanning
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep and Generate SARIF
        run: |
          semgrep scan --config auto --sarif --output semgrep.sarif

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@42213152a85ae7569bdb6bec7bcd74cd691bfe41 # v3.30.9
        with:
          sarif_file: semgrep.sarif
        if: always()
